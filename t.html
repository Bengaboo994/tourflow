<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#071226"/>
<title>Your Viewing Day — TourFlow</title>
<meta property="og:title" content="Your Viewing Day — TourFlow"/>
<meta property="og:description" content="Your personalised property viewing itinerary."/>
<meta property="og:type" content="website"/>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" href="/favicon.png" sizes="32x32"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Jost',system-ui,sans-serif;background:#FCFBF7;color:#2D2B28;max-width:480px;margin:0 auto;min-height:100vh;font-weight:300}
.wrap{padding:20px 18px 60px}
.card{background:#fff;border-radius:14px;border:1px solid #edeae4;padding:16px;margin-bottom:14px}
.lbl{font-size:10px;font-weight:500;color:#9e9a94;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;display:block}
.pill{background:#f5f2ec;color:#6b6560;font-size:10px;font-weight:500;padding:3px 9px;border-radius:100px;display:inline-block}

/* Loading */
#loading{position:fixed;inset:0;background:#071226;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
#error{display:none;padding:40px 24px;text-align:center}

/* Property cards */
.prop-card{border-radius:20px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.07);margin-bottom:28px;border:1px solid #edeae4;background:#fff}
.prop-img{height:280px;overflow:hidden;position:relative}
.prop-img img{width:100%;height:100%;object-fit:cover}
.prop-body{padding:18px 18px 22px}
.spec-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.spec-chip{display:flex;align-items:center;gap:4px;background:#f5f2ec;border:1px solid #edeae4;border-radius:6px;padding:4px 9px;font-size:11px;font-weight:700;color:#2D2B28}
.hl-chip{display:inline-flex;align-items:center;gap:3px;background:#f5f2ec;border:1px solid #edeae4;border-radius:100px;padding:5px 12px;font-size:10px;font-weight:500;color:#6b6560;white-space:nowrap}

/* Timeline */
.timeline-wrap{background:#071226;padding:10px 20px 14px;overflow-x:auto;border-bottom:1px solid rgba(255,255,255,.06)}
.timeline{display:flex;align-items:flex-start;min-width:max-content}

/* Footer */
.footer{background:#0e1824;overflow:hidden;display:flex;align-items:stretch;min-height:170px}
.closing{background:#071226;padding:36px 28px 32px;text-align:center;border-top:1px solid rgba(201,161,74,.15)}
</style>
</head>
<body>

<!-- Loading splash -->
<div id="loading">
  <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#C9A14A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:18px"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0116 0z"/><circle cx="12" cy="10" r="3"/></svg>
  <span style="font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:300;color:#fff;letter-spacing:.02em">Tour<span style="font-style:italic;color:#C9A14A">Flow</span></span>
  <span style="font-size:13px;color:rgba(255,255,255,.4);margin-top:16px">Loading your viewing day...</span>
</div>

<!-- Error state -->
<div id="error">
  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#C9A14A" stroke-width="1.4" stroke-linecap="round" style="margin-bottom:16px"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0116 0z"/><circle cx="12" cy="10" r="3"/></svg>
  <div style="font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;color:#2D2B28;margin-bottom:8px">Tour not found</div>
  <div style="font-size:13px;color:#9e9a94;line-height:1.6">This link may have expired or been removed. Please contact your agent for a new link.</div>
</div>

<!-- Main content -->
<div id="main" style="display:none"></div>

<script>
var SUPA_URL='https://smcubfgpnrkguxqxbgva.supabase.co';
var SUPA_KEY='sb_publishable_bxMQR1TGA87XfM_n2lMCkw_7au6V0wY';

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(d){if(!d)return'';try{return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});}catch(e){return d;}}
function getDomain(url){try{return new URL(url).hostname.replace('www.','');}catch(e){return url||'';}}

var ICON={
  'Walking distance to beach':'🌊','Pool':'🏊','Private pool':'🏊','Community pool':'🏊',
  'Garage':'🚗','Sea view':'🌅','South facing':'☀️','Large terrace':'🪴',
  'Private garden':'🌿','Key ready':'🔑','Recently renovated':'🔨',
  'Excellent condition':'⭐','Good condition':'✓','Poor condition':'—',
  'Near golf':'⛳','Prime location':'📍','Quiet area':'🌲',
  'Close to amenities':'🏪','Restaurants nearby':'🍽️','New build':'🏗️',
  'Family friendly':'👨‍👩‍👧','Holiday home potential':'🏖️','Rental potential':'📈',
  'Hot listing':'🔥','Excellent value':'💎','Lift':'🔼',
  'Gated community':'🔒','Investment property':'📊'
};

var ET={
  meetingpoint:{icon:'📍',label:'Meeting Point',col:'#071226',brd:'rgba(201,161,74,.3)',txt:'#fff'},
  lunch:{icon:'🍽️',label:'Lunch',col:'#f2f7f2',brd:'#c8ddc8',txt:'#2d5a2d'},
  coffee:{icon:'☕',label:'Coffee',col:'#fef9ee',brd:'#fde68a',txt:'#78350f'},
  drive:{icon:'🚗',label:'Drive',col:'#f8fafc',brd:'#e2e8f0',txt:'#475569'},
  meeting:{icon:'🕐',label:'Meeting',col:'#eff6ff',brd:'#bfdbfe',txt:'#1e40af'},
  other:{icon:'📌',label:'Other',col:'#f8fafc',brd:'#e2e8f0',txt:'#475569'},
  pickup:{icon:'🚗',label:'Pickup',col:'#f8fafc',brd:'#e2e8f0',txt:'#475569'}
};
function getET(k){return ET[k]||ET.other;}

function render(tour){
  var day=tour;
  var c=tour.client||{};
  var cfg=tour.cfg||{};
  var props=(tour.properties||[]).sort(function(a,b){return(a.time||'zz').localeCompare(b.time||'zz');});
  var evs=tour.events||[];
  var all=props.map(function(p){return{k:'p',t:p.time||'',d:p};})
    .concat(evs.map(function(e){return{k:'e',t:e.time||'',d:e};}))
    .sort(function(a,b){return(a.t||'zz').localeCompare(b.t||'zz');});

  var firstTime=props.length?props[0].time:'';
  var lastTime=props.length>1?props[props.length-1].time:'';
  var pLen=props.length;

  // ── TIMELINE ──────────────────────────────────────────────────────────
  var tlItems=[];
  var tlAll=[];
  evs.forEach(function(ev){tlAll.push({t:ev.time||'',ev:ev});});
  var pn=0;
  props.forEach(function(p){pn++;tlAll.push({t:p.time||'',pp:p,num:pn});});
  tlAll.sort(function(a,b){return(a.t||'zz').localeCompare(b.t||'zz');});
  tlAll.forEach(function(item){
    if(item.ev){
      var ev=item.ev;
      if(ev.type==='meetingpoint')tlItems.push({label:esc(ev.title||'Meeting point'),sub:ev.time||'',type:'mp'});
      else tlItems.push({label:esc(ev.title||ev.type),sub:ev.time||'',type:'ev',evType:ev.type});
    }else{
      tlItems.push({label:esc(item.pp.area||item.pp.title||'Property'),sub:item.pp.time||'',num:item.num,type:'prop'});
    }
  });
  tlItems.push({label:'End',sub:'End of tour',type:'end'});

  var tlHtml=tlItems.length>1?
    '<div class="timeline-wrap"><div class="timeline">'+
    tlItems.map(function(tl,tli){
      var isLast=tli===tlItems.length-1;
      var dot=tl.type==='prop'
        ?'<div style="width:24px;height:24px;border-radius:50%;background:#C9A14A;color:#071226;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+tl.num+'</div>'
        :tl.type==='mp'
        ?'<div style="width:24px;height:24px;border-radius:50%;background:rgba(201,161,74,.2);border:1.5px solid #C9A14A;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px">🏠</div>'
        :tl.type==='ev'
        ?'<div style="width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px">'+(getET(tl.evType).icon||'📌')+'</div>'
        :'<div style="width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>';
      var line=!isLast?'<div style="flex:1;height:1.5px;background:rgba(201,161,74,.25);margin-top:11px;min-width:20px"></div>':'';
      var preLine=tli>0&&isLast?'<div style="flex:1;height:1.5px;background:rgba(201,161,74,.25);margin-top:11px;min-width:20px"></div>':'';
      return'<div style="display:flex;align-items:flex-start;flex:'+(isLast?'0':'1')+'">'+preLine+
        '<div style="display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0">'+dot+
        '<div style="font-size:8px;font-weight:500;color:#fff;text-align:center;line-height:1.2;white-space:nowrap">'+tl.sub+'</div>'+
        '<div style="font-size:7px;color:rgba(255,255,255,.35);text-align:center;line-height:1.2;white-space:nowrap">'+tl.label+'</div>'+
        '</div>'+line+'</div>';
    }).join('')+
    '</div></div>':'';

  // ── STATS BAR ─────────────────────────────────────────────────────────
  var statsBar='<div style="background:#071226;padding:10px 20px;display:flex;justify-content:space-around;border-bottom:1px solid rgba(255,255,255,.06)">'+
    '<div style="text-align:center"><div style="font-family:\'Cormorant Garamond\',serif;font-size:18px;font-weight:400;color:#C9A14A;line-height:1">'+pLen+'</div>'+
    '<div style="font-size:8px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em;margin-top:1px">Propert'+(pLen===1?'y':'ies')+'</div></div>'+
    (firstTime?'<div style="text-align:center"><div style="font-family:\'Cormorant Garamond\',serif;font-size:18px;font-weight:400;color:#C9A14A;line-height:1">'+esc(firstTime)+'</div>'+
    '<div style="font-size:8px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em;margin-top:1px">Start time</div></div>':'')+
    (lastTime?'<div style="text-align:center"><div style="font-family:\'Cormorant Garamond\',serif;font-size:18px;font-weight:400;color:#C9A14A;line-height:1">'+esc(lastTime)+'</div>'+
    '<div style="font-size:8px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em;margin-top:1px">End time</div></div>':'')+
    '</div>';

  // ── COVER HEADER ──────────────────────────────────────────────────────
  var coverHdr='<div style="background:#071226;padding:26px 22px 28px">'+
    '<div style="font-size:8px;font-weight:600;color:#C9A14A;text-transform:uppercase;letter-spacing:.22em;margin-bottom:10px">Personalised Viewing Day</div>'+
    (c.name?'<div style="font-family:\'Cormorant Garamond\',serif;font-size:36px;font-weight:300;color:#fff;line-height:1.0;letter-spacing:-.3px;margin-bottom:3px">'+esc(c.name)+'</div>':'<div style="height:10px"></div>')+
    '<div style="font-size:12px;color:rgba(255,255,255,.35);font-weight:300;margin-bottom:22px">'+fmtDate(day.date)+'</div>'+
    '<div style="height:1px;background:linear-gradient(90deg,rgba(201,161,74,.4),transparent);margin-bottom:14px"></div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px">'+
    (firstTime&&lastTime?'<span style="font-size:10px;color:rgba(255,255,255,.5);background:rgba(255,255,255,.07);border-radius:100px;padding:3px 9px">'+esc(firstTime)+' – '+esc(lastTime)+'</span>':'')+
    (pLen?'<span style="font-size:10px;color:rgba(255,255,255,.5);background:rgba(255,255,255,.07);border-radius:100px;padding:3px 9px">'+pLen+' propert'+(pLen===1?'y':'ies')+'</span>':'')+
    (evs.some(function(ev){return ev.type==='lunch';})?'<span style="font-size:10px;color:rgba(255,255,255,.5);background:rgba(255,255,255,.07);border-radius:100px;padding:3px 9px">Lunch included</span>':'')+
    '</div>'+
    '<div style="display:flex;gap:0">'+
    '<div style="flex:1;border-right:1px solid rgba(255,255,255,.07);padding-right:14px;margin-right:14px">'+
    '<div style="font-family:\'Cormorant Garamond\',serif;font-size:25px;font-weight:400;color:#C9A14A;line-height:1">'+pLen+'</div>'+
    '<div style="font-size:9px;color:rgba(255,255,255,.28);text-transform:uppercase;letter-spacing:.1em;margin-top:3px">Propert'+(pLen===1?'y':'ies')+'</div></div>'+
    (firstTime?'<div style="flex:1;border-right:1px solid rgba(255,255,255,.07);padding-right:14px;margin-right:14px">'+
    '<div style="font-family:\'Cormorant Garamond\',serif;font-size:25px;font-weight:400;color:#C9A14A;line-height:1">'+esc(firstTime)+'</div>'+
    '<div style="font-size:9px;color:rgba(255,255,255,.28);text-transform:uppercase;letter-spacing:.1em;margin-top:3px">First Viewing</div></div>':'')+
    (lastTime&&pLen>1?'<div style="flex:1">'+
    '<div style="font-family:\'Cormorant Garamond\',serif;font-size:25px;font-weight:400;color:#C9A14A;line-height:1">'+esc(lastTime)+'</div>'+
    '<div style="font-size:9px;color:rgba(255,255,255,.28);text-transform:uppercase;letter-spacing:.1em;margin-top:3px">Last Viewing</div></div>':'')+
    '</div></div>';

  // ── REQUIREMENTS ──────────────────────────────────────────────────────
  var req=c.req||{};
  var mustHave=req.mustHave||[];
  var budgetLabels={'b150':'€0–150k','b250':'€150k–250k','b400':'€250k–400k','b600':'€400k–600k','b1000':'€600k–1M','b2000':'€1M–2M','nolimit':'No limit'};
  var reqLines=[];
  if(req.budget)reqLines.push(budgetLabels[req.budget]||req.budget);
  if(req.minrooms&&req.minrooms!=='studio')reqLines.push(req.minrooms+'+ bedrooms');
  if(req.type&&req.type.length){
    var tl={apt:'Apartment',villa:'Villa',townhouse:'Townhouse',semidetached:'Semi-detached',quad:'Quad house',bungalow:'Bungalow',penthouse:'Penthouse'};
    reqLines.push((Array.isArray(req.type)?req.type:[req.type]).map(function(t){return tl[t]||t;}).join(', '));
  }
  mustHave.forEach(function(f){reqLines.push(f);});
  var reqHtml=reqLines.length?
    '<div style="padding:16px 22px;border-top:1px solid rgba(255,255,255,.06)">'+
    '<div style="font-size:8px;font-weight:600;color:#C9A14A;text-transform:uppercase;letter-spacing:.16em;margin-bottom:10px">Your Requirements</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:5px">'+
    reqLines.map(function(r){return'<span style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:100px;padding:3px 10px;font-size:11px;color:rgba(255,255,255,.75)">✓ '+esc(r)+'</span>';}).join('')+
    '</div></div>':'';

  // ── WELCOME MESSAGE ───────────────────────────────────────────────────
  var welcomeHtml=day.welcomeMsg?
    '<div style="padding:22px 22px 16px;border-top:1px solid rgba(255,255,255,.06)">'+
    '<div style="font-size:8px;font-weight:600;color:#C9A14A;text-transform:uppercase;letter-spacing:.16em;margin-bottom:8px">A personal note</div>'+
    '<div style="font-family:\'Cormorant Garamond\',serif;font-size:17px;color:rgba(255,255,255,.88);line-height:1.75;font-style:italic">&ldquo;'+esc(day.welcomeMsg)+'&rdquo;</div>'+
    '</div>':'';

  // ── PROPERTY ROWS ─────────────────────────────────────────────────────
  var pi=0;
  var rows=all.map(function(item){
    if(item.k==='e'){
      var e=item.d, et=getET(e.type);
      if(e.type==='meetingpoint'){
        return'<div style="background:#071226;padding:11px 20px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:12px">'+
          '<div style="font-size:20px">📍</div>'+
          '<div><div style="font-size:8px;font-weight:600;color:#C9A14A;text-transform:uppercase;letter-spacing:.12em;margin-bottom:1px">Meeting Point</div>'+
          '<div style="font-size:14px;color:#fff;font-weight:500">'+esc(e.title||'Meeting Point')+'</div>'+
          (e.time?'<div style="font-size:11px;color:rgba(255,255,255,.4)">'+esc(e.time)+'</div>':'')+
          '</div></div>';
      }
      return'<div style="padding:12px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #edeae4;background:'+et.col+'">'+
        '<span style="font-size:18px">'+et.icon+'</span>'+
        '<div>'+(e.time?'<span style="font-weight:700;font-size:13px;color:'+et.txt+'">'+esc(e.time)+'</span> ':'')+
        '<span style="font-size:13px;color:'+et.txt+';font-weight:600">'+esc(e.title||et.label)+'</span>'+
        (e.note?'<span style="font-size:12px;color:'+et.txt+';opacity:.7"> · '+esc(e.note)+'</span>':'')+
        '</div></div>';
    }

    var p=item.d; var idx=pi++;
    var fmtPrice=(function(){var pr=(p.price||'').trim().replace(/EUR/i,'').replace(/€/g,'').replace(/kr$/,'').trim();if(!pr)return'';return'€'+parseInt(pr.replace(/[^0-9]/g,''),10).toLocaleString('en-US');})();
    var hl=p.highlights||[];
    var displayArea=p.area||'';
    var street=p.address||'';

    var imgHtml=p.ogImage
      ?'<div class="prop-img"><img src="'+esc(p.ogImage)+'" alt="Property"/>'+(p.topPick?'<div style="position:absolute;top:10px;left:10px;background:linear-gradient(90deg,#C9A14A,#d4a84b);border-radius:5px;padding:3px 8px;font-size:8px;font-weight:600;color:#fff;text-transform:uppercase;letter-spacing:.08em">⭐ Top Pick</div>':'')+'</div>'
      :'<div style="height:80px;background:linear-gradient(135deg,#1a2535,#071226);position:relative;display:flex;align-items:center;justify-content:center">'+(p.topPick?'<div style="position:absolute;top:10px;left:10px;background:linear-gradient(90deg,#C9A14A,#d4a84b);border-radius:5px;padding:3px 8px;font-size:8px;font-weight:600;color:#fff;text-transform:uppercase">⭐ Top Pick</div>':'')+
      '<div style="font-family:\'Cormorant Garamond\',serif;font-size:36px;font-weight:300;color:rgba(201,161,74,.1)">'+(idx+1)+'</div></div>';

    var hlChips=hl.slice(0,8).map(function(h){
      return'<span class="hl-chip">'+(ICON[h]?'<span>'+ICON[h]+'</span> ':'')+esc(h)+'</span>';
    }).join('');

    return'<div class="prop-card">'+
      imgHtml+
      '<div class="prop-body">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'+
      '<div style="display:flex;align-items:center;gap:7px">'+
      '<div style="width:22px;height:22px;border-radius:50%;background:#071226;display:flex;align-items:center;justify-content:center;color:#C9A14A;font-size:10px;font-weight:700">'+(idx+1)+'</div>'+
      (p.time?'<span style="font-size:13px;font-weight:600;color:#2D2B28">'+esc(p.time)+'</span>':'')+
      '</div>'+
      (fmtPrice?'<div style="font-family:\'Cormorant Garamond\',serif;font-size:26px;color:#C9A14A;font-weight:600;letter-spacing:-.3px">'+esc(fmtPrice)+'</div>':'')+
      '</div>'+
      (p.title?'<div style="font-family:\'Cormorant Garamond\',serif;font-size:23px;color:#071226;font-weight:400;margin-bottom:5px;line-height:1.2;letter-spacing:-.2px">'+esc(p.title)+'</div>':'')+
      '<div style="margin-bottom:12px">'+
      (displayArea?'<span style="font-size:14px;font-weight:700;color:#2D2B28">'+esc(displayArea)+'</span>':'')+
      (displayArea&&street?'<span style="font-size:13px;color:#9e9a94"> | </span>':'')+
      (street?'<span style="font-size:13px;color:#9e9a94">'+esc(street)+'</span>':'')+
      '</div>'+
      (p.rooms||p.bathrooms||p.sqm?
        '<div class="spec-row">'+
        (p.rooms?'<div class="spec-chip">🛏 '+esc(p.rooms)+'</div>':'')+
        (p.bathrooms?'<div class="spec-chip">🚿 '+esc(p.bathrooms)+'</div>':'')+
        (p.sqm?'<div class="spec-chip">'+esc(p.sqm.replace(/m2$/i,''))+'m²</div>':'')+
        '</div>':'')+
      (p.mapsUrl?'<a href="'+esc(p.mapsUrl)+'" style="display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:#6b6560;text-decoration:none;border:1.5px solid #edeae4;border-radius:8px;padding:7px 12px;background:#faf8f4;margin-bottom:10px">📍 Directions</a>':'')+

// ── LOAD TOUR ────────────────────────────────────────────────────────────────
var params=new URLSearchParams(window.location.search);
var publicId=params.get('id');

if(!publicId){
  document.getElementById('loading').style.display='none';
  document.getElementById('error').style.display='block';
} else {
  // Try Supabase first
  fetch(SUPA_URL+'/rest/v1/public_tours?public_id=eq.'+encodeURIComponent(publicId)+'&select=tour_data',{
    headers:{
      'apikey':SUPA_KEY,
      'Authorization':'Bearer '+SUPA_KEY
    }
  }).then(function(r){return r.json();})
  .then(function(data){
    if(data&&data.length&&data[0].tour_data){
      render(data[0].tour_data);
    } else {
      // Fallback to localStorage (for offline/demo)
      try{
        var store=JSON.parse(localStorage.getItem('tf-public')||'{}');
        var tour=store[publicId];
        if(tour){render(tour);}
        else{throw new Error('not found');}
      }catch(e){
        document.getElementById('loading').style.display='none';
        document.getElementById('error').style.display='block';
      }
    }
  }).catch(function(){
    // Fallback to localStorage
    try{
      var store=JSON.parse(localStorage.getItem('tf-public')||'{}');
      var tour=store[publicId];
      if(tour){render(tour);}
      else{
        document.getElementById('loading').style.display='none';
        document.getElementById('error').style.display='block';
      }
    }catch(e){
      document.getElementById('loading').style.display='none';
      document.getElementById('error').style.display='block';
    }
  });
}
</script>
