  // present, otherwise estimate the last viewing runs about an hour and

  function addMinutesToTime(hhmm,mins){

    var parts=hhmm.split(':');
    var h=parseInt(parts[0],10),m=parseInt(parts[1],10);
    if(isNaN(h)||isNaN(m))return'';
    var total=h*60+m+mins;
    total=((total%1440)+1440)%1440;
    var nh=Math.floor(total/60),nm=total%60;
    return (nh<10?'0':'')+nh+':'+(nm<10?'0':'')+nm;

    "</div>"+

      (p.communityFee?"<div><div style='font-size:9px;color:#9e9a94;text-transform:uppercase;letter-spacing:.06em'>Community</div><div style='font-size:13px;font-weight:600;color:#2D2B28'>"+esc(p.communityFee)+"</div></div>":"")+
      (p.ibi?"<div style='padding-left:14px;border-left:1px solid #edeae4'><div style='font-size:9px;color:#9e9a94;text-transform:uppercase;letter-spacing:.06em'>IBI</div><div style='font-size:13px;font-weight:600;color:#2D2B28'>"+esc(p.ibi)+"</div></div>":"")+

    return "<div id='tf-sec-"+idx+"' style='scroll-margin-top:8px;border-radius:20px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.07);margin-bottom:24px;border:1px solid #edeae4;background:#fff'>"+
      imgBlock+

      "<div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:8px'>"+
      "<div style='display:flex;align-items:center;gap:8px'>"+
      "<div style='width:24px;height:24px;border-radius:50%;background:#071226;display:flex;align-items:center;justify-content:center;color:#C9A14A;font-size:10px;font-weight:700;flex-shrink:0'>"+(idx+1)+"</div>"+
      (p.time?"<span style='font-size:14px;font-weight:600;color:#2D2B28'>"+esc(p.time)+"</span>":"")+
      "</div>"+
      (fmtPr?"<div style='font-family:Cormorant Garamond,serif;font-size:28px;color:#C9A14A;font-weight:600;letter-spacing:-.3px'>"+fmtPr+"</div>":"")+

      (p.title?"<div style='font-family:Cormorant Garamond,serif;font-size:24px;color:#071226;font-weight:400;margin-bottom:5px;line-height:1.2;letter-spacing:-.2px'>"+esc(p.title)+"</div>":"")+

      (displayArea?"<span style='font-size:14px;font-weight:600;color:#2D2B28'>"+esc(displayArea)+"</span>":"")+
      (displayArea&&street?"<span style='font-size:13px;color:#9e9a94'> &middot; </span>":"")+
      (street?"<span style='font-size:13px;color:#9e9a94'>"+esc(street)+"</span>":"")+
      "</div>"+

      (p.url?"<a href='"+esc(p.url)+"' target='_blank' style='display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:#C9A14A;text-decoration:none;background:#071226;border-radius:8px;padding:10px 13px;margin-bottom:12px;gap:6px'><svg width='12' height='12' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round'><path d='M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6'/><path d='M15 3h6v6'/><path d='M10 14L21 3'/></svg>View full listing</a>":"")+
      (p.agentRec?"<div style='border-top:1px solid #f0ece8;padding-top:10px;font-size:12px;color:#6b6560;line-height:1.6;font-style:italic'>\u201C"+esc(p.agentRec)+"\u201D</div>":"")+

  // ── FOOTER ────────────────────────────────────────────────────────────────
  var wa=cfg.phone?'https://wa.me/'+cfg.phone.replace(/[^0-9]/g,''):'';
  var agentFirst=cfg.agent?cfg.agent.split(' ')[0]:'';
  var footer=
    "<div style='background:linear-gradient(160deg,#0d1f38 0%,#071226 100%);border-radius:20px;overflow:hidden;margin:0 18px 20px;box-shadow:0 4px 24px rgba(7,18,38,.2);border:1px solid rgba(201,161,74,.08)'>"+

    // Consultant row
    "<div style='display:flex;align-items:stretch;min-height:150px'>"+
    "<div style='flex:1;padding:22px 20px;display:flex;flex-direction:column;justify-content:center'>"+
    "<div style='font-size:8px;font-weight:700;color:rgba(201,161,74,.5);text-transform:uppercase;letter-spacing:.22em;margin-bottom:9px'>Your Property Consultant</div>"+
    "<div style='font-family:Cormorant Garamond,serif;font-size:24px;color:#fff;font-weight:300;line-height:1.1;letter-spacing:-.2px;margin-bottom:2px'>"+esc(cfg.agent||cfg.agency||'Your Agent')+"</div>"+
    "<div style='font-size:10px;color:rgba(201,161,74,.5);font-style:italic;font-family:Cormorant Garamond,serif;margin-bottom:14px'>"+(cfg.agency?esc(cfg.agency):'Real Estate'+(agentFirst?' by '+esc(agentFirst):''))+"</div>"+
    "<div style='display:flex;gap:10px'>"+
    (wa?"<a href='"+wa+"' style='width:38px;height:38px;border-radius:50%;background:rgba(201,161,74,.1);border:1.5px solid rgba(201,161,74,.25);display:flex;align-items:center;justify-content:center;text-decoration:none'><svg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='#C9A14A' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z'/></svg></a>":'')+
    (cfg.phone?"<a href='tel:"+esc(cfg.phone)+"' style='width:38px;height:38px;border-radius:50%;background:rgba(201,161,74,.1);border:1.5px solid rgba(201,161,74,.25);display:flex;align-items:center;justify-content:center;text-decoration:none'><svg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='#C9A14A' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.362 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0122 16.92z'/></svg></a>":'')+
    (cfg.email?"<a href='mailto:"+esc(cfg.email)+"' style='width:38px;height:38px;border-radius:50%;background:rgba(201,161,74,.1);border:1.5px solid rgba(201,161,74,.25);display:flex;align-items:center;justify-content:center;text-decoration:none'><svg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='#C9A14A' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z'/><path d='M22 6l-10 7L2 6'/></svg></a>":'')+
    "</div></div>"+
    (cfg.photo?
      "<div style='width:120px;flex-shrink:0;position:relative;overflow:hidden'>"+
      "<img src='"+cfg.photo+"' style='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center'/>"+
      "<div style='position:absolute;inset:0;background:linear-gradient(to right,rgba(7,18,38,.3),transparent 40%)'></div>"+
      "</div>"
    :'<div style="width:0"></div>')+
    "</div>"+

    // Divider
    "<div style='height:1px;background:linear-gradient(90deg,transparent,rgba(201,161,74,.2),transparent);margin:0 20px'></div>"+

    // Thank You
    "<div style='padding:20px 22px 22px;text-align:center'>"+
    "<div style='font-size:8px;font-weight:600;color:rgba(201,161,74,.4);text-transform:uppercase;letter-spacing:.28em;margin-bottom:10px'>Thank You For Today</div>"+
    "<div style='font-family:Cormorant Garamond,serif;font-size:20px;font-weight:300;color:rgba(255,255,255,.85);line-height:1.5;font-style:italic;margin-bottom:8px'>I hope one of these homes felt right.</div>"+
    "<div style='font-size:11px;color:rgba(255,255,255,.22);line-height:1.7;max-width:240px;margin:0 auto'>Feel free to contact me if you\'d like a second viewing or have any questions.</div>"+
    "</div>"+

    "</div>";
  var closing=''

  // ── ASSEMBLE ──────────────────────────────────────────────────────────────
  var html=
    // Top nav
    "<div style='padding:16px 18px 0;display:flex;align-items:center;margin-bottom:0'>"+
    "<div style='display:flex;align-items:center;gap:7px'>"+
    "<svg width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='#C9A14A' stroke-width='1.8' stroke-linecap='round'><path d='M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0116 0z'/><circle cx='12' cy='10' r='3'/></svg>"+
    "<span style='font-family:Cormorant Garamond,serif;font-size:21px;font-weight:400;color:#2D2B28;letter-spacing:.01em'>Tour<span style='font-style:italic;color:#C9A14A'>Flow</span></span>"+
    "</div></div>"+

    // Dark cover card: stats + cover + welcome
    "<div style='background:linear-gradient(150deg,#0d1f38 0%,#071226 60%,#050e1a 100%);border-radius:20px;overflow:hidden;margin:16px 18px 24px;box-shadow:0 4px 24px rgba(7,18,38,.2)'>"+
    statsBar+
    coverHdr+
    welcomeHtml+
    "</div>"+

    // White cards + property cards (padded)
    "<div style='padding:0 18px'>"+
    reqCard+
    journeyCard+
    (pLen?"<div style='font-size:9px;font-weight:700;color:#C9A14A;text-transform:uppercase;letter-spacing:.22em;margin-bottom:16px'>Your Properties</div>":"")+
    propCards+
    "</div>"+

    footer+
    closing+

    "<div style='text-align:center;padding:20px 0'>"+
    "<div style='font-family:Cormorant Garamond,serif;font-size:13px;color:#2D2B28;opacity:.18'>Tour<span style='font-style:italic'>Flow</span></div>"+
    "</div>";

  document.getElementById('main').innerHTML=html;
  document.getElementById('main').style.display='block';
  document.getElementById('loading').style.display='none';
  if(c.name)document.title=c.name+"'s Viewing Day \u2014 TourFlow";
}

// Smooth scroll helper
function tfScrollTo(id){
  var el=document.getElementById(id);
  if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
}

// ── LOAD ────────────────────────────────────────────────────────────────────
var params=new URLSearchParams(window.location.search);
var publicId=params.get('id');
if(!publicId){
  document.getElementById('loading').style.display='none';
  document.getElementById('error').style.display='block';
}else{
  fetch(SUPA_URL+'/rest/v1/public_tours?public_id=eq.'+encodeURIComponent(publicId)+'&select=tour_data',{
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
  }).then(function(r){return r.json();})
  .then(function(data){
    if(data&&data.length&&data[0].tour_data){render(data[0].tour_data);}
    else{throw new Error('not found');}
  }).catch(function(){
    try{
      var store=JSON.parse(localStorage.getItem('tf-public')||'{}');
      var tour=store[publicId];
      if(tour){render(tour);}
      else{
        document.getElementById('loading').style.display='none';
        document.getElementById('error').style.display='block';
      }
    }catch(e){
      document.getElementById('loading').style.display='none';
      document.getElementById('error').style.display='block';
    }
  });
}
