<head>

<title>TourFlow — Guided Tour</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#1A1917;
  --paper:#FCFBF7;
  --brass:#C9A14A;
  --slate:#4a4744;
  --fog:#edeae4;
  --mist:#f5f2ec;
  --navy:#071226;
}
body{font-family:'Jost',system-ui,sans-serif;background:var(--navy);color:#fff;min-height:100vh;font-weight:300;overscroll-behavior-y:contain;max-width:480px;margin:0 auto}
.screen{
  min-height:100vh;
  min-height:100dvh;
  height:100vh;
  height:100dvh;
  width:100%;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  scroll-snap-align:start;
}
#scroll-container{
  scroll-snap-type:y mandatory;
  overflow-y:auto;
  height:100vh;
  height:100dvh;
}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center}
.btn-go{
  width:100%;
  max-width:340px;
  padding:18px;
  background:linear-gradient(90deg,#C9A14A,#d4a84b);
  color:var(--navy);
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:700;
  letter-spacing:.03em;
  cursor:pointer;
  font-family:inherit;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  box-shadow:0 8px 24px rgba(201,161,74,.25);
}
.btn-secondary{
  width:100%;
  max-width:340px;
  padding:16px;
  background:rgba(255,255,255,.06);
  color:#fff;
  border:1.5px solid rgba(255,255,255,.15);
  border-radius:14px;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  font-family:inherit;
}
.eyebrow{
  font-size:10px;
  font-weight:600;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:rgba(201,161,74,.6);
  margin-bottom:10px;
}
#loading-screen{
  position:fixed;inset:0;background:var(--navy);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:9999;
}
.spinner{width:24px;height:24px;border:2.5px solid rgba(201,161,74,.2);border-top-color:#C9A14A;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.checkmark{
  width:18px;height:18px;border-radius:50%;
  background:rgba(201,161,74,.15);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.row:last-child{border-bottom:none}
.row-label{font-size:13px;color:rgba(255,255,255,.4)}
.row-value{font-size:14px;color:#fff;font-weight:500;text-align:right}
.section-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px;margin-bottom:16px;animation:cardIn .35s ease backwards}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.btn-go, .btn-secondary{transition:transform .12s ease, opacity .12s ease}
.btn-go:active, .btn-secondary:active{transform:scale(.97)}
.screen{animation:screenIn .3s ease}
@keyframes screenIn{from{opacity:.6}to{opacity:1}}
.section-title{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);margin-bottom:4px}
.action-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:14px 8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  border-radius:12px;color:#fff;text-decoration:none;font-size:11px;font-weight:500;
}
/* ── TOUR MODE — MAP + BOTTOM SHEET ── */
.tour-screen{
  position:relative;
  background:var(--navy);
  overflow:hidden;
}
.tour-map{
  position:absolute;
  top:0;left:0;right:0;
  height:50vh;
  height:50dvh;
  z-index:1;
}
.tour-map .leaflet-container{
  width:100%;
  height:100%!important;
  background:#e8e4d8;
}
.leaflet-control-attribution{font-size:8px!important;background:rgba(255,255,255,.5)!important}
.tour-map-fallback{
  width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#f0ede6;gap:10px;
}

/* Bottom sheet — tighter to map */
.tour-sheet{
  position:absolute;
  left:0;right:0;bottom:0;
  top:47vh;
  top:47dvh;
  z-index:20;
  background:#fff;
  border-radius:20px 20px 0 0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 -2px 16px rgba(7,18,38,.12);
}

/* Tour pill — lighter, smaller */
.tour-pill{
  position:absolute;
  top:12px;left:12px;right:12px;
  z-index:10;
  background:rgba(7,18,38,.82);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-radius:100px;
  padding:8px 16px;
  display:flex;
  align-items:center;
  gap:6px;
  color:#fff;
  font-size:11px;
  font-weight:600;
}
.tour-pill svg{flex-shrink:0}

/* Sheet handle */
.tour-sheet-handle{
  flex-shrink:0;
  display:flex;justify-content:center;
  padding:8px 0 4px;
}
.tour-sheet-handle::before{
  content:'';
  width:32px;height:4px;
  background:#e0dcd8;
  border-radius:2px;
}
.tour-sheet-scroll{
  flex:1;
  overflow-y:auto;
  padding:0 16px 8px;
  -webkit-overflow-scrolling:touch;
}

/* Property hero row — image slightly smaller, more text breathing room */
.tour-prop-row{
  display:flex;
  align-items:flex-start;
  gap:14px;
  margin-bottom:14px;
}
.tour-prop-img{
  width:110px;height:90px;
  border-radius:12px;
  object-fit:cover;
  flex-shrink:0;
  margin-top:2px;
}
.tour-prop-img-empty{
  width:110px;height:90px;
  border-radius:12px;
  background:var(--mist);
  flex-shrink:0;
}

/* Typography — matching mockup: huge area, bold title, clear address */
.tour-prop-area{
  font-family:'Jost',system-ui,sans-serif;
  font-size:32px;
  font-weight:800;
  color:var(--navy);
  line-height:.95;
  text-transform:uppercase;
  letter-spacing:-.3px;
}
.tour-prop-title{
  font-size:26px;
  color:var(--slate);
  margin-top:4px;
  font-weight:500;
  line-height:1.1;
}
.tour-prop-address{
  display:flex;align-items:center;gap:5px;
  font-size:13px;color:var(--slate);
  margin-top:6px;
  font-weight:400;
}

/* Stat blocks */
.tour-stats{
  display:flex;
  gap:0;
  background:var(--mist);
  border-radius:14px;
  overflow:hidden;
  margin-bottom:14px;
}
.tour-stat{
  flex:1;
  text-align:center;
  padding:13px 8px 11px;
  border-right:1px solid var(--fog);
}
.tour-stat:last-child{border-right:none}
.tour-stat-icon{margin-bottom:5px;display:flex;justify-content:center}
.tour-stat-val{
  font-size:28px;
  font-weight:800;
  color:var(--navy);
  line-height:1;
}
.tour-stat-lbl{
  font-size:9px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--slate);
  margin-top:3px;
}
.tour-stat-eta{
  font-size:12px;
  font-weight:700;
  color:var(--brass);
  margin-top:3px;
}

/* START TOUR — Spotify Play energy */
.btn-start-tour{
  width:100%;
  background:var(--navy);
  color:var(--brass);
  border:none;
  border-radius:16px;
  padding:20px;
  font-size:21px;
  font-weight:800;
  letter-spacing:.06em;
  font-family:inherit;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  cursor:pointer;
  margin-bottom:10px;
  transition:transform 180ms cubic-bezier(.34,1.4,.64,1), box-shadow 180ms ease, opacity 100ms ease;
  box-shadow:0 6px 28px rgba(7,18,38,.28), 0 0 0 0 rgba(201,161,74,0);
  animation:tourBtnPulse 3s ease-in-out infinite;
  -webkit-appearance:none;
  position:relative;
  overflow:hidden;
}
@keyframes tourBtnPulse{
  0%,100%{box-shadow:0 6px 28px rgba(7,18,38,.28),0 0 0 0 rgba(201,161,74,0)}
  50%{box-shadow:0 6px 28px rgba(7,18,38,.28),0 0 0 6px rgba(201,161,74,.12)}
}
.btn-start-tour:active{
  transform:scale(.96);
  box-shadow:0 2px 10px rgba(7,18,38,.2);
  opacity:.92;
  animation:none;
}
.btn-start-tour-icon{
  width:34px;height:34px;
  background:var(--brass);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow:0 2px 8px rgba(201,161,74,.4);
}

/* Mark completed */
.btn-mark-done{
  width:100%;
  background:#fff;
  color:var(--navy);
  border:1.5px solid var(--fog);
  border-radius:14px;
  padding:15px;
  font-size:15px;
  font-weight:600;
  font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;
  margin-bottom:12px;
  transition:background .15s, transform .12s cubic-bezier(.34,1.4,.64,1), border-color .15s;
  -webkit-appearance:none;
}
.btn-mark-done:active{background:var(--mist);transform:scale(.97);border-color:#C9A14A}

/* Remaining stops */
.remaining-stops-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 0;
  border-top:1px solid var(--fog);
  cursor:pointer;
}
.remaining-stops-header span{
  font-size:14px;
  font-weight:600;
  color:var(--navy);
}
.remaining-stops-list{
  display:none;
  padding-bottom:8px;
}
.remaining-stop-row{
  display:flex;align-items:center;gap:12px;
  padding:11px 0;
  border-bottom:1px solid var(--fog);
}
.remaining-stop-row:last-child{border-bottom:none}
.remaining-stop-row .rs-area{
  font-size:14px;font-weight:600;color:var(--navy);
}
.remaining-stop-row .rs-time{
  font-size:12px;color:var(--slate);margin-top:1px;
}

/* Mark-done animation states */
.tour-marker-completing{
  transition:all .4s cubic-bezier(.34,1.4,.64,1);
}

<body>

<div id="loading-screen">
  <div style="font-family:\'Cormorant Garamond\',serif;font-size:28px;font-weight:300;color:#fff;margin-bottom:18px">Tour<em style="font-style:italic;color:#C9A14A">Flow</em></div>
  <div class="spinner"></div>
</div>

<div id="access-denied" style="display:none;position:fixed;inset:0;background:var(--navy);align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px">
  <div style="font-size:40px;margin-bottom:16px">🔒</div>
  <div style="font-family:\'Cormorant Garamond\',serif;font-size:22px;margin-bottom:8px">Guided Tour Mode</div>
  <div style="font-size:13px;color:rgba(255,255,255,.4);max-width:280px;line-height:1.6">This experimental feature is currently in private testing.</div>
  <a href="/index.html" style="margin-top:24px;color:var(--brass);font-size:13px;text-decoration:none">&larr; Back to TourFlow</a>
</div>

<div id="scroll-container" style="display:none"></div>

<script>
// ── BETA WHITELIST ───────────────────────────────────────────────────────
var BETA_USERS = ['niklasbengtsson@hotmail.com'];

// ── SUPABASE ─────────────────────────────────────────────────────────────
var SUPA_URL = 'https://dhcqbdyrbviormfsdcyr.supabase.co';
var SUPA_KEY = 'sb_publishable_ZKyT9nBrTruUnVDZF0VrWQ_HefTPZB3';
var supa = null;
try {
  if (window.supabase && window.supabase.createClient) {
    supa = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  }
} catch(e) { console.error('Supabase init failed:', e); }

// ── STATE ────────────────────────────────────────────────────────────────
var GS = {
  did: null,
  day: null,
  client: null,
  cfg: null,
  currentUser: null,
  properties: [],
  currentIndex: -1, // -1 = today's tour screen, 0+ = property index, 'complete' string for final
};

function esc(s){return (s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtDate(d){if(!d)return"";try{return new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});}catch(e){return d;}}
function fmtPrice(p){
  if(!p)return"";
  var n=parseInt((p+"").replace(/[^0-9]/g,""),10);
  return isNaN(n)?p:"\u20AC"+n.toLocaleString("en-US");
}

// ── LOAD DATA ────────────────────────────────────────────────────────────
function getQueryParam(name){
  var params = new URLSearchParams(window.location.search);
  return params.get(name);
}

function loadGuidedTour(){
  var shareId = getQueryParam('share');
  if(shareId){
    loadSharedTour(shareId);
    return;
  }

  var did = getQueryParam('did');
  if(!did){
    showAccessDenied('No tour specified.');
    return;
  }
  GS.did = did;

  if(!supa){
    showAccessDenied('Could not connect.');
    return;
  }

  supa.auth.getSession().then(function(res){
    var session = res.data && res.data.session;
    if(!session || !session.user){
      showAccessDenied('Please sign in to TourFlow first.');
      return;
    }
    GS.currentUser = session.user;
    var email = (session.user.email || '').toLowerCase();
    if(BETA_USERS.indexOf(email) < 0){
      showAccessDenied();
      return;
    }
    fetchTourData(session.access_token);
  }).catch(function(){
    showAccessDenied('Could not verify session.');
  });
}

// Colleague share link (?share=publicId) — no Supabase Auth session required.
// Loads the full, unsanitized tour (unlike the client-facing t.html link) so a
// colleague covering the viewing sees everything the owner would: agent notes,
// contact details, commission, etc. Interaction (mark complete, add notes) works
// exactly as it does for the owner — that state was already session-only/in-memory
// and never persisted back to Supabase, so nothing changes there.
function loadSharedTour(shareId){
  fetch(SUPA_URL + '/rest/v1/agent_shared_tours?public_id=eq.' + encodeURIComponent(shareId) + '&select=tour_data', {
    headers: {'apikey': SUPA_KEY}
  })
  .then(function(r){ return r.json(); })
  .then(function(rows){
    var data = (rows && rows[0] && rows[0].tour_data) || null;
    if(!data){
      // Same-device fallback, in case the original write never reached Supabase
      try{
        var store = JSON.parse(localStorage.getItem('tf-agent-shared') || '{}');
        data = store[shareId] || null;
      }catch(e){}
    }
    if(!data){
      showAccessDenied('This share link is invalid or has expired.');
      return;
    }
    GS.did = shareId;
    GS.day = data;
    GS.properties = (data.properties || []).slice().sort(function(a,b){
      return (a.time||'zz').localeCompare(b.time||'zz');
    });
    GS.cfg = data.cfg || {};
    GS.client = data.client || null;
    GS.currentUser = null;
    renderApp();
  })
  .catch(function(e){
    console.error(e);
    showAccessDenied('Could not load this tour.');
  });
}

function fetchTourData(token){
  var headers = {'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + token};

  // index.html syncs to Supabase on a 1.5s debounce, so the server copy can
  // briefly lag behind what's already saved locally. Read the local cache
  // (same origin/localStorage key as index.html) and use whichever version
  // — local or remote — was touched more recently.
  var localDay = null;
  try{
    var localRaw = JSON.parse(localStorage.getItem('tf-v2') || '{}');
    if(localRaw.days){
      localDay = localRaw.days.find(function(d){ return d.id === GS.did; }) || null;
    }
  }catch(e){}

  fetch(SUPA_URL + '/rest/v1/agent_days?id=eq.' + GS.did + '&select=data', {headers: headers})
    .then(function(r){ return r.json(); })
    .then(function(rows){
      var remoteDay = (rows && rows.length) ? rows[0].data : null;
      if(!remoteDay && !localDay){
        showAccessDenied('Tour not found.');
        return;
      }
      GS.day = (localDay && (!remoteDay || (localDay.updatedAt||0) > (remoteDay.updatedAt||0)))
        ? localDay
        : remoteDay;
      GS.properties = (GS.day.properties || []).slice().sort(function(a,b){
        return (a.time||'zz').localeCompare(b.time||'zz');
      });

      var clientId = GS.day.clientId;
      var cfgPromise = fetch(SUPA_URL + '/rest/v1/agent_cfg?user_id=eq.' + GS.currentUser.id + '&select=data', {headers: headers}).then(function(r){return r.json();});
      var clientPromise = clientId
        ? fetch(SUPA_URL + '/rest/v1/agent_clients?id=eq.' + clientId + '&select=data', {headers: headers}).then(function(r){return r.json();})
        : Promise.resolve([]);

      Promise.all([cfgPromise, clientPromise]).then(function(results){
        var cfgRows = results[0];
        var clientRows = results[1];
        GS.cfg = (cfgRows && cfgRows[0] && cfgRows[0].data) || {};
        GS.client = (clientRows && clientRows[0] && clientRows[0].data) || null;
        renderApp();
      });
    })
    .catch(function(e){
      console.error(e);
      // Network/Supabase failure — fall back to local cache rather than blocking access
      if(localDay){
        GS.day = localDay;
        GS.properties = (GS.day.properties || []).slice().sort(function(a,b){
          return (a.time||'zz').localeCompare(b.time||'zz');
        });
        GS.cfg = {};
        GS.client = null;
        renderApp();
      } else {
        showAccessDenied('Could not load tour data.');
      }
    });
}

function showAccessDenied(msg){
  document.getElementById('loading-screen').style.display = 'none';
  var denied = document.getElementById('access-denied');
  denied.style.display = 'flex';
  if(msg){
    var sub = denied.querySelector('div[style*="rgba(255,255,255,.4)"]');
    if(sub) sub.textContent = msg;
  }
}

// ── DRIVE TIME (reuses existing Netlify function) ─────────────────────────
var driveTimeCache = {};
function fetchDriveTime(from, to, cb){
  var key = from + '||' + to;
  if(driveTimeCache[key]){ cb(driveTimeCache[key]); return; }
  if(!from || !to){ cb(null); return; }
  fetch('/.netlify/functions/drivetime', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({segments: [{from: from, to: to}]})
  }).then(function(r){return r.json();}).then(function(data){
    var result = data.results && data.results[0];
    if(result) driveTimeCache[key] = result;
    cb(result || null);
  }).catch(function(){ cb(null); });
}

// ── MATCH SCORE (simplified reuse) ────────────────────────────────────────
function matchScore(client, prop){
  if(!client || !client.req) return null;
  var req = client.req;
  var hl = prop.highlights || [];
  var results = [];
  if(req.budget){
    var bMax = req.budget==='nolimit' ? 99999999 : (parseInt(req.budget,10)||9999999);
    var rawPrice = parseFloat((prop.price||'').replace(/[^0-9.]/g,''))||0;
    if(rawPrice > 0) results.push(rawPrice <= bMax);
  }
  (req.mustHave||[]).forEach(function(f){ results.push(hl.indexOf(f) >= 0); });
  if(!results.length) return null;
  var passed = results.filter(Boolean).length;
  return Math.round(passed / results.length * 100);
}
function matchLabel(score){
  if(score == null) return null;
  if(score >= 90) return 'Excellent Match';
  if(score >= 75) return 'Good Match';
  if(score >= 60) return 'Possible Match';
  return 'Low Match';
}

// ── RENDER APP SHELL ───────────────────────────────────────────────────────
function renderApp(){
  document.getElementById('loading-screen').style.display = 'none';
  var container = document.getElementById('scroll-container');
  container.style.display = 'block';

  var html = '';
  // New flow: Preparing → Today's Tour (overview) → nav/prop/drive ... → complete
  html += renderPreparingScreen();
  html += renderTodaysTourScreen();

  GS.properties.forEach(function(p, i){
    html += renderNavigationScreen(i);
    html += renderPropertyScreen(p, i);
    if(i < GS.properties.length - 1){
      html += renderDriveScreen(i);
    }
  });
  html += renderCompleteScreen();

  container.innerHTML = html;

  // Disable scroll-snap until tour starts — prevents auto-snapping past Preparing
  container.style.scrollSnapType = 'none';
  container.scrollTop = 0;

  fetchAllDriveTimes();
  mountProgressUI();
  setTimeout(initTourMaps, 200);

  if(GS.tourStarted){
    container.style.scrollSnapType = 'y mandatory';
    var target = GS.currentNavTarget || 'nav-0';
    var el = document.getElementById('screen-' + target);
    if(el) el.scrollIntoView({behavior:'instant', block:'start'});
  } else {
    setTimeout(runPreparingSequence, 400);
  }
}

// ── TOUR PROGRESS (persistent floating button + overview) ─────────────────
var currentStopIdx = 0;

function mountProgressUI(){
  if(document.getElementById('progress-pill')) return; // already mounted

  var pill = document.createElement('button');
  pill.id = 'progress-pill';
  pill.onclick = openProgressModal;

function observeScreenForProgressPill(){
  var container = document.getElementById('scroll-container');
  if(!container) return;
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(!entry.isIntersecting) return;
      var id = entry.target.id || '';
      var pill = document.getElementById('progress-pill');
      if(!pill) return;
      if(id === 'screen-today' || id === 'screen-preparing' || id === 'screen-complete'){
        pill.style.display = 'none';
        return;
      }
      pill.style.display = 'flex';
      var m = id.match(/^screen-(?:nav|prop|drive)-(\d+)$/);
      if(m){
        var idx = parseInt(m[1], 10);
        // drive-N screens point to stop N+2 visually (next destination)
        var displayIdx = id.indexOf('drive-') >= 0 ? idx + 1 : idx;
        currentStopIdx = displayIdx;
        var label = document.getElementById('progress-pill-label');
        if(label) label.textContent = (displayIdx+1) + ' / ' + GS.properties.length;
      }
      // Invalidate Leaflet map when screen becomes visible
      var m2 = tourMaps[id];
      if(m2) setTimeout(function(){ m2.invalidateSize(); }, 100);
    });
  }, { threshold: 0.6 });
  GS.properties.forEach(function(p, i){
    var navEl = document.getElementById('screen-nav-' + i);
    var propEl = document.getElementById('screen-prop-' + i);
    var driveEl = document.getElementById('screen-drive-' + i);
    if(navEl) io.observe(navEl);
    if(propEl) io.observe(propEl);
    if(driveEl) io.observe(driveEl);
  });
  var todayEl = document.getElementById('screen-today');
  var prepEl = document.getElementById('screen-preparing');
  var completeEl = document.getElementById('screen-complete');
  if(todayEl) io.observe(todayEl);
  if(prepEl) io.observe(prepEl);
  if(completeEl) io.observe(completeEl);
}

function openProgressModal(){
  var list = document.getElementById('progress-modal-list');
  if(!list) return;
  list.innerHTML = GS.properties.map(function(p, i){
    var status = completedSet[i] ? 'done' : (i === currentStopIdx ? 'current' : 'upcoming');
    var icon, col, bg;
    if(status === 'done'){ icon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>'; col = '#22c55e'; bg = '#22c55e'; }
    else if(status === 'current'){ icon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="#071226"><path d="M8 5v14l11-7z"/></svg>'; col = '#C9A14A'; bg = '#C9A14A'; }
    else { icon = (i+1); col = 'rgba(255,255,255,.3)'; bg = 'rgba(255,255,255,.08)'; }
    var statusLabel = status === 'done' ? 'Completed' : status === 'current' ? 'Current' : 'Upcoming';
    var statusCol = status === 'done' ? '#4ade80' : status === 'current' ? '#C9A14A' : 'rgba(255,255,255,.3)';

function closeProgressModal(){

function jumpToStop(idx){
  closeProgressModal();
  if(completedSet[idx]){

  }

function calcEstimatedFinish(props){
  if(!props.length) return '—';
  var lastTime = props[props.length-1].time;
  if(!lastTime) return '—';
  var parts = lastTime.split(':');
  if(parts.length < 2) return lastTime;
  var mins = parseInt(parts[0],10)*60 + parseInt(parts[1],10) + 30; // assume ~30min for the final viewing
  var h = Math.floor(mins/60) % 24;
  var m = mins % 60;
  return (h<10?'0':'')+h + ':' + (m<10?'0':'')+m;
}

  steps.forEach(function(label, j){
    var row = document.createElement('div');
    row.id = 'prep-step-' + j;
    row.style.cssText = 'display:flex;align-items:center;gap:14px;padding:13px 0;' +
      (j < steps.length-1 ? 'border-bottom:1px solid var(--fog)' : '');
    row.innerHTML =
      '<div id="prep-icon-' + j + '" style="width:28px;height:28px;border-radius:50%;border:2px solid var(--fog);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .3s cubic-bezier(.34,1.4,.64,1)">' +
        '<svg id="prep-check-' + j + '" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--fog)" stroke-width="3" stroke-linecap="round" style="transition:stroke .25s ease"><path d="M20 6L9 17l-5-5"/></svg>' +
      '</div>' +
      '<div id="prep-label-' + j + '" style="font-size:15px;font-weight:500;color:var(--fog);transition:color .25s ease">' + esc(label) + '</div>';
    stepsEl.appendChild(row);
  });

  var i = 0;
  function activateStep(){
    if(i >= steps.length){
      setTimeout(function(){
        if(doneEl)  doneEl.style.display = 'block';
        if(shareEl) shareEl.style.display = 'flex';
        if(navigator.vibrate) navigator.vibrate([30,40,50]);
      }, 280);
      return;
    }
    var icon  = document.getElementById('prep-icon-' + i);
    var check = document.getElementById('prep-check-' + i);
    var label = document.getElementById('prep-label-' + i);
    if(icon){ icon.style.background='var(--brass)';icon.style.borderColor='var(--brass)';icon.style.transform='scale(1.1)';setTimeout(function(){if(icon)icon.style.transform='scale(1)';},260); }

    if(label){ label.style.color='var(--ink)';label.style.fontWeight='600'; }
    i++;

// Build a Google Maps navigation URL from a property (lat/lng preferred, fallback address)
function buildMapsUrl(p){
  if(p.lat && p.lng){
    return 'https://maps.google.com/?daddr=' + p.lat + ',' + p.lng + '&dirflg=d';
  }
  if(p.mapsUrl) return p.mapsUrl;
  if(p.address) return 'https://maps.google.com/?q=' + encodeURIComponent(p.address);
  return '';
}

function statBlock(val, label){
  return '<div style="text-align:center"><div style="font-family:\'Cormorant Garamond\',serif;font-size:22px;color:#fff">' + val + '</div><div style="font-size:9px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.1em;margin-top:2px">' + label + '</div></div>';
}

// Arms the visibility listener so returning from Maps shows arrival overlay
function trackMapsOpen(idx){
  navState.pendingStopIdx = idx;
  navState.mapsOpenedAt = Date.now();
}

function startNavigation(idx){
  var p = GS.properties[idx];
  var url = buildMapsUrl(p);

  // Double haptic — "launching" feel
  if(navigator.vibrate){ navigator.vibrate([30, 50, 80]); }

  // Brief visual press then open maps
  var btns = document.querySelectorAll('.btn-start-tour');
  btns.forEach(function(btn){
    btn.style.transform = 'scale(.95)';
    btn.style.opacity = '.8';
    setTimeout(function(){
      btn.style.transform = '';
      btn.style.opacity = '';
    }, 200);
  });

  trackMapsOpen(idx);
  setTimeout(function(){
    if(url){
      // On desktop open Maps in a popup; on mobile use location.href (no popup support)
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if(isMobile){
        window.location.href = url;
      } else {
        window.open(url, 'tourflow_maps', 'width=900,height=700,left=200,top=100,resizable=yes,scrollbars=yes');
      }
    }
  }, 150);
}

function manualArrival(idx){ showArrivalOverlay(idx); }

function reopenMaps(idx, mapsUrl){
  if(mapsUrl) window.location.href = mapsUrl;
  trackMapsOpen(idx);
  var bodyEl = document.getElementById('arrival-body');
  if(bodyEl) resetArrivalBodyToWelcome(idx);
}

function attemptGpsArrivalCheck(idx){
  var bodyEl = document.getElementById('arrival-body');
  if(!bodyEl) return;
  var p = GS.properties[idx];
  var mapsUrl = p ? (p.mapsUrl || '') : '';

  function fallbackToManual(){
    if(document.getElementById('arrival-body') === bodyEl){
      bodyEl.innerHTML = renderManualArrivalState(idx, p ? (p.title || p.area) : '', mapsUrl);
    }
  }

  if(!navigator.geolocation){ fallbackToManual(); return; }

  // Use lat/lng directly if available, else try to parse from mapsUrl
  var coords = (p && p.lat && p.lng) ? {lat:p.lat, lng:p.lng} : extractCoords(mapsUrl);
  if(!coords){ fallbackToManual(); return; }

  navigator.geolocation.getCurrentPosition(function(pos){
    var dist = haversineMeters(pos.coords.latitude, pos.coords.longitude, coords.lat, coords.lng);
    if(document.getElementById('arrival-body') !== bodyEl) return;
    if(dist <= 100){
      bodyEl.innerHTML = renderAutoArrivedState(idx, p ? (p.title || p.area) : '');
    } else {
      fallbackToManual();
    }
  }, function(){ fallbackToManual(); }, { timeout: 4000, maximumAge: 30000 });
}

// Extracts lat/lng from a Google Maps URL if present (covers common formats)
function extractCoords(mapsUrl){
  if(!mapsUrl) return null;
  var m = mapsUrl.match(/[@,]\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
  if(m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  var q = mapsUrl.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(q) return { lat: parseFloat(q[1]), lng: parseFloat(q[2]) };
  return null;
}

function haversineMeters(lat1, lon1, lat2, lon2){
  var R = 6371000;
  var dLat = (lat2-lat1) * Math.PI/180;
  var dLon = (lon2-lon1) * Math.PI/180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

var propQuestions = {}; // { idx: [{id, text, answered}] }

function getQuestions(idx){
  if(!propQuestions[idx]) propQuestions[idx] = [];
  return propQuestions[idx];
}

function addQuestion(idx){
  var input = document.getElementById('q-input-' + idx);
  if(!input) return;
  var text = input.value.trim();
  if(!text) return;
  var questions = getQuestions(idx);
  questions.push({ id: 'q' + Date.now(), text: text, answered: false });
  input.value = '';
  rerenderQuestions(idx);
}

function toggleQuestion(idx, qid){
  var questions = getQuestions(idx);
  var q = questions.find(function(x){ return x.id === qid; });
  if(q) q.answered = !q.answered;
  if(navigator.vibrate) navigator.vibrate(20);
  rerenderQuestions(idx);
}

function rerenderQuestions(idx){
  var el = document.getElementById('questions-' + idx);
  if(el) el.outerHTML = renderQuestionsBlock(idx);
}

function renderQuestionsBlock(idx){
  var questions = getQuestions(idx);

      '<span style="font-size:15px;color:var(--ink);font-weight:400">' + esc(q.text) + '</span>' +
      '</button>';

  var answeredRows = answered.map(function(q){
    return '<button onclick="toggleQuestion(' + idx + ',\'' + q.id + '\')" style="width:100%;display:flex;align-items:center;gap:12px;padding:10px 0;border:none;background:none;cursor:pointer;font-family:inherit;text-align:left;border-bottom:1px solid var(--fog)">' +

    '<input id="q-input-' + idx + '" type="text" placeholder="Add question…" ' +

var checklistState = {}; // { idx: { viewed:bool, questions:bool, feedback:bool } }

  if(!checklistState[idx]) checklistState[idx] = { viewed:false, questions:false, feedback:false };

}
function renderViewingChecklist(idx){

    ['feedback',  'Client feedback added']

function toggleChecklistItem(idx, key){
  var cl = getChecklist(idx);

// ── DRIVE SCREEN ──────────────────────────────────────────────────────────
// Functionally identical to the Navigation Screen — same arrival-overlay system —
// but framed as "driving to the next stop" rather than the very first destination.
// ── LEAFLET MAP INIT ─────────────────────────────────────────────────────────
function initTourMaps(){
  if(typeof L === 'undefined'){
    // Leaflet failed to load — show fallback on all maps
    document.querySelectorAll('.tour-map').forEach(function(el){
      showMapFallback(el);
    });
    return;
  }

  // Use OSM directly — most reliable, no API key, always available
  var tileUrl = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
  var tileOpts = { maxZoom:19, attribution:'&copy; OpenStreetMap contributors' };

  // Init Today's Tour overview map
  initMapForScreen('screen-today', GS.properties[0], -1);

  GS.properties.forEach(function(p, i){
    initMapForScreen('screen-nav-' + i, p, i);
  });
  for(var d = 0; d < GS.properties.length - 1; d++){
    initMapForScreen('screen-drive-' + d, GS.properties[d+1], d+1);
  }

  function showMapFallback(mapEl){
    mapEl.innerHTML =
      '<div class="tour-map-fallback">' +
      '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--slate)" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
      '<div style="font-size:12px;color:var(--slate);text-align:center;padding:0 20px">Set pins on your properties to enable the route map</div>' +
      '</div>';
  }

  function initMapForScreen(screenId, activeProp, activeIdx){
    var mapEl = document.getElementById('map-' + screenId);
    if(!mapEl) return;
    if(mapEl._leaflet_id) return; // already inited

  // Check if any property has coords
    var hasCoords = GS.properties.some(function(p){ return p.lat && p.lng; });
    if(!hasCoords){
      showMapFallback(mapEl);
      return;
    }

    try{
      var map = L.map(mapEl, {
        zoomControl:false,
        attributionControl:true,
        dragging:true,
        tap:false,
        scrollWheelZoom:false,
        doubleClickZoom:false
      });

      L.tileLayer(tileUrl, tileOpts).addTo(map);

      var bounds = [];

      GS.properties.forEach(function(p2, j){
        var lat = parseFloat(p2.lat), lng = parseFloat(p2.lng);
        if(!lat || !lng) return;

        var isActive    = activeIdx === -1 ? j === 0 : j === activeIdx;
        var isCompleted = activeIdx !== -1 && !!completedSet[j];

        var bg   = isActive ? '#C9A14A' : isCompleted ? '#9ca3af' : '#071226';
        var fg   = isActive ? '#071226' : '#fff';
        var size = isActive ? 36 : 30;

        var icon = L.divIcon({
          className:'',
          html:'<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+bg+';' +
               'border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.3);' +
               'display:flex;align-items:center;justify-content:center;' +
               'font-size:12px;font-weight:800;color:'+fg+';font-family:-apple-system,sans-serif">'+
               (j+1)+'</div>',
          iconSize:[size,size],
          iconAnchor:[size/2,size/2]
        });

        L.marker([lat,lng], {icon:icon}).addTo(map);
        bounds.push([lat,lng]);
      });

      // Route segments — colored by state:
      // completed = grey, active = gold, upcoming = navy (dashed placeholder until OSRM loads)
      var routePolylines = []; // store per-leg for later state updates
      if(bounds.length > 1){
        bounds.forEach(function(b, bi){
          if(bi === 0) return;
          var segBounds = [bounds[bi-1], b];
          var isCompleted = bi <= (activeIdx === -1 ? -1 : activeIdx - 1) || !!completedSet[bi-1];
          var isActive    = bi === (activeIdx === -1 ? 1 : activeIdx);
          var color  = isCompleted ? '#9ca3af' : isActive ? '#C9A14A' : '#071226';
          var opacity= isCompleted ? .35 : isActive ? .85 : .45;
          var weight = isActive ? 3.5 : 2.5;
          var pl = L.polyline(segBounds, {
            color: color, weight: weight, opacity: opacity,
            lineJoin:'round', lineCap:'round',
            dashArray: isCompleted || isActive ? null : '7 6'
          }).addTo(map);
          routePolylines.push({ line: pl, fromIdx: bi-1, toIdx: bi });
        });
      }

      // Store polylines on map instance for later updates
      map._tourSegments = routePolylines;

      // Fit map tighter
      if(bounds.length > 1){
        map.fitBounds(bounds, {padding:[24, 24]});
      } else if(bounds.length === 1){
        map.setView(bounds[0], 16);
      } else {
        map.setView([37.98,-0.68], 11);
      }

      // Fetch OSRM real road route, replace segment by segment
      if(bounds.length > 1){
        var coordStr = bounds.map(function(b){ return b[1]+','+b[0]; }).join(';');
        var osrmUrl = 'https://router.project-osrm.org/route/v1/driving/' + coordStr +
          '?overview=full&geometries=geojson&steps=false&annotations=false';
        fetch(osrmUrl)
          .then(function(r){ return r.json(); })
          .then(function(data){
            if(!data.routes || !data.routes[0]) return;
            var coords = data.routes[0].geometry.coordinates.map(function(c){
              return [c[1], c[0]];
            });
            // Remove placeholder segments, draw single road-following polyline
            routePolylines.forEach(function(seg){ map.removeLayer(seg.line); });
            routePolylines.length = 0;
            // Determine active segment color for the full route
            // For now draw full route as navy with gold overlay for active portion
            // (segment-level OSRM routing would require multiple requests)
            var isActiveMap = activeIdx >= 0;
            L.polyline(coords, {
              color: isActiveMap ? '#C9A14A' : '#071226',
              weight: 3,
              opacity: .65,
              lineJoin:'round',
              lineCap:'round'
            }).addTo(map);
            map.fitBounds(coords, {padding:[24, 24]});
          })
          .catch(function(){
            // OSRM unavailable — dashed placeholders already visible
          });
      }

      tourMaps[screenId] = map;

      // CRITICAL: invalidateSize after a tick so Leaflet sees real dimensions
      requestAnimationFrame(function(){
        map.invalidateSize();
        setTimeout(function(){ map.invalidateSize(); }, 300);
      });

    }catch(e){
      console.error('Map init error:', e);
      showMapFallback(mapEl);
    }
  }
}

function fetchAllDriveTimes(){
  var props = GS.properties;
  var locs = props.map(function(p){ return p.lat && p.lng ? p.lat+','+p.lng : (p.mapsUrl || p.address || ''); });
  var totalKm = 0;
  var totalDriveMin = 0;
  var pending = Math.max(0, locs.length - 1);

  function updateStatBlocks(propIdx, result){
    // Update nav screen for stop propIdx (arrives at this prop)
    // Nav screen = screen-nav-propIdx, drive screen = screen-drive-(propIdx-1)
    function setStats(prefix){
      var distEl = document.getElementById('stat-dist-' + propIdx);
      var minEl  = document.getElementById('stat-min-'  + propIdx);
      var etaEl  = document.getElementById('stat-eta-'  + propIdx);
      // If API failed but we have coords, compute straight-line distance as fallback
      if((!result || !result.ok) && props[propIdx-1] && props[propIdx] &&
         props[propIdx-1].lat && props[propIdx].lat){
        var km = haversineMeters(
          parseFloat(props[propIdx-1].lat), parseFloat(props[propIdx-1].lng),
          parseFloat(props[propIdx].lat),   parseFloat(props[propIdx].lng)
        ) / 1000;
        var estMin = Math.round(km / 0.5); // rough 30km/h urban estimate
        result = { ok: true, distanceKm: km.toFixed(1), durationMin: estMin, fallback: true };
      }
      if(result && result.ok){
        if(distEl) distEl.textContent = result.distanceKm + ' km' + (result.fallback ? '*' : '');
        if(minEl)  minEl.textContent  = result.durationMin + ' min' + (result.fallback ? '*' : '');
        if(etaEl){
          var d = new Date(Date.now() + parseInt(result.durationMin,10)*60000);
          var hh = d.getHours(), mm = d.getMinutes();
          etaEl.textContent = 'ETA ' + (hh<10?'0':'')+hh + ':' + (mm<10?'0':'')+mm;
        }
        totalKm += parseFloat(result.distanceKm)||0;
        totalDriveMin += parseInt(result.durationMin,10)||0;
        driveTimeCache[locs[propIdx-1]+'||'+locs[propIdx]] = result;
      }
    }
    setStats();
    pending--;
    if(pending <= 0){
      var totalEl = document.getElementById('total-distance');
      if(totalEl) totalEl.textContent = totalKm > 0 ? Math.round(totalKm) : '—';
      var pillText = document.getElementById('today-pill-text');
      if(pillText && totalKm > 0){
        pillText.innerHTML = '<span id="total-distance">' + Math.round(totalKm) + '</span> km';
      }
    }
  }

  // Fetch leg between each pair of consecutive properties
  for(var i = 1; i < props.length; i++){
    (function(idx){
      fetchDriveTime(locs[idx-1], locs[idx], function(result){
        updateStatBlocks(idx, result);
      });
    })(i);
  }

  // First stop: use meeting point as origin if set
  var mpEv = (GS.day.events||[]).find(function(e){ return e.type==='meetingpoint'; });
  var startLoc = mpEv ? (mpEv.title||mpEv.note||'') : '';
  if(startLoc && props.length && locs[0]){
    pending++;
    fetchDriveTime(startLoc, locs[0], function(result){
      // Update nav-0 stats
      var distEl = document.getElementById('stat-dist-0');
      var minEl  = document.getElementById('stat-min-0');
      var etaEl  = document.getElementById('stat-eta-0');
      if(result && result.ok){
        if(distEl) distEl.textContent = result.distanceKm;
        if(minEl)  minEl.textContent  = result.durationMin + ' min';
        if(etaEl){
          var d = new Date(Date.now() + parseInt(result.durationMin,10)*60000);
          var hh = d.getHours(), mm = d.getMinutes();
          etaEl.textContent = 'ETA ' + (hh<10?'0':'')+hh + ':' + (mm<10?'0':'')+mm;
        }
      }
      pending--;
    });
  }
}

function updateCompletionStats(){
  var done = Object.keys(completedSet).length;
  var n = GS.properties.length;
  var pct = n > 0 ? Math.round(done/n*100) : 0;

  var bar = document.getElementById('comp-bar');
  if(bar) setTimeout(function(){ bar.style.width = pct+'%'; }, 80);
  var cEl = document.getElementById('comp-count'); if(cEl) cEl.textContent = done+' of '+n+' viewings completed';
  var pEl = document.getElementById('comp-pct');   if(pEl) pEl.textContent = pct+'%';

  // Animate hero
  setTimeout(function(){
    var ring = document.getElementById('comp-check-ring');
    var path = document.getElementById('comp-check-path');
    if(ring) ring.style.transform = 'scale(1)';
    if(path) path.style.strokeDashoffset = '0';
    ['spark1','spark2','spark3'].forEach(function(id){
      var el = document.getElementById(id); if(el) el.style.opacity='1';
    });
    setTimeout(function(){
      ['spark1','spark2','spark3'].forEach(function(id){
        var el = document.getElementById(id); if(el) el.style.opacity='0';
      });
    }, 900);
  }, 200);

  ['comp-title','comp-client','comp-date'].forEach(function(id){
    var el=document.getElementById(id); if(el){el.style.opacity='1';el.style.transform='translateY(0)';}
  });
  var sm=document.getElementById('comp-summary'); if(sm){sm.style.opacity='1';sm.style.transform='translateY(0)';}
  var ac=document.getElementById('comp-actions'); if(ac) ac.style.opacity='1';

  // Stats
  var totalKm=0, totalDriveMin=0;
  GS.properties.forEach(function(a,i){
    if(i>=GS.properties.length-1) return;
    var b=GS.properties[i+1];
    var key=(a.lat&&a.lng?a.lat+','+a.lng:a.mapsUrl||a.address||'')+'||'+(b.lat&&b.lng?b.lat+','+b.lng:b.mapsUrl||b.address||'');
    var d=driveTimeCache[key];
    if(d&&d.ok){totalKm+=parseFloat(d.distanceKm)||0;totalDriveMin+=parseInt(d.durationMin)||0;}
  });
  var viewMin=tourStartTime?Math.round((Date.now()-tourStartTime)/60000):null;
  var totalQ=0,totalNotes=0;
  GS.properties.forEach(function(p,i){
    totalQ+=(propQuestions[i]||[]).length;
    if(p.note) totalNotes++;
  });

  function sc(id,v){var el=document.getElementById(id);if(el)el.textContent=v;}
  sc('comp-stat-viewings',done);
  sc('comp-stat-km',totalKm>0?Math.round(totalKm)+' km':'—');
  sc('comp-stat-drivetime',totalDriveMin>0?totalDriveMin+' min':'—');
  sc('comp-stat-viewtime',viewMin?viewMin+' min':'—');
  sc('comp-stat-questions',totalQ);
  sc('comp-stat-notes',totalNotes);

  // Follow-ups
  var followups=[];
  GS.properties.forEach(function(p,i){
    (propQuestions[i]||[]).filter(function(q){return!q.answered;}).forEach(function(q){
      followups.push({propIdx:i,text:q.text,prop:p});
    });
  });
  var fuEl=document.getElementById('comp-followups');
  if(fuEl&&followups.length){
    fuEl.style.display='block';
    fuEl.innerHTML='<div style="background:#fff;border:1px solid var(--fog);border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(7,18,38,.05)">' +
      '<div style="padding:14px 16px;border-bottom:1px solid var(--fog)">' +
      '<span style="font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--navy)">' +
      followups.length+' Follow-up'+(followups.length>1?'s':'')+' required</span></div>' +
      followups.map(function(fu){
        return '<button onclick="goToScreen(\'prop-'+fu.propIdx+'\')" style="width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;background:none;border:none;border-bottom:1px solid var(--fog);cursor:pointer;font-family:inherit;text-align:left">' +
          '<div style="width:36px;height:36px;border-radius:10px;background:#fef9ec;border:1px solid rgba(201,161,74,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--brass)" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg></div>' +
          '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;color:var(--navy);margin-bottom:2px">'+esc(fu.text)+'</div>' +
          '<div style="font-size:11px;color:var(--slate)">'+esc(fu.prop.area||fu.prop.title||'Property '+(fu.propIdx+1))+'</div></div>' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--fog)" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>';
      }).join('')+'</div>';
    setTimeout(function(){fuEl.style.opacity='1';fuEl.style.transform='translateY(0)';},50);
  }
}

var completedSet = {};
var tourStartTime = null;

function completeViewing(idx){
  completedSet[idx] = true;
  if(!tourStartTime) tourStartTime = Date.now();

  // Haptic feedback
  if(navigator.vibrate){ navigator.vibrate([40, 30, 60]); }

  // Update map route segments — grey out completed, gold next leg, pan to next stop
  var nextIdx = idx + 1;
  Object.keys(tourMaps).forEach(function(screenId){
    var map = tourMaps[screenId];
    if(!map) return;

    // Recolor segments
    if(map._tourSegments){
      map._tourSegments.forEach(function(seg){
        if(seg.fromIdx < nextIdx && seg.toIdx <= nextIdx){
          // Completed leg → grey
          seg.line.setStyle({color:'#9ca3af', opacity:.3, dashArray:null, weight:2});
        } else if(seg.fromIdx === idx && seg.toIdx === nextIdx){
          // Newly active leg → gold
          seg.line.setStyle({color:'#C9A14A', opacity:.85, dashArray:null, weight:3.5});
        }
      });
    }

    // Animate map markers
    map.eachLayer(function(layer){
      if(!layer._icon) return;
      var el = layer._icon.querySelector('div');
      if(!el) return;
      var txt = parseInt(el.textContent, 10);
      if(isNaN(txt)) return;
      var layerIdx = txt - 1;
      if(layerIdx === idx){
        el.style.transition = 'background .5s ease, color .3s ease';
        el.style.background = '#9ca3af';
        el.style.color = '#fff';
      } else if(layerIdx === nextIdx){
        el.style.transition = 'background .5s ease .2s, transform .5s cubic-bezier(.34,1.56,.64,1) .2s';
        el.style.background = '#C9A14A';
        el.style.color = '#071226';
        el.style.transform = 'scale(1.2)';
        setTimeout(function(){ el.style.transform = 'scale(1)'; }, 700);
      }
    });

    // Pan map smoothly to next stop
    var nextProp = GS.properties[nextIdx];
    if(nextProp && nextProp.lat && nextProp.lng){
      setTimeout(function(){
        map.panTo([parseFloat(nextProp.lat), parseFloat(nextProp.lng)], {animate:true, duration:.6});
      }, 400);
    }
  });

  // Auto-advance — go straight to next drive screen or complete
  setTimeout(function(){
    if(idx < GS.properties.length - 1){
      goToScreen('drive-' + idx);
    } else {
      goToScreen('complete');
    }
  }, 350);
}

    document.getElementById('celebration-check').style.transform = 'scale(1)';
    document.getElementById('celebration-title').style.opacity = '1';
    document.getElementById('celebration-sub').style.opacity = '1';
    var nextEl = document.getElementById('celebration-next');
    if(nextEl) nextEl.style.opacity = '1';
    document.getElementById('celebration-cta').style.opacity = '1';
    document.getElementById('celebration-progress-btn').style.opacity = '1';
  });
}

function proceedAfterCelebration(idx){
  var overlay = document.getElementById('celebration-overlay');
  if(overlay) overlay.remove();
  if(idx < GS.properties.length - 1){
    goToScreen('drive-' + idx);
  } else {
    goToScreen('complete');
  }
}

function closeCelebrationAndOpenProgress(){
  var overlay = document.getElementById('celebration-overlay');
  if(overlay) overlay.remove();
  openProgressModal();
}

function exportNotes(){
  var lines = [];
  GS.properties.forEach(function(p, i){
    lines.push((i+1) + '. ' + (p.title || p.area || 'Property') + ' \u2014 ' + fmtPrice(p.price));
    if(p.note) lines.push('   Note: ' + p.note);
  });
  var text = lines.join('\n');
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){ alert('Notes copied to clipboard'); });
  }
}

function copyWhatsappSummary(){
  var client = GS.client;
  var lines = ['Viewing day summary' + (client ? ' \u2014 ' + client.name : '') + ':', ''];
  GS.properties.forEach(function(p, i){
    lines.push((i+1) + '. ' + (p.title || p.area || 'Property') + ' \u2014 ' + fmtPrice(p.price));
  });
  var text = lines.join('\n');
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){ alert('Summary copied — paste into WhatsApp'); });
  }
}

// ── NAVIGATION BETWEEN SCREENS ────────────────────────────────────────────
function startTour(){
  if(navigator.vibrate) navigator.vibrate([30, 40, 60]);
  GS.tourStarted = true;
  GS.currentNavTarget = 'nav-0';
  var container = document.getElementById('scroll-container');
  if(container) container.style.scrollSnapType = 'y mandatory';
  // Go to day overview first — START TOUR there goes to nav-0
  setTimeout(function(){
    var el = document.getElementById('screen-today');
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 50);
}

function launchNavigation(){
  if(navigator.vibrate) navigator.vibrate([20, 30, 50]);
  setTimeout(function(){ goToScreen('nav-0'); }, 50);
}

function goToScreen(target){
  var id;
  if(target === 'preparing'){
    id = 'screen-preparing';
    setTimeout(runPreparingSequence, 350);
  } else if(target === 'today'){
    id = 'screen-today';
  } else if(target === 'complete'){
    id = 'screen-complete';
    updateCompletionStats();
  } else {
    id = 'screen-' + target;
  }
  // Track nav position so returning from Maps lands on the right screen
  if(target.indexOf('nav-') === 0 || target.indexOf('drive-') === 0){
    GS.currentNavTarget = target;
  }
  if(target.indexOf('prop-') === 0){
    navState.pendingStopIdx = null;
  }
  var el = document.getElementById(id);
  if(el) el.scrollIntoView({behavior: 'smooth', block: 'start'});
}

// ── INIT ─────────────────────────────────────────────────────────────────
loadGuidedTour();
</script>
