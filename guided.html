<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#071226"/>
<title>TourFlow — Guided Tour</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#2D2B28;
  --paper:#FCFBF7;
  --brass:#C9A14A;
  --slate:#6b6560;
  --fog:#edeae4;
  --mist:#f5f2ec;
  --navy:#071226;
}
body{font-family:'Jost',system-ui,sans-serif;background:var(--navy);color:#fff;min-height:100vh;font-weight:300;overscroll-behavior-y:contain}
.screen{
  min-height:100vh;
  min-height:100dvh;
  width:100%;
  display:flex;
  flex-direction:column;
  scroll-snap-align:start;
}
#scroll-container{
  scroll-snap-type:y mandatory;
  overflow-y:auto;
  height:100vh;
  height:100dvh;
}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center}
.btn-go{
  width:100%;
  max-width:340px;
  padding:18px;
  background:linear-gradient(90deg,#C9A14A,#d4a84b);
  color:var(--navy);
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:700;
  letter-spacing:.03em;
  cursor:pointer;
  font-family:inherit;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  box-shadow:0 8px 24px rgba(201,161,74,.25);
}
.btn-secondary{
  width:100%;
  max-width:340px;
  padding:16px;
  background:rgba(255,255,255,.06);
  color:#fff;
  border:1.5px solid rgba(255,255,255,.15);
  border-radius:14px;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  font-family:inherit;
}
.eyebrow{
  font-size:10px;
  font-weight:600;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:rgba(201,161,74,.6);
  margin-bottom:10px;
}
#loading-screen{
  position:fixed;inset:0;background:var(--navy);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:9999;
}
.spinner{width:24px;height:24px;border:2.5px solid rgba(201,161,74,.2);border-top-color:#C9A14A;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.checkmark{
  width:18px;height:18px;border-radius:50%;
  background:rgba(201,161,74,.15);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.row:last-child{border-bottom:none}
.row-label{font-size:13px;color:rgba(255,255,255,.4)}
.row-value{font-size:14px;color:#fff;font-weight:500;text-align:right}
.section-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px;margin-bottom:16px}
.section-title{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);margin-bottom:4px}
.action-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:14px 8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  border-radius:12px;color:#fff;text-decoration:none;font-size:11px;font-weight:500;
}
</style>
</head>
<body>

<div id="loading-screen">
  <div style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:#fff;margin-bottom:18px">Tour<em style="font-style:italic;color:#C9A14A">Flow</em></div>
  <div class="spinner"></div>
</div>

<div id="access-denied" style="display:none;position:fixed;inset:0;background:var(--navy);align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px">
  <div style="font-size:40px;margin-bottom:16px">🔒</div>
  <div style="font-family:'Cormorant Garamond',serif;font-size:22px;margin-bottom:8px">Guided Tour Mode</div>
  <div style="font-size:13px;color:rgba(255,255,255,.4);max-width:280px;line-height:1.6">This experimental feature is currently in private testing.</div>
  <a href="/index.html" style="margin-top:24px;color:var(--brass);font-size:13px;text-decoration:none">&larr; Back to TourFlow</a>
</div>

<div id="scroll-container" style="display:none"></div>

<script>
// ── BETA WHITELIST ───────────────────────────────────────────────────────
var BETA_USERS = ['niklasbengtsson@hotmail.com'];

// ── SUPABASE ─────────────────────────────────────────────────────────────
var SUPA_URL = 'https://dhcqbdyrbviormfsdcyr.supabase.co';
var SUPA_KEY = 'sb_publishable_ZKyT9nBrTruUnVDZF0VrWQ_HefTPZB3';
var supa = null;
try {
  if (window.supabase && window.supabase.createClient) {
    supa = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  }
} catch(e) { console.error('Supabase init failed:', e); }

// ── STATE ────────────────────────────────────────────────────────────────
var GS = {
  did: null,
  day: null,
  client: null,
  cfg: null,
  currentUser: null,
  properties: [],
  currentIndex: -1, // -1 = today's tour screen, 0+ = property index, 'complete' string for final
};

function esc(s){return (s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtDate(d){if(!d)return"";try{return new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});}catch(e){return d;}}
function fmtPrice(p){
  if(!p)return"";
  var n=parseInt((p+"").replace(/[^0-9]/g,""),10);
  return isNaN(n)?p:"\u20AC"+n.toLocaleString("en-US");
}

// ── LOAD DATA ────────────────────────────────────────────────────────────
function getQueryParam(name){
  var params = new URLSearchParams(window.location.search);
  return params.get(name);
}

function loadGuidedTour(){
  var did = getQueryParam('did');
  if(!did){
    showAccessDenied('No tour specified.');
    return;
  }
  GS.did = did;

  if(!supa){
    showAccessDenied('Could not connect.');
    return;
  }

  supa.auth.getSession().then(function(res){
    var session = res.data && res.data.session;
    if(!session || !session.user){
      showAccessDenied('Please sign in to TourFlow first.');
      return;
    }
    GS.currentUser = session.user;
    var email = (session.user.email || '').toLowerCase();
    if(BETA_USERS.indexOf(email) < 0){
      showAccessDenied();
      return;
    }
    fetchTourData(session.access_token);
  }).catch(function(){
    showAccessDenied('Could not verify session.');
  });
}

function fetchTourData(token){
  var headers = {'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + token};

  fetch(SUPA_URL + '/rest/v1/agent_days?id=eq.' + GS.did + '&select=data', {headers: headers})
    .then(function(r){ return r.json(); })
    .then(function(rows){
      if(!rows || !rows.length){
        showAccessDenied('Tour not found.');
        return;
      }
      GS.day = rows[0].data;
      GS.properties = (GS.day.properties || []).slice().sort(function(a,b){
        return (a.time||'zz').localeCompare(b.time||'zz');
      });

      var clientId = GS.day.clientId;
      var cfgPromise = fetch(SUPA_URL + '/rest/v1/agent_cfg?user_id=eq.' + GS.currentUser.id + '&select=data', {headers: headers}).then(function(r){return r.json();});
      var clientPromise = clientId
        ? fetch(SUPA_URL + '/rest/v1/agent_clients?id=eq.' + clientId + '&select=data', {headers: headers}).then(function(r){return r.json();})
        : Promise.resolve([]);

      Promise.all([cfgPromise, clientPromise]).then(function(results){
        var cfgRows = results[0];
        var clientRows = results[1];
        GS.cfg = (cfgRows && cfgRows[0] && cfgRows[0].data) || {};
        GS.client = (clientRows && clientRows[0] && clientRows[0].data) || null;
        renderApp();
      });
    })
    .catch(function(e){
      console.error(e);
      showAccessDenied('Could not load tour data.');
    });
}

function showAccessDenied(msg){
  document.getElementById('loading-screen').style.display = 'none';
  var denied = document.getElementById('access-denied');
  denied.style.display = 'flex';
  if(msg){
    var sub = denied.querySelector('div[style*="rgba(255,255,255,.4)"]');
    if(sub) sub.textContent = msg;
  }
}

// ── DRIVE TIME (reuses existing Netlify function) ─────────────────────────
var driveTimeCache = {};
function fetchDriveTime(from, to, cb){
  var key = from + '||' + to;
  if(driveTimeCache[key]){ cb(driveTimeCache[key]); return; }
  if(!from || !to){ cb(null); return; }
  fetch('/.netlify/functions/drivetime', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({segments: [{from: from, to: to}]})
  }).then(function(r){return r.json();}).then(function(data){
    var result = data.results && data.results[0];
    if(result) driveTimeCache[key] = result;
    cb(result || null);
  }).catch(function(){ cb(null); });
}

// ── MATCH SCORE (simplified reuse) ────────────────────────────────────────
function matchScore(client, prop){
  if(!client || !client.req) return null;
  var req = client.req;
  var hl = prop.highlights || [];
  var results = [];
  if(req.budget){
    var budgetMap = {'b150':150000,'b250':250000,'b400':400000,'b600':600000,'b1000':1000000,'b2000':2000000,'nolimit':99999999};
    var bMax = budgetMap[req.budget] || 9999999;
    var rawPrice = parseFloat((prop.price||'').replace(/[^0-9.]/g,''))||0;
    if(rawPrice > 0) results.push(rawPrice <= bMax);
  }
  (req.mustHave||[]).forEach(function(f){ results.push(hl.indexOf(f) >= 0); });
  if(!results.length) return null;
  var passed = results.filter(Boolean).length;
  return Math.round(passed / results.length * 100);
}
function matchLabel(score){
  if(score == null) return null;
  if(score >= 90) return 'Excellent Match';
  if(score >= 75) return 'Good Match';
  if(score >= 60) return 'Possible Match';
  return 'Low Match';
}

// ── RENDER APP SHELL ───────────────────────────────────────────────────────
function renderApp(){
  document.getElementById('loading-screen').style.display = 'none';
  var container = document.getElementById('scroll-container');
  container.style.display = 'block';

  var html = '';
  html += renderTodaysTourScreen();
  html += renderPreparingScreen();

  // Interleave: nav -> property -> drive -> property -> drive ... -> complete
  GS.properties.forEach(function(p, i){
    html += renderNavigationScreen(i);
    html += renderPropertyScreen(p, i);
    if(i < GS.properties.length - 1){
      html += renderDriveScreen(i);
    }
  });
  html += renderCompleteScreen();

  container.innerHTML = html;

  // Wire up drive time fetches
  fetchAllDriveTimes();
}

// ── SCREEN 1: TODAY'S TOUR ─────────────────────────────────────────────────
function renderTodaysTourScreen(){
  var day = GS.day;
  var client = GS.client;
  var props = GS.properties;
  var clientName = client ? client.name : 'Client';

  var firstTime = props.length ? props[0].time : '';
  var lastTime = props.length > 1 ? props[props.length-1].time : '';

  var timelineRows = props.map(function(p, i){
    return '<div class="row">' +
      '<div class="row-label">' + esc(p.time||'—') + '</div>' +
      '<div class="row-value">' + esc(p.title || p.area || ('Property ' + (i+1))) + '</div>' +
      '</div>';
  }).join('');

  return '<div class="screen center" id="screen-today" style="padding:40px 24px">' +
    '<div class="fade-in" style="width:100%;max-width:380px">' +
    '<div class="eyebrow" style="text-align:center">Today\'s Tour</div>' +
    '<div style="font-family:\'Cormorant Garamond\',serif;font-size:36px;font-weight:300;text-align:center;margin-bottom:6px">' + esc(clientName) + '</div>' +
    '<div style="font-size:13px;color:rgba(255,255,255,.4);text-align:center;margin-bottom:32px">' + fmtDate(day.date) + '</div>' +

    '<div style="display:flex;justify-content:center;gap:28px;margin-bottom:32px">' +
    '<div style="text-align:center"><div style="font-family:\'Cormorant Garamond\',serif;font-size:26px;color:#C9A14A">' + props.length + '</div><div style="font-size:9px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.1em;margin-top:2px">Properties</div></div>' +
    '<div style="width:1px;background:rgba(255,255,255,.1)"></div>' +
    '<div style="text-align:center"><div id="total-distance" style="font-family:\'Cormorant Garamond\',serif;font-size:26px;color:#C9A14A">—</div><div style="font-size:9px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.1em;margin-top:2px">Total Km</div></div>' +
    '<div style="width:1px;background:rgba(255,255,255,.1)"></div>' +
    '<div style="text-align:center"><div style="font-family:\'Cormorant Garamond\',serif;font-size:26px;color:#C9A14A">' + (firstTime && lastTime ? firstTime+'–'+lastTime : '—') + '</div><div style="font-size:9px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.1em;margin-top:2px">Schedule</div></div>' +
    '</div>' +

    '<div class="section-card">' +
    '<div class="section-title" style="margin-bottom:10px">Timeline</div>' +
    timelineRows +
    '</div>' +

    '<div style="display:flex;justify-content:center;margin-top:32px">' +
    '<button class="btn-go" onclick="goToScreen(\'preparing\')">&#9654; Start Tour</button>' +
    '</div>' +
    '<div style="text-align:center;margin-top:16px">' +
    '<a href="/index.html" style="color:rgba(255,255,255,.3);font-size:12px;text-decoration:none">&larr; Exit guided mode</a>' +
    '</div>' +

    '</div></div>';
}

// ── SCREEN 2: PREPARING ─────────────────────────────────────────────────────
function renderPreparingScreen(){
  return '<div class="screen center" id="screen-preparing" style="padding:40px 24px">' +
    '<div style="width:100%;max-width:320px;text-align:center" id="preparing-content">' +
    '<div style="font-family:\'Cormorant Garamond\',serif;font-size:24px;font-weight:300;margin-bottom:32px">Preparing today\u2019s tour&hellip;</div>' +
    '<div id="prep-steps" style="text-align:left;margin-bottom:32px"></div>' +
    '<div style="height:4px;background:rgba(255,255,255,.08);border-radius:100px;overflow:hidden;margin-bottom:32px">' +
    '<div id="prep-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#C9A14A,#d4a84b);transition:width .3s ease"></div>' +
    '</div>' +
    '<div id="prep-done" style="display:none">' +
    '<div style="font-size:14px;color:rgba(255,255,255,.6);margin-bottom:24px">Everything is ready</div>' +
    '<button class="btn-go" onclick="goToScreen(\'nav-0\')">&#9654; GO</button>' +
    '</div>' +
    '</div></div>';
}

function runPreparingSequence(){
  var steps = ['Loading properties', 'Preparing route', 'Loading contacts', 'Preparing agent notes', 'Optimising itinerary'];
  var stepsEl = document.getElementById('prep-steps');
  var barEl = document.getElementById('prep-bar');
  var doneEl = document.getElementById('prep-done');
  if(!stepsEl) return;
  stepsEl.innerHTML = '';
  doneEl.style.display = 'none';
  barEl.style.width = '0%';

  var i = 0;
  function nextStep(){
    if(i >= steps.length){
      setTimeout(function(){ doneEl.style.display = 'block'; }, 200);
      return;
    }
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;color:rgba(255,255,255,.7)';
    row.innerHTML = '<span class="checkmark pulse"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#C9A14A" stroke-width="3" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg></span><span>' + steps[i] + '</span>';
    stepsEl.appendChild(row);
    barEl.style.width = Math.round(((i+1)/steps.length)*100) + '%';
    i++;
    setTimeout(nextStep, 380);
  }
  nextStep();
}

// ── NAVIGATION SCREEN ────────────────────────────────────────────────────
// State: tracks whether the user has tapped "Open Google Maps" for the current stop,
// so we know whether to show the arrival check when they come back to the tab.
var navState = {
  pendingStopIdx: null,   // index of property the user is currently navigating to
  mapsOpenedAt: null      // timestamp when Maps was opened, for sanity-checking the return
};

function renderNavigationScreen(idx){
  var p = GS.properties[idx];
  var mapsUrl = p.mapsUrl || (p.address ? 'https://maps.google.com/?q=' + encodeURIComponent(p.address) : '');
  var driveInfo = idx > 0 ? driveTimeCache[(GS.properties[idx-1].mapsUrl||GS.properties[idx-1].address||'') + '||' + (p.mapsUrl||p.address||'')] : null;

  return '<div class="screen center" id="screen-nav-' + idx + '" style="padding:40px 24px;position:relative">' +

    '<div style="text-align:center;width:100%;max-width:340px">' +
    '<div class="eyebrow">Next Destination</div>' +
    '<div style="font-size:12px;color:rgba(255,255,255,.35);margin-bottom:20px">Stop ' + (idx+1) + ' of ' + GS.properties.length + '</div>' +

    '<div style="font-family:\'Cormorant Garamond\',serif;font-size:26px;font-weight:300;margin-bottom:6px;line-height:1.2">' + esc(p.title || p.area || 'Property') + '</div>' +
    '<div style="font-size:13px;color:rgba(255,255,255,.45);margin-bottom:28px">' + esc(p.address || p.area || '') + '</div>' +

    '<div id="nav-drive-stats-' + idx + '" style="display:flex;justify-content:center;gap:32px;margin-bottom:28px">' +
    (driveInfo && driveInfo.ok
      ? statBlock(driveInfo.durationMin, 'Min drive') + statBlock(driveInfo.distanceKm, 'Km away')
      : '<div style="font-size:12px;color:rgba(255,255,255,.25)">Calculating route&hellip;</div>') +
    '</div>' +

    (mapsUrl
      ? '<a href="' + esc(mapsUrl) + '" target="_blank" class="btn-go" style="text-decoration:none;display:inline-flex" onclick="trackMapsOpen(' + idx + ')">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>' +
        'Open Google Maps</a>'
      : '<div style="font-size:13px;color:rgba(255,255,255,.3);margin-bottom:16px">No address available</div>') +

    '<button class="btn-secondary" style="margin-top:10px" onclick="manualArrival(' + idx + ')">I\u2019ve already arrived</button>' +

    '<div style="margin-top:28px;padding-top:20px;border-top:1px solid rgba(255,255,255,.08)">' +
    '<div style="font-size:10px;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:.12em">After arrival</div>' +
    '<div style="font-size:12px;color:rgba(255,255,255,.4);margin-top:4px">Property details will open automatically</div>' +
    '</div>' +

    '</div>' +

    // Arrival overlay — hidden by default, shown when user returns from Maps
    '<div id="arrival-overlay-' + idx + '" style="display:none;position:fixed;inset:0;background:rgba(7,18,38,.96);z-index:500;align-items:center;justify-content:center;flex-direction:column;padding:24px;backdrop-filter:blur(4px)">' +
    '<div style="text-align:center;width:100%;max-width:300px" class="fade-in">' +
    '<div id="arrival-gps-status-' + idx + '"></div>' +
    '<div style="font-size:40px;margin-bottom:16px">&#128205;</div>' +
    '<div style="font-family:\'Cormorant Garamond\',serif;font-size:24px;font-weight:300;margin-bottom:8px">Have you arrived?</div>' +
    '<div style="font-size:13px;color:rgba(255,255,255,.4);margin-bottom:28px">' + esc(p.title || 'This property') + '</div>' +
    '<button class="btn-go" style="margin-bottom:10px" onclick="confirmArrival(' + idx + ')">Yes, show property</button>' +
    '<button class="btn-secondary" onclick="reopenMaps(' + idx + ',&quot;' + esc((mapsUrl||'').replace(/"/g,'&quot;')) + '&quot;)">Open Google Maps again</button>' +
    '</div>' +
    '</div>' +

    '</div>';
}

function statBlock(val, label){
  return '<div style="text-align:center"><div style="font-family:\'Cormorant Garamond\',serif;font-size:24px;color:#C9A14A">' + val + '</div><div style="font-size:9px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.1em;margin-top:2px">' + label + '</div></div>';
}

// Called when the user taps "Open Google Maps" — arms the visibility listener
// so that returning to this tab shows the arrival check automatically.
function trackMapsOpen(idx){
  navState.pendingStopIdx = idx;
  navState.mapsOpenedAt = Date.now();
}

// Called when the user taps "I've already arrived" directly, without leaving the tab
function manualArrival(idx){
  showArrivalOverlay(idx);
}

function reopenMaps(idx, mapsUrl){
  hideArrivalOverlay(idx);
  if(mapsUrl) window.open(mapsUrl, '_blank');
  trackMapsOpen(idx);
}

function showArrivalOverlay(idx){
  var el = document.getElementById('arrival-overlay-' + idx);
  if(el){
    el.style.display = 'flex';
    attemptGpsArrivalCheck(idx);
  }
}
function hideArrivalOverlay(idx){
  var el = document.getElementById('arrival-overlay-' + idx);
  if(el) el.style.display = 'none';
}

function confirmArrival(idx){
  hideArrivalOverlay(idx);
  navState.pendingStopIdx = null;
  goToScreen('prop-' + idx);
}

// Visibility-based return detection: when the tab regains focus after the user
// opened Maps, automatically surface the arrival check.
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState !== 'visible') return;
  if(navState.pendingStopIdx === null) return;
  // Small delay so the overlay doesn't flash during the tab-switch animation
  setTimeout(function(){
    if(navState.pendingStopIdx !== null){
      showArrivalOverlay(navState.pendingStopIdx);
    }
  }, 300);
});
window.addEventListener('focus', function(){
  if(navState.pendingStopIdx === null) return;
  setTimeout(function(){
    if(navState.pendingStopIdx !== null){
      showArrivalOverlay(navState.pendingStopIdx);
    }
  }, 300);
});

// ── OPTIONAL GPS ENHANCEMENT ──────────────────────────────────────────────
// Progressive enhancement only. If geolocation is unavailable, denied, or the
// property has no coordinates, this silently does nothing and the manual
// "Yes, show property" button remains the primary path.
function attemptGpsArrivalCheck(idx){
  var statusEl = document.getElementById('arrival-gps-status-' + idx);
  if(!statusEl) return;
  if(!navigator.geolocation){ return; }

  var p = GS.properties[idx];
  var coords = extractCoords(p.mapsUrl);
  if(!coords){ return; } // no coordinates to compare against — skip silently

  navigator.geolocation.getCurrentPosition(function(pos){
    var dist = haversineMeters(pos.coords.latitude, pos.coords.longitude, coords.lat, coords.lng);
    if(dist <= 100){
      statusEl.innerHTML = '<div style="background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:12px;color:#4ade80">&#9989; You\u2019re within ' + Math.round(dist) + 'm of this property</div>';
    }
  }, function(){
    // Permission denied or unavailable — fail silently, manual button still works
  }, { timeout: 4000, maximumAge: 30000 });
}

// Extracts lat/lng from a Google Maps URL if present (covers common formats)
function extractCoords(mapsUrl){
  if(!mapsUrl) return null;
  var m = mapsUrl.match(/[@,]\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
  if(m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  var q = mapsUrl.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(q) return { lat: parseFloat(q[1]), lng: parseFloat(q[2]) };
  return null;
}

function haversineMeters(lat1, lon1, lat2, lon2){
  var R = 6371000;
  var dLat = (lat2-lat1) * Math.PI/180;
  var dLon = (lon2-lon1) * Math.PI/180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function fetchAllDriveTimes(){
  var locs = [];
  GS.properties.forEach(function(p){ locs.push(p.mapsUrl || p.address || ''); });

  var totalKm = 0;
  var pending = locs.length - 1;
  if(pending <= 0){ pending = 0; }

  // drive-stats-N (between properties N and N+1) feeds two places:
  // the "drive screen" between stop N and N+1, AND the first nav screen if N===0... wait,
  // actually nav-drive-stats-0 (the very first destination) has no "from" location unless
  // a meeting point exists, so we only wire that up if locs has a meaningful start.
  for(var i = 0; i < locs.length - 1; i++){
    (function(idx){
      fetchDriveTime(locs[idx], locs[idx+1], function(result){
        var statsEl = document.getElementById('drive-stats-' + idx);
        if(statsEl && result && result.ok){
          statsEl.innerHTML =
            '<div style="text-align:center"><div style="font-family:\'Cormorant Garamond\',serif;font-size:24px;color:#C9A14A">' + result.durationMin + '</div><div style="font-size:9px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.1em;margin-top:2px">Min drive</div></div>' +
            '<div style="text-align:center"><div style="font-family:\'Cormorant Garamond\',serif;font-size:24px;color:#C9A14A">' + result.distanceKm + '</div><div style="font-size:9px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.1em;margin-top:2px">Km away</div></div>';
          totalKm += parseFloat(result.distanceKm) || 0;
        } else if(statsEl){
          statsEl.innerHTML = '<div style="font-size:12px;color:rgba(255,255,255,.3)">Drive time unavailable</div>';
        }
        pending--;
        if(pending <= 0){
          var totalEl = document.getElementById('total-distance');
          if(totalEl) totalEl.textContent = totalKm > 0 ? Math.round(totalKm) : '\u2014';
        }
      });
    })(i);
  }

  // First nav screen (the very first destination) — only has drive time if there's
  // a meeting point set in the day. If not, leave it as "no route to calculate" since
  // the agent's own starting location is unknown.
  var mpEv = (GS.day.events || []).find(function(e){ return e.type === 'meetingpoint'; });
  var startLoc = mpEv ? (mpEv.title || mpEv.note || '') : '';
  if(startLoc && GS.properties.length){
    fetchDriveTime(startLoc, locs[0], function(result){
      var statsEl = document.getElementById('nav-drive-stats-0');
      if(statsEl && result && result.ok){
        statsEl.innerHTML =
          '<div style="text-align:center"><div style="font-family:\'Cormorant Garamond\',serif;font-size:24px;color:#C9A14A">' + result.durationMin + '</div><div style="font-size:9px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.1em;margin-top:2px">Min drive</div></div>' +
          '<div style="text-align:center"><div style="font-family:\'Cormorant Garamond\',serif;font-size:24px;color:#C9A14A">' + result.distanceKm + '</div><div style="font-size:9px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.1em;margin-top:2px">Km away</div></div>';
      } else if(statsEl){
        statsEl.innerHTML = '<div style="font-size:12px;color:rgba(255,255,255,.25)">Set a meeting point to see drive time</div>';
      }
    });
  } else {
    var firstStatsEl = document.getElementById('nav-drive-stats-0');
    if(firstStatsEl) firstStatsEl.innerHTML = '<div style="font-size:12px;color:rgba(255,255,255,.25)">Tap below to start navigating</div>';
  }
}

var completedSet = {};
function completeViewing(idx){
  completedSet[idx] = true;
  var countEl = document.getElementById('completed-count');
  if(countEl) countEl.textContent = Object.keys(completedSet).length + ' of ' + GS.properties.length + ' properties viewed';

  var isLast = idx >= GS.properties.length - 1;
  var nextLabel = isLast ? 'Tour complete' : 'Drive to Stop ' + (idx+2);

  // Replace the button area with a brief success/handoff state
  var btn = event.target.closest('button');
  var container = btn ? btn.parentElement : null;
  if(btn){
    btn.style.display = 'none';
  }
  if(container){
    var handoff = document.createElement('div');
    handoff.className = 'fade-in';
    handoff.style.cssText = 'text-align:center;padding:13px';
    handoff.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:center;gap:8px;color:#4ade80;font-size:14px;font-weight:600;margin-bottom:4px">' +
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>' +
      'Viewing completed</div>' +
      '<div style="font-size:12px;color:rgba(255,255,255,.4)">Next: ' + nextLabel + '</div>';
    container.appendChild(handoff);
  }

  setTimeout(function(){
    if(idx < GS.properties.length - 1){
      goToScreen('drive-' + idx);
    } else {
      goToScreen('complete');
    }
  }, 900);
}

function exportNotes(){
  var lines = [];
  GS.properties.forEach(function(p, i){
    lines.push((i+1) + '. ' + (p.title || p.area || 'Property') + ' \u2014 ' + fmtPrice(p.price));
    if(p.note) lines.push('   Note: ' + p.note);
  });
  var text = lines.join('\n');
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){ alert('Notes copied to clipboard'); });
  }
}

function copyWhatsappSummary(){
  var client = GS.client;
  var lines = ['Viewing day summary' + (client ? ' \u2014 ' + client.name : '') + ':', ''];
  GS.properties.forEach(function(p, i){
    lines.push((i+1) + '. ' + (p.title || p.area || 'Property') + ' \u2014 ' + fmtPrice(p.price));
  });
  var text = lines.join('\n');
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){ alert('Summary copied — paste into WhatsApp'); });
  }
}

// ── NAVIGATION BETWEEN SCREENS ────────────────────────────────────────────
function goToScreen(target){
  var id;
  if(target === 'preparing'){
    id = 'screen-preparing';
    setTimeout(runPreparingSequence, 350);
  } else if(target === 'complete'){
    id = 'screen-complete';
  } else {
    id = 'screen-' + target;
  }
  // Once the user lands on a property screen, the pending Maps round-trip is resolved —
  // clear it so a stray tab-focus event later doesn't pop the arrival overlay again.
  if(target.indexOf('prop-') === 0){
    navState.pendingStopIdx = null;
  }
  var el = document.getElementById(id);
  if(el) el.scrollIntoView({behavior: 'smooth', block: 'start'});
}
