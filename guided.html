<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#071226"/>
<title>TourFlow — Guided Tour</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --ink:#2D2B28;
  --paper:#FCFBF7;
  --brass:#C9A14A;
  --slate:#6b6560;
  --fog:#edeae4;
  --mist:#f5f2ec;
  --navy:#071226;
  --card:#ffffff;
  --r-card:20px;
  --r-modal:28px;
  --shadow-card:0 2px 12px rgba(0,0,0,.06);
  --shadow-modal:0 24px 64px rgba(7,18,38,.18),0 4px 16px rgba(7,18,38,.1);
  --transition-spring:cubic-bezier(.34,1.4,.64,1);
  --transition-smooth:cubic-bezier(.4,0,.2,1);
}

body{
  font-family:'Jost',system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  font-weight:300;
  overscroll-behavior-y:contain;
  max-width:480px;
  margin:0 auto;
}

/* ── SCROLL CONTAINER ── */
#scroll-container{
  scroll-snap-type:y mandatory;
  overflow-y:auto;
  width:100%;
  height:100vh;
  height:100dvh;
}
.screen{
  min-height:100vh;
  min-height:100dvh;
  width:100%;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  background:var(--paper);
  scroll-snap-align:start;
}

/* ── LAYOUT ── */
.center{display:flex;flex-direction:column;align-items:center;justify-content:center}
.phase-light{background:var(--paper);color:var(--ink)}

/* ── TYPOGRAPHY ── */
.eyebrow-light{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);margin-bottom:6px;display:block}
.eyebrow-dark{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:rgba(201,161,74,.65);margin-bottom:6px;display:block}

/* ── NAVY CARDS (focus moments) ── */
.navy-card{
  background:var(--navy);
  border-radius:var(--r-card);
  padding:22px;
  box-shadow:var(--shadow-modal);
}

/* ── LIGHT CARDS ── */
.card{
  background:var(--card);
  border-radius:14px;
  border:1px solid var(--fog);
  padding:16px;
  margin-bottom:12px;
  box-shadow:var(--shadow-card);
}

/* ── SECTION CARDS (collapsible in property screen) ── */
.section-card{
  background:var(--card);
  border:1px solid var(--fog);
  border-radius:14px;
  margin-bottom:8px;
  overflow:hidden;
}
.section-title{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}

/* ── ROWS ── */
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--fog)}
.row:last-child{border-bottom:none}
.row-label{font-size:13px;color:var(--slate)}
.row-value{font-size:13px;color:var(--ink);font-weight:500;text-align:right;max-width:55%}

/* ── PRIMARY BUTTON (gold, used everywhere) ── */
.btn-go{
  width:100%;padding:17px;
  background:linear-gradient(135deg,#C9A14A 0%,#d4a84b 100%);
  color:var(--navy);border:none;border-radius:14px;
  font-size:15px;font-weight:700;letter-spacing:.02em;
  cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 6px 20px rgba(201,161,74,.3);
  -webkit-appearance:none;
}

/* ── SECONDARY BUTTON (transparent, on dark bg) ── */
.btn-secondary{
  width:100%;padding:14px;
  background:rgba(255,255,255,.07);
  color:rgba(255,255,255,.8);
  border:1px solid rgba(255,255,255,.14);
  border-radius:14px;font-size:14px;font-weight:500;
  cursor:pointer;font-family:inherit;
  -webkit-appearance:none;
}

/* ── OUTLINE BUTTON (on light bg) ── */
.btn-outline{
  width:100%;padding:13px;background:transparent;
  color:var(--ink);border:1.5px solid var(--fog);
  border-radius:12px;font-size:13px;font-weight:500;
  cursor:pointer;font-family:inherit;
  -webkit-appearance:none;
}

/* ── DARK PRIMARY (navy bg) ── */
.btn{
  width:100%;padding:14px;background:var(--navy);color:var(--brass);
  border:none;border-radius:12px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;
  -webkit-appearance:none;
}

/* ── AGENT CONTACT BUTTONS ── */
.action-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:12px 8px;background:var(--mist);border:1px solid var(--fog);
  border-radius:12px;color:var(--ink);text-decoration:none;font-size:11px;font-weight:500;
}

/* ── ALL BUTTON PRESS STATES ── */
.btn-go,.btn-secondary,.btn-outline,.btn,.action-btn{
  transition:transform 120ms var(--transition-smooth),opacity 120ms;
  -webkit-user-select:none;user-select:none;
}
.btn-go:active,.btn-secondary:active,.btn-outline:active,.btn:active,.action-btn:active{
  transform:scale(.96);opacity:.9;
}

/* ── LOADING ── */
#loading-screen{
  position:fixed;inset:0;background:var(--navy);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:9999;
}
.spinner{width:22px;height:22px;border:2.5px solid rgba(201,161,74,.2);border-top-color:#C9A14A;border-radius:50%;animation:spin .8s linear infinite}

/* ── OVERLAY SYSTEM ── */
/* Full-screen overlay with frosted glass effect */
.tf-overlay{
  position:fixed;inset:0;
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:600;
  padding:0 0 env(safe-area-inset-bottom) 0;
}
.tf-overlay.active{display:flex}
/* Blurred background */
.tf-overlay-bg{
  position:absolute;inset:0;
  background:rgba(252,251,247,.75);
  backdrop-filter:blur(16px) saturate(180%);
  -webkit-backdrop-filter:blur(16px) saturate(180%);
  transition:opacity 250ms var(--transition-smooth);
  opacity:0;
}
.tf-overlay.active .tf-overlay-bg{opacity:1}
/* The card that slides up */
.tf-overlay-card{
  position:relative;
  width:100%;
  max-width:480px;
  background:var(--navy);
  border-radius:var(--r-modal) var(--r-modal) 0 0;
  padding:28px 22px;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
  box-shadow:var(--shadow-modal);
  transform:translateY(40px);
  opacity:0;
  transition:transform 320ms var(--transition-spring), opacity 200ms var(--transition-smooth);
}
.tf-overlay.active .tf-overlay-card{transform:translateY(0);opacity:1}

/* Center-modal variant (arrival, celebration) */
.tf-overlay.center-modal{align-items:center;padding:24px}
.tf-overlay.center-modal .tf-overlay-card{
  border-radius:var(--r-modal);
  transform:scale(.92) translateY(12px);
  transition:transform 350ms var(--transition-spring), opacity 200ms var(--transition-smooth);
}
.tf-overlay.center-modal.active .tf-overlay-card{transform:scale(1) translateY(0)}

/* Page scale-back when overlay opens */
#scroll-container{
  transition:transform 320ms var(--transition-smooth), filter 320ms var(--transition-smooth);
}
body.overlay-open #scroll-container{
  transform:scale(.97);
  filter:brightness(.85);
  border-radius:12px;
  overflow:hidden;
}

/* ── ANIMATIONS ── */
@keyframes spin{to{transform:rotate(360deg)}}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}
@keyframes scaleIn{
  from{opacity:0;transform:scale(.9)}
  to{opacity:1;transform:scale(1)}
}
@keyframes checkPop{
  0%{transform:scale(0)}
  70%{transform:scale(1.15)}
  100%{transform:scale(1)}
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes screenIn{from{opacity:.6}to{opacity:1}}
.screen{animation:screenIn .25s var(--transition-smooth)}
.fade-in{animation:fadeUp .3s var(--transition-smooth) both}

/* ── CHECKLIST TICK ── */
.check-tick{animation:checkPop 300ms var(--transition-spring) both}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── SECTION CARD ENTRANCE ── */
.section-card{animation:cardIn .3s var(--transition-smooth) backwards}

/* ── PILL / BADGE ── */
.pill{background:var(--mist);color:var(--slate);font-size:10px;font-weight:600;padding:4px 10px;border-radius:100px}

/* ── PROGRESS PILL ── */
#progress-pill{
  position:fixed;bottom:20px;right:16px;z-index:400;
  background:var(--navy);
  border:1.5px solid rgba(201,161,74,.4);
  border-radius:100px;padding:9px 16px;
  color:#fff;font-family:inherit;font-size:13px;font-weight:700;
  cursor:pointer;box-shadow:0 8px 24px rgba(7,18,38,.2);
  display:none;align-items:center;gap:6px;
  transition:transform 200ms var(--transition-spring);
}
#progress-pill:active{transform:scale(.93)}
</style>
</head>
<body>

<div id="loading-screen">
  <div style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:#fff;margin-bottom:18px">Tour<em style="font-style:italic;color:#C9A14A">Flow</em></div>
  <div class="spinner"></div>
</div>

<div id="access-denied" style="display:none;position:fixed;inset:0;background:var(--navy);align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px">
  <div style="font-size:40px;margin-bottom:16px">🔒</div>
  <div style="font-family:'Cormorant Garamond',serif;font-size:22px;margin-bottom:8px">Guided Tour Mode</div>
  <div style="font-size:13px;color:rgba(255,255,255,.4);max-width:280px;line-height:1.6">This experimental feature is currently in private testing.</div>
  <a href="/index.html" style="margin-top:24px;color:var(--brass);font-size:13px;text-decoration:none">&larr; Back to TourFlow</a>
</div>

<div id="scroll-container" style="display:none"></div>

<script>
// ── BETA WHITELIST ───────────────────────────────────────────────────────
var BETA_USERS = ['niklasbengtsson@hotmail.com'];

// ── SUPABASE ─────────────────────────────────────────────────────────────
var SUPA_URL = 'https://dhcqbdyrbviormfsdcyr.supabase.co';
var SUPA_KEY = 'sb_publishable_ZKyT9nBrTruUnVDZF0VrWQ_HefTPZB3';
var supa = null;
try {
  if (window.supabase && window.supabase.createClient) {
    supa = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  }
} catch(e) { console.error('Supabase init failed:', e); }

// ── STATE ────────────────────────────────────────────────────────────────
var GS = {
  did: null,
  day: null,
  client: null,
  cfg: null,
  currentUser: null,
  properties: [],
  currentIndex: -1, // -1 = today's tour screen, 0+ = property index, 'complete' string for final
};

function esc(s){return (s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtDate(d){if(!d)return"";try{return new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});}catch(e){return d;}}
function fmtPrice(p){
  if(!p)return"";
  var n=parseInt((p+"").replace(/[^0-9]/g,""),10);
  return isNaN(n)?p:"\u20AC"+n.toLocaleString("en-US");
}

// ── LOAD DATA ────────────────────────────────────────────────────────────
function getQueryParam(name){
  var params = new URLSearchParams(window.location.search);
  return params.get(name);
}

function loadGuidedTour(){
  var did = getQueryParam('did');
  if(!did){
    showAccessDenied('No tour specified.');
    return;
  }
  GS.did = did;

  if(!supa){
    showAccessDenied('Could not connect.');
    return;
  }

  supa.auth.getSession().then(function(res){
    var session = res.data && res.data.session;
    if(!session || !session.user){
      showAccessDenied('Please sign in to TourFlow first.');
      return;
    }
    GS.currentUser = session.user;
    var email = (session.user.email || '').toLowerCase();
    if(BETA_USERS.indexOf(email) < 0){
      showAccessDenied();
      return;
    }
    fetchTourData(session.access_token);
  }).catch(function(){
    showAccessDenied('Could not verify session.');
  });
}

function fetchTourData(token){
  var headers = {'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + token};

  fetch(SUPA_URL + '/rest/v1/agent_days?id=eq.' + GS.did + '&select=data', {headers: headers})
    .then(function(r){ return r.json(); })
    .then(function(rows){
      if(!rows || !rows.length){
        showAccessDenied('Tour not found.');
        return;
      }
      GS.day = rows[0].data;
      GS.properties = (GS.day.properties || []).slice().sort(function(a,b){
        return (a.time||'zz').localeCompare(b.time||'zz');
      });

      var clientId = GS.day.clientId;
      var cfgPromise = fetch(SUPA_URL + '/rest/v1/agent_cfg?user_id=eq.' + GS.currentUser.id + '&select=data', {headers: headers}).then(function(r){return r.json();});
      var clientPromise = clientId
        ? fetch(SUPA_URL + '/rest/v1/agent_clients?id=eq.' + clientId + '&select=data', {headers: headers}).then(function(r){return r.json();})
        : Promise.resolve([]);

      Promise.all([cfgPromise, clientPromise]).then(function(results){
        var cfgRows = results[0];
        var clientRows = results[1];
        GS.cfg = (cfgRows && cfgRows[0] && cfgRows[0].data) || {};
        GS.client = (clientRows && clientRows[0] && clientRows[0].data) || null;
        renderApp();
      });
    })
    .catch(function(e){
      console.error(e);
      showAccessDenied('Could not load tour data.');
    });
}

function showAccessDenied(msg){
  document.getElementById('loading-screen').style.display = 'none';
  var denied = document.getElementById('access-denied');
  denied.style.display = 'flex';
  if(msg){
    var sub = denied.querySelector('div[style*="rgba(255,255,255,.4)"]');
    if(sub) sub.textContent = msg;
  }
}

// ── DRIVE TIME (reuses existing Netlify function) ─────────────────────────
var driveTimeCache = {};
function fetchDriveTime(from, to, cb){
  var key = from + '||' + to;
  if(driveTimeCache[key]){ cb(driveTimeCache[key]); return; }
  if(!from || !to){ cb(null); return; }
  fetch('/.netlify/functions/drivetime', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({segments: [{from: from, to: to}]})
  }).then(function(r){return r.json();}).then(function(data){
    var result = data.results && data.results[0];
    if(result) driveTimeCache[key] = result;
    cb(result || null);
  }).catch(function(){ cb(null); });
}

// ── MATCH SCORE (simplified reuse) ────────────────────────────────────────
function matchScore(client, prop){
  if(!client || !client.req) return null;
  var req = client.req;
  var hl = prop.highlights || [];
  var results = [];
  if(req.budget){
    var budgetMap = {'b150':150000,'b250':250000,'b400':400000,'b600':600000,'b1000':1000000,'b2000':2000000,'nolimit':99999999};
    var bMax = budgetMap[req.budget] || 9999999;
    var rawPrice = parseFloat((prop.price||'').replace(/[^0-9.]/g,''))||0;
    if(rawPrice > 0) results.push(rawPrice <= bMax);
  }
  (req.mustHave||[]).forEach(function(f){ results.push(hl.indexOf(f) >= 0); });
  if(!results.length) return null;
  var passed = results.filter(Boolean).length;
  return Math.round(passed / results.length * 100);
}
function matchLabel(score){
  if(score == null) return null;
  if(score >= 90) return 'Excellent Match';
  if(score >= 75) return 'Good Match';
  if(score >= 60) return 'Possible Match';
  return 'Low Match';
}

// ── RENDER APP SHELL ───────────────────────────────────────────────────────
function renderApp(){
  document.getElementById('loading-screen').style.display = 'none';
  var container = document.getElementById('scroll-container');
  container.style.display = 'block';

  var html = '';
  html += renderTodaysTourScreen();
  html += renderPreparingScreen();

  // Interleave: nav -> property -> drive -> property -> drive ... -> complete
  GS.properties.forEach(function(p, i){
    html += renderNavigationScreen(i);
    html += renderPropertyScreen(p, i);
    if(i < GS.properties.length - 1){
      html += renderDriveScreen(i);
    }
  });
  html += renderCompleteScreen();

  container.innerHTML = html;

  // Wire up drive time fetches
  fetchAllDriveTimes();

  // Mount the persistent floating progress pill + modal, once
  mountProgressUI();
}

// ── TOUR PROGRESS (persistent floating button + overview) ─────────────────
var currentStopIdx = 0; // which stop the agent is actively on, drives the floating pill label

function mountProgressUI(){
  if(document.getElementById('progress-pill')) return;

  // Pill — CSS handles all styling now
  var pill = document.createElement('button');
  pill.id = 'progress-pill';
  pill.onclick = openProgressModal;
  pill.innerHTML = '<span id="progress-pill-label">1 / ' + GS.properties.length + '</span>';
  document.body.appendChild(pill);

  // Progress overlay — uses new tf-overlay system
  var overlay = document.createElement('div');
  overlay.id = 'progress-overlay';
  overlay.className = 'tf-overlay';
  overlay.innerHTML =
    '<div class="tf-overlay-bg" onclick="closeProgressModal()"></div>' +
    '<div class="tf-overlay-card" style="max-height:75vh;overflow-y:auto">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">' +
    '<span class="eyebrow-dark" style="margin-bottom:0">Tour Progress</span>' +
    '<button onclick="closeProgressModal()" style="width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:rgba(255,255,255,.6);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center">&times;</button>' +
    '</div>' +
    '<div id="progress-modal-list"></div>' +
    '<div id="progress-bar-row" style="margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.06)">' +
    '<div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:11px;color:rgba(255,255,255,.35)"><span>Progress</span><span id="progress-fraction">0 of ' + GS.properties.length + ' completed</span></div>' +
    '<div style="height:3px;background:rgba(255,255,255,.08);border-radius:100px"><div id="progress-bar-fill" style="height:100%;width:0%;background:var(--brass);border-radius:100px;transition:width .4s var(--transition-smooth)"></div></div>' +
    '</div>' +
    '</div>';
  document.body.appendChild(overlay);

  observeScreenForProgressPill();
}

function observeScreenForProgressPill(){
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(!entry.isIntersecting) return;
      var id = entry.target.id || '';
      var pill = document.getElementById('progress-pill');
      if(!pill) return;
      if(id === 'screen-today' || id === 'screen-preparing' || id === 'screen-complete'){
        pill.style.display = 'none';
        return;
      }
      pill.style.display = 'flex';
      var m = id.match(/^screen-(?:nav|prop|drive)-(\d+)$/);
      if(m){
        var idx = parseInt(m[1], 10);
        var displayIdx = id.indexOf('drive-') >= 0 ? idx + 1 : idx;
        currentStopIdx = displayIdx;
        var label = document.getElementById('progress-pill-label');
        if(label) label.textContent = (displayIdx+1) + ' / ' + GS.properties.length;
      }
    });
  }, { threshold: 0.6 });
  GS.properties.forEach(function(p, i){
    ['nav','prop','drive'].forEach(function(type){
      var el = document.getElementById('screen-' + type + '-' + i);
      if(el) io.observe(el);
    });
  });
  ['today','preparing','complete'].forEach(function(id){
    var el = document.getElementById('screen-' + id);
    if(el) io.observe(el);
  });
}

function openProgressModal(){
  var list = document.getElementById('progress-modal-list');
  if(!list) return;
  var done = Object.keys(completedSet).length;
  var fill = document.getElementById('progress-bar-fill');
  var frac = document.getElementById('progress-fraction');
  if(fill) fill.style.width = Math.round(done/GS.properties.length*100) + '%';
  if(frac) frac.textContent = done + ' of ' + GS.properties.length + ' completed';

  list.innerHTML = GS.properties.map(function(p, i){
    var isDone = !!completedSet[i];
    var isCurrent = !isDone && i === currentStopIdx;
    var iconBg = isDone ? '#22c55e' : isCurrent ? 'var(--brass)' : 'rgba(255,255,255,.08)';
    var iconColor = isDone || isCurrent ? 'var(--navy)' : 'rgba(255,255,255,.4)';
    var iconContent = isDone
      ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="3" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>'
      : isCurrent
      ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="var(--navy)"><path d="M8 5v14l11-7z"/></svg>'
      : String(i+1);
    var sub = (p.time ? p.time + ' · ' : '') + (isDone ? 'Completed' : isCurrent ? 'Current stop' : 'Upcoming');
    return '<div onclick="jumpToStop(' + i + ')" style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer">' +
      '<div style="width:28px;height:28px;border-radius:50%;background:' + iconBg + ';display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700;color:' + iconColor + '">' + iconContent + '</div>' +
      '<div style="flex:1;min-width:0">' +
      '<div style="font-size:13px;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(p.title || p.area || 'Property ' + (i+1)) + '</div>' +
      '<div style="font-size:11px;color:rgba(255,255,255,.35);margin-top:1px">' + sub + '</div>' +
      '</div>' +
      '</div>';
  }).join('');

  var overlay = document.getElementById('progress-overlay');

function calcEstimatedFinish(props){
  if(!props.length) return '—';
  var lastTime = props[props.length-1].time;
  if(!lastTime) return '—';
  var parts = lastTime.split(':');
  if(parts.length < 2) return lastTime;
  var mins = parseInt(parts[0],10)*60 + parseInt(parts[1],10) + 30; // assume ~30min for the final viewing
  var h = Math.floor(mins/60) % 24;
  var m = mins % 60;
  return (h<10?'0':'')+h + ':' + (m<10?'0':'')+m;
}

// ── OPTIONAL GPS ENHANCEMENT ──────────────────────────────────────────────
// Progressive enhancement only. If geolocation is unavailable, denied, or the
// property has no coordinates, falls back to the manual arrival state.
function attemptGpsArrivalCheck(idx){
  var bodyEl = document.getElementById('arrival-body');
  if(!bodyEl) return;
  var p = GS.properties[idx];
  var mapsUrl = p.mapsUrl || '';

  function fallbackToManual(){
    if(document.getElementById('arrival-body') === bodyEl){
      bodyEl.innerHTML = renderManualArrivalState(idx, p.title || p.area, mapsUrl);
    }
  }

  if(!navigator.geolocation){ fallbackToManual(); return; }
  var coords = extractCoords(mapsUrl);
  if(!coords){ fallbackToManual(); return; }

  navigator.geolocation.getCurrentPosition(function(pos){
    var dist = haversineMeters(pos.coords.latitude, pos.coords.longitude, coords.lat, coords.lng);
    if(document.getElementById('arrival-body') !== bodyEl) return;
    if(dist <= 100){
      bodyEl.innerHTML = renderAutoArrivedState(idx, p.title || p.area);
    } else {
      fallbackToManual();
    }
  }, function(){ fallbackToManual(); }, { timeout: 4000, maximumAge: 30000 });
}

// Extracts lat/lng from a Google Maps URL if present (covers common formats)
function extractCoords(mapsUrl){
  if(!mapsUrl) return null;
  var m = mapsUrl.match(/[@,]\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
  if(m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  var q = mapsUrl.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(q) return { lat: parseFloat(q[1]), lng: parseFloat(q[2]) };
  return null;
}

function haversineMeters(lat1, lon1, lat2, lon2){
  var R = 6371000;
  var dLat = (lat2-lat1) * Math.PI/180;
  var dLon = (lon2-lon1) * Math.PI/180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

// ── VIEWING CHECKLIST (light phase) ───────────────────────────────────────
var checklistState = {};
function getChecklist(idx){
  if(!checklistState[idx]) checklistState[idx] = { viewed:false, questions:false, feedback:false };
  return checklistState[idx];
}
function renderViewingChecklist(idx){
  var cl = getChecklist(idx);
  var items = [
    ['viewed','Property viewed'],
    ['questions','Questions answered'],
    ['feedback','Customer feedback added']
  ];
  var doneCount = items.filter(function(it){ return cl[it[0]]; }).length;
  return '<div class="section-card" id="checklist-' + idx + '" style="padding:14px 16px">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">' +
    '<span class="section-title" style="margin-bottom:0">Viewing Checklist</span>' +
    '<span style="font-size:11px;color:var(--slate)">' + doneCount + ' / ' + items.length + '</span>' +
    '</div>' +
    items.map(function(it){
      var checked = cl[it[0]];
      return '<button onclick="toggleChecklistItem(' + idx + ',\'' + it[0] + '\')" style="width:100%;display:flex;align-items:center;gap:10px;background:none;border:none;padding:7px 0;cursor:pointer;font-family:inherit;text-align:left">' +
        '<div style="width:18px;height:18px;border-radius:5px;border:1.5px solid ' + (checked?'var(--brass)':'var(--fog)') + ';background:' + (checked?'var(--brass)':'transparent') + ';display:flex;align-items:center;justify-content:center;flex-shrink:0">' +
        (checked ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>' : '') +
        '</div>' +
        '<span style="font-size:13px;color:' + (checked?'var(--ink)':'var(--slate)') + ';font-weight:' + (checked?'500':'300') + '">' + it[1] + '</span>' +
        '</button>';
    }).join('') +
    '</div>';
}
function toggleChecklistItem(idx, key){
  var cl = getChecklist(idx);
  cl[key] = !cl[key];
  var container = document.getElementById('checklist-' + idx);
  if(container) container.outerHTML = renderViewingChecklist(idx);
}

function fetchAllDriveTimes(){
  var locs = [];
  GS.properties.forEach(function(p){ locs.push(p.mapsUrl || p.address || ''); });

  var totalKm = 0;
  var pending = locs.length - 1;
  if(pending <= 0){ pending = 0; }

  // drive-stats-N (between properties N and N+1) feeds two places:
  // the "drive screen" between stop N and N+1, AND the first nav screen if N===0... wait,
  // actually nav-drive-stats-0 (the very first destination) has no "from" location unless
  // a meeting point exists, so we only wire that up if locs has a meaningful start.
  for(var i = 0; i < locs.length - 1; i++){
    (function(idx){
      fetchDriveTime(locs[idx], locs[idx+1], function(result){
        var statsEl = document.getElementById('drive-stats-' + idx);
        if(statsEl && result && result.ok){
          statsEl.innerHTML = navStatBlock(result.durationMin, 'Est. Drive') + '<div style="width:1px;background:rgba(255,255,255,.08)"></div>' + navStatBlock(result.distanceKm, 'Distance');
          totalKm += parseFloat(result.distanceKm) || 0;
        } else if(statsEl){
          statsEl.innerHTML = '<div style="font-size:12px;color:rgba(255,255,255,.3)">Drive time unavailable</div>';
        }
        pending--;
        if(pending <= 0){
          var totalEl = document.getElementById('total-distance');
          if(totalEl) totalEl.textContent = totalKm > 0 ? Math.round(totalKm) : '\u2014';
        }
      });
    })(i);
  }

  // First nav screen (the very first destination) — only has drive time if there's
  // a meeting point set in the day. If not, leave it as "no route to calculate" since
  // the agent's own starting location is unknown.
  var mpEv = (GS.day.events || []).find(function(e){ return e.type === 'meetingpoint'; });
  var startLoc = mpEv ? (mpEv.title || mpEv.note || '') : '';
  if(startLoc && GS.properties.length){
    fetchDriveTime(startLoc, locs[0], function(result){
      var statsEl = document.getElementById('nav-drive-stats-0');
      if(statsEl && result && result.ok){
        statsEl.innerHTML = navStatBlock(result.durationMin, 'Est. Drive') + '<div style="width:1px;background:rgba(255,255,255,.08)"></div>' + navStatBlock(result.distanceKm, 'Distance');
      } else if(statsEl){
        statsEl.innerHTML = '<div style="font-size:12px;color:rgba(255,255,255,.25)">Set a meeting point to see drive time</div>';
      }
    });
  } else {
    var firstStatsEl = document.getElementById('nav-drive-stats-0');
    if(firstStatsEl) firstStatsEl.innerHTML = '<div style="font-size:12px;color:rgba(255,255,255,.25)">Tap below to start navigating</div>';
  }
}

function lightStatBlock(val, label){

function updateCompletionStats(){
  var countEl = document.getElementById('completed-count');
  if(countEl) countEl.textContent = Object.keys(completedSet).length + ' of ' + GS.properties.length + ' viewings completed';

  var totalKm = 0, totalDriveMin = 0;
  for(var i = 0; i < GS.properties.length - 1; i++){
    var a = GS.properties[i], b = GS.properties[i+1];
    var key = (a.mapsUrl||a.address||'') + '||' + (b.mapsUrl||b.address||'');
    var d = driveTimeCache[key];
    if(d && d.ok){
      totalKm += parseFloat(d.distanceKm) || 0;
      totalDriveMin += parseInt(d.durationMin) || 0;
    }
  }
  var viewingMin = tourStartTime ? Math.round((Date.now() - tourStartTime) / 60000) : null;

  var kmEl = document.getElementById('cstat-Total-km');
  var drEl = document.getElementById('cstat-Drive-min');
  var vrEl = document.getElementById('cstat-Tour-min');
  if(kmEl) kmEl.textContent = totalKm > 0 ? Math.round(totalKm) : '—';
  if(drEl) drEl.textContent = totalDriveMin > 0 ? totalDriveMin : '—';
  if(vrEl) vrEl.textContent = viewingMin != null ? viewingMin : '—';
}

var completedSet = {};

  completedSet[idx] = true;
  if(!tourStartTime) tourStartTime = Date.now();

  // Haptic feedback if supported
  if(navigator.vibrate){ navigator.vibrate(40); }

  showCompletionCelebration(idx);
}

      : '<div style="text-align:center;padding:4px 0 4px">' +
        '<div style="font-size:36px;margin-bottom:10px">&#127881;</div>' +
        '<div style="font-family:\'Cormorant Garamond\',serif;font-size:22px;font-weight:300;color:#fff;margin-bottom:16px">Tour day complete.</div>' +
        '<button class="btn-go" onclick="proceedAfterCelebration(' + idx + ')">View Summary</button>' +
        '</div>') +

    '<button style="width:100%;margin-top:10px;padding:10px;background:none;border:none;color:rgba(255,255,255,.3);font-size:12px;font-family:inherit;cursor:pointer" onclick="closeCelebrationAndOpenProgress()">View tour progress</button>' +
    '</div>' + // cel-body

    '</div>'; // tf-overlay-card

  document.body.appendChild(overlay);
  document.body.classList.add('overlay-open');

  overlay.style.display = 'flex';
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      overlay.classList.add('active');
      var ck = document.getElementById('cel-check');
      var ct = document.getElementById('cel-title');
      var cb = document.getElementById('cel-body');
      if(ck) ck.style.transform = 'scale(1)';
      if(ct) ct.style.opacity = '1';
      if(cb) cb.style.opacity = '1';
    });
  });
}

function dismissCelebration(){
  var overlay = document.getElementById('celebration-overlay');
  if(overlay){
    overlay.classList.remove('active');
    document.body.classList.remove('overlay-open');
    setTimeout(function(){ overlay.remove(); }, 350);
  }
}

function proceedAfterCelebration(idx){
  dismissCelebration();
  setTimeout(function(){
    if(idx < GS.properties.length - 1){
      goToScreen('drive-' + idx);
    } else {
      goToScreen('complete');
    }
  }, 200);
}

function closeCelebrationAndOpenProgress(){
  dismissCelebration();
  setTimeout(openProgressModal, 250);
}

function exportNotes(){
  var lines = [];
  GS.properties.forEach(function(p, i){
    lines.push((i+1) + '. ' + (p.title || p.area || 'Property') + ' \u2014 ' + fmtPrice(p.price));
    if(p.note) lines.push('   Note: ' + p.note);
  });
  var text = lines.join('\n');
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){ alert('Notes copied to clipboard'); });
  }
}

function copyWhatsappSummary(){
  var client = GS.client;
  var lines = ['Viewing day summary' + (client ? ' \u2014 ' + client.name : '') + ':', ''];
  GS.properties.forEach(function(p, i){
    lines.push((i+1) + '. ' + (p.title || p.area || 'Property') + ' \u2014 ' + fmtPrice(p.price));
  });
  var text = lines.join('\n');
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){ alert('Summary copied — paste into WhatsApp'); });
  }
}

// ── NAVIGATION BETWEEN SCREENS ────────────────────────────────────────────
function goToScreen(target){
  var id;
  if(target === 'preparing'){
    id = 'screen-preparing';
    setTimeout(runPreparingSequence, 350);
  } else if(target === 'complete'){
    id = 'screen-complete';
    updateCompletionStats();
  } else {
    id = 'screen-' + target;
  }
  // Once the user lands on a property screen, the pending Maps round-trip is resolved —
  // clear it so a stray tab-focus event later doesn't pop the arrival overlay again.
  if(target.indexOf('prop-') === 0){
    navState.pendingStopIdx = null;
  }
  var el = document.getElementById(id);
  if(el) el.scrollIntoView({behavior: 'smooth', block: 'start'});
}

// ── INIT ─────────────────────────────────────────────────────────────────
loadGuidedTour();
</script>
