<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>TourFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.ms-modal{position:fixed;inset:0;z-index:900;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.ms-modal-inner{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:24px 24px 36px;max-height:80vh;overflow-y:auto}
.ms-modal-hide{display:none}
:root{--ink:#1c1a16;--paper:#f8f3ea;--brass:#b08d57;--slate:#6b5f4e;--fog:#e0d8c8;--mist:#f0ead0;--card:#fffef9;--hdr:#0e1520}
body{font-family:'Jost',system-ui,sans-serif;background:var(--paper);color:var(--ink);max-width:480px;margin:0 auto;min-height:100vh;font-weight:300}
input,button,textarea,select{font-family:inherit}
.hdr{background:#0e1520;padding:10px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#0e1520;border-top:1px solid rgba(255,255,255,.08);display:flex;z-index:200}
.nb{flex:1;padding:10px 4px 12px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nl{font-size:10px;color:rgba(255,255,255,.35);letter-spacing:.04em}
.nl.on{color:#b08d57;font-weight:500}
.nd{width:20px;height:1.5px;background:#b08d57;border-radius:1px;margin-top:1px}
.wrap{padding:20px 18px 80px}
.card{background:var(--card);border-radius:12px;border:1px solid var(--fog);padding:16px;margin-bottom:14px}
.lbl{font-size:10px;font-weight:500;color:#9e9080;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;display:block}
.inp{width:100%;padding:11px 13px;border:1.5px solid var(--fog);border-radius:8px;font-size:15px;outline:none;background:var(--card);color:var(--ink);-webkit-appearance:none}
.inp:focus{border-color:var(--brass)}
.ins{padding:9px 11px;font-size:14px}
.btn{width:100%;padding:13px 18px;background:var(--hdr);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.btn-g{background:transparent;color:var(--ink);border:1.5px solid var(--fog)}
.btn-b{background:linear-gradient(135deg,#c9993a,#8a6020);color:#fff}
.btn-sm{padding:7px 14px;font-size:12px;width:auto;border-radius:8px;margin-bottom:0}
.btn-add{background:transparent;border:1.5px dashed var(--brass);color:var(--brass);border-radius:9px;padding:11px;width:100%;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:10px}
.bico{background:none;border:none;color:#c8bfb0;font-size:18px;cursor:pointer;padding:4px;line-height:1}
.bback{background:none;border:none;color:#9e9080;font-size:13px;cursor:pointer;padding:0 0 16px 0;display:block}
.sec{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:300;color:var(--ink);margin-bottom:16px}
.sec-sm{font-size:11px;font-weight:500;color:#9e9080;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.pill{background:var(--mist);color:var(--slate);font-size:10px;font-weight:500;padding:3px 9px;border-radius:100px;display:inline-block}
.pill-br{background:#f5ede0;color:#8a6020}
.pill-gr{background:#f0fdf4;color:#166534}
.pill-bl{background:#eff6ff;color:#1d4ed8}
.pill-am{background:#fef9ec;color:#92400e}
.pill-gy{background:#f1f0ee;color:#6b5f4e}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tog{display:flex;background:var(--mist);border-radius:10px;padding:3px;margin-bottom:14px}
.tb{flex:1;padding:9px 0;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:#9e9080;transition:all .15s}
.tb.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.ban{border-radius:8px;padding:9px 13px;margin-bottom:16px;font-size:12px;display:flex;align-items:center;gap:7px}
.ban-gr{background:#f0fdf4;color:#166534}
.ban-am{background:#fef9ec;color:#92400e}
.emp{background:var(--mist);border-radius:16px;padding:40px 24px;text-align:center}
.cc{background:var(--card);border-radius:14px;border:1px solid var(--fog);padding:15px 16px;margin-bottom:10px;cursor:pointer;display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;background:var(--mist);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--brass);flex-shrink:0;border:1px solid var(--fog)}
.dc{background:var(--card);border-radius:12px;border:1px solid var(--fog);padding:13px 15px;margin-bottom:8px;cursor:pointer}
.pc{background:var(--card);border-radius:12px;border:1px solid var(--fog);margin-bottom:10px;overflow:hidden}
.oh{background:var(--hdr);padding:24px 22px}
.or{padding:16px 22px;border-bottom:1px solid var(--fog)}
.of{background:var(--mist);padding:14px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ibox{margin-top:12px;background:#fef9ec;border-left:3px solid #f59e0b;border-radius:0 6px 6px 0;padding:11px 13px}
@media print{.hdr,.nav,.btn,.btn-g,.tog,.ban,.bback,.bico,.btn-add{display:none!important}.wrap{padding:0!important}body{background:#fff!important;max-width:100%!important}.or{break-inside:avoid}img{display:block!important;max-width:100%!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}}
</style>
</head>

<script>
var STORE="tf-v2";
function triggerPrint(){
  var el=document.getElementById('app');
  var pv=el?el.querySelector('.pdf-view'):null;
  if(!pv){window.print();return;}
  
  // Open new window with just the PDF content
  var w=window.open('','_blank','width=900,height=700');
  if(!w){window.print();return;}
  
  w.document.write('<!DOCTYPE html><html><head>'+
    '<meta charset="UTF-8"/>'+
    '<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>'+
    '<style>'+
    '*{margin:0;padding:0;box-sizing:border-box;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}'+
    'body{font-family:Jost,sans-serif;background:#fff}'+
    '@page{size:A4;margin:0}'+
    '.pdf-page{page-break-after:always;break-after:page}'+
    '.pdf-page:last-child{page-break-after:auto}'+
    '.pdf-prop{page-break-inside:avoid;break-inside:avoid}'+
    'img{display:block;max-width:100%;-webkit-print-color-adjust:exact!important}'+
    '</style></head><body>'+
    pv.innerHTML+
    '</body></html>');
  w.document.close();
  
  // Wait for fonts and images then print
  w.onload=function(){
    setTimeout(function(){
      w.focus();
      w.print();
    },600);
  };
  setTimeout(function(){w.focus();w.print();},1500);
}
function load(){try{return JSON.parse(localStorage.getItem(STORE)||"{}");}catch(e){return{};}}
function save(d){try{localStorage.setItem(STORE,JSON.stringify(d));}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,9);}
function today(){return new Date().toISOString().slice(0,10);}
function fmtDate(d){if(!d)return"";try{return new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});}catch(e){return d;}}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function getDomain(url){try{return new URL(url).hostname.replace("www.","");}catch(e){return url||"";}}
function gv(id){var el=document.getElementById(id);return el?el.value.trim():"";}
function initials(n){return(n||"?").split(" ").map(function(w){return w[0]||"";}).join("").slice(0,2).toUpperCase();}
function dayStatus(date){if(!date)return"upcoming";var t=today();if(date===t)return"today";if(date<t)return"done";return"upcoming";}
function statusBadge(s){if(s==="today")return'<span class="pill pill-br">Today</span>';if(s==="done")return'<span class="pill pill-gy">Completed</span>';return'<span class="pill pill-bl">Upcoming</span>';}

function reqFormHtml(r){
  r=r||{};
  function sel(id,opts,val,label){
    var op=opts.map(function(o){return'<option value="'+o.v+'"'+(val===o.v?' selected':'')+'>'+o.l+'</option>';}).join('');
    return'<div style="margin-bottom:11px"><label class="lbl">'+label+'</label><select class="inp" id="'+id+'" style="appearance:none;-webkit-appearance:none;background:var(--card) url(\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%2212%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23999%22 stroke-width=%222%22><path d=%22M6 9l6 6 6-6%22/></svg>\') no-repeat right 12px center;padding-right:32px">'+op+'</select></div>';
  }
  function pri(id,val,label){
    var levels=[{v:'',l:'Not specified'},{v:'must',l:'✓ Must Have'},{v:'important',l:'◎ Important'},{v:'nice',l:'◇ Nice to Have'}];
    return sel(id,levels,val,label);
  }
  var budgets=[{v:'',l:'Not specified'},{v:'u100',l:'Under €100,000'},{v:'100-200',l:'€100k – €200k'},{v:'200-300',l:'€200k – €300k'},{v:'300-500',l:'€300k – €500k'},{v:'500-800',l:'€500k – €800k'},{v:'800k+',l:'€800,000+'}];
  var roomOpts=[{v:'',l:'Not specified'},{v:'studio',l:'Studio'},{v:'1',l:'1 Bedroom'},{v:'2',l:'2 Bedrooms'},{v:'3',l:'3 Bedrooms'},{v:'4',l:'4+ Bedrooms'}];
  var types=[{v:'',l:'Not specified'},{v:'apt',l:'Apartment'},{v:'villa',l:'Villa'},{v:'house',l:'Townhouse / Semi-detached'},{v:'bungalow',l:'Bungalow'},{v:'penthouse',l:'Penthouse'},{v:'any',l:'Any type'}];
  var views=[{v:'',l:'Not specified'},{v:'sea',l:'Sea view'},{v:'golf',l:'Golf view'},{v:'garden',l:'Garden / Private'},{v:'no',l:'No preference'}];
  var purpose=[{v:'',l:'Not specified'},{v:'perm',l:'Permanent residence'},{v:'holiday',l:'Holiday home'},{v:'invest',l:'Investment / Rental'},{v:'mixed',l:'Mixed use'}];
  function chk(key,label,val){
    return'<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--fog)">'+
      '<span style="font-size:13px;color:var(--ink)">'+label+'</span>'+
      '<select class="inp" id="req-'+key+'" style="width:auto;max-width:148px;font-size:11px;appearance:none;-webkit-appearance:none;padding:5px 28px 5px 10px;background:var(--card) url(\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2210%22 height=%2210%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23999%22 stroke-width=%222%22><path d=%22M6 9l6 6 6-6%22/></svg>\') no-repeat right 8px center">'+
      [{v:'',l:'—'},{v:'must',l:'✓ Must Have'},{v:'important',l:'◎ Important'},{v:'nice',l:'◇ Nice to Have'}].map(function(o){return'<option value="'+o.v+'"'+((val||'')==o.v?' selected':'')+'>'+o.l+'</option>';}).join('')+
      '</select></div>';
  }
  var req=r.req||{};
  return'<div style="margin-bottom:11px">'+sel('req-budget',budgets,req.budget||'','Budget range')+'</div>'+
    '<div style="margin-bottom:11px">'+sel('req-minrooms',roomOpts,req.minrooms||'','Minimum bedrooms')+'</div>'+
    '<div style="margin-bottom:11px">'+sel('req-type',types,req.type||'','Property type')+'</div>'+
    '<div style="margin-bottom:11px">'+sel('req-view',views,req.view||'','View preference')+'</div>'+
    '<div style="margin-bottom:11px">'+sel('req-purpose',purpose,req.purpose||'','Purpose')+'</div>'+
    '<div style="margin-top:6px;margin-bottom:6px;font-size:10px;font-weight:700;color:var(--brass);text-transform:uppercase;letter-spacing:.12em">Features & priorities</div>'+
    chk('pool','Swimming pool',req.pool)+
    chk('garage','Garage / Parking',req.garage)+
    chk('garden','Garden / Terrace',req.garden)+
    chk('beach','Walking distance to beach',req.beach)+
    chk('restaurants','Walking distance to restaurants',req.restaurants)+
    chk('golf','Near golf course',req.golf)+
    chk('newbuild','New build',req.newbuild,'nb')+
    chk('community','Gated community',req.community);
}
function readReq(){
  var keys=['pool','garage','garden','beach','restaurants','golf','newbuild','community'];
  var req={};
  ['budget','minrooms','type','view','purpose'].forEach(function(k){req[k]=gv('req-'+k)||'';});
  keys.forEach(function(k){req[k]=gv('req-'+k)||'';});
  return req;
}

function matchScore(c,p){
  if(!c||!c.req)return null;
  var req=c.req;
  var results=[];
  var rawPrice=parseFloat((p.price||'').replace(/[^0-9.]/g,''))||0;
  var budgetMap={'u100':100,'100-200':200,'200-300':300,'300-500':500,'500-800':800,'800k+':9999};
  var roomMap={'studio':0,'1':1,'2':2,'3':3,'4':4};
  function score(key,label,pass){
    if(!req[key])return;
    results.push({label:label,pass:pass,level:req[key]});
  }
  // Budget
  if(req.budget&&rawPrice>0){
    var bMax=budgetMap[req.budget]||9999;
    score('budget','Budget',rawPrice/1000<=bMax);
  }
  // Bedrooms
  if(req.minrooms&&p.rooms){
    var reqR=roomMap[req.minrooms]||0;
    var propR=parseInt(p.rooms)||0;
    score('minrooms','Bedrooms',propR>=reqR);
  }
  // Property type
  if(req.type&&req.type!=='any'&&p.title){
    var tmap={apt:'apartment',villa:'villa',house:'townhouse',bungalow:'bungalow',penthouse:'penthouse'};
    var keyword=(tmap[req.type]||req.type).toLowerCase();
    score('type','Property type',(p.title+' '+(p.address||'')).toLowerCase().indexOf(keyword)>=0);
  }
  // Match against Property Highlights (structured) first, then text fallback
  var hl=p.highlights||[];
  var hlStr=hl.join(' ').toLowerCase();
  var searchText=(p.agentRec||'')+' '+(p.areaNote||'')+' '+(p.title||'')+' '+(p.address||'')+' '+hlStr;
  var sl=searchText.toLowerCase();

  // Highlight-to-requirement mapping
  var hlMap={
    pool:['Pool'],
    beach:['Walking distance to beach'],
    restaurants:['Restaurants nearby','Close to amenities','Everything within walking distance'],
    golf:['Near golf'],
    garden:['Large terrace','Private garden','South facing'],
    garage:['Garage'],
    newbuild:['Key ready','Recently renovated'],
    community:['Prime location','Quiet area']
  };

  var feats={
    pool:['pool','piscina'],beach:['beach','sea','costa','mar','playa'],
    restaurants:['restaurant','dining','gastronomy'],golf:['golf'],
    garden:['garden','terrace','outdoor','terraza'],garage:['garage','parking'],
    newbuild:['new build','newbuild','new development','obra nueva'],
    community:['gated','community','urbanizaci']
  };

  Object.keys(feats).forEach(function(k){
    if(!req[k])return;
    // Check highlights array first (most reliable)
    var hlMatch=(hlMap[k]||[]).some(function(h){
      return hl.indexOf(h)>=0;
    });
    // Fallback to text search
    var txtMatch=feats[k].some(function(w){return sl.indexOf(w)>=0;});
    var labels={pool:'Pool',beach:'Near beach',restaurants:'Near restaurants',golf:'Near golf',garden:'Garden/Terrace',garage:'Parking',newbuild:'New build',community:'Gated community'};
    score(k,labels[k],hlMatch||txtMatch);
  });

  // Also score "Within budget" highlight against budget req
  if(req.budget&&hl.indexOf('Within budget')>=0){
    // Already covered above — but boost confidence if agent confirmed it
  }

  if(!results.length){
    // No requirements set — show highlights count as soft score
    if(hl.length>0){
      return{score:null,results:[],highlights:hl};
    }
    return null;
  }
  var weights={must:3,important:2,nice:1};
  var total=0,got=0;
  results.forEach(function(r){var w=weights[r.level]||1;total+=w;if(r.pass)got+=w;});
  var pct=total>0?Math.round(got/total*100):0;
  return{score:pct,results:results,got:got,total:total};
}

var _dtCache={};   // cache key "from||to" → result
var _dtPending={}; // in-flight promises

function dtKey(a,b){return(a||'')+'||'+(b||'');}

function calcDriveTimes(day,onDone){
  var locs=[];
  // Use Meeting Point schedule item as starting location if present
  var mpEv=(day.events||[]).find(function(e){return e.type==='meetingpoint';});
  if(mpEv&&(mpEv.title||mpEv.note))locs.push(mpEv.title||(mpEv.note||''));
  var props=[].concat(day.properties||[]).sort(function(a,b){return(a.time||'zz').localeCompare(b.time||'zz');});
  props.forEach(function(p){locs.push(p.mapsUrl||p.address||'');});
  locs=locs.filter(function(x){return x&&x.trim();});
  if(locs.length<2){if(onDone)onDone();return;}

  var segments=[];
  for(var i=0;i<locs.length-1;i++){
    var k=dtKey(locs[i],locs[i+1]);
    if(!_dtCache[k])segments.push({from:locs[i],to:locs[i+1]});
  }
  if(!segments.length){if(onDone)onDone();return;}

  fetch('/.netlify/functions/drivetime',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({segments:segments})
  }).then(function(r){return r.json();}).then(function(data){
    if(data.results){
      data.results.forEach(function(r){
        var k=dtKey(r.from,r.to);
        _dtCache[k]=r;
      });
    }
    if(onDone)onDone();
  }).catch(function(){
    if(onDone)onDone();
  });
}

function getDriveTime(from,to){
  if(!from||!to)return null;
  return _dtCache[dtKey(from,to)]||null;
}

function driveTimeHtml(from,to){
  var dt=getDriveTime(from,to);

function fmtDateMon(d){if(!d)return"";try{return new Date(d+"T12:00:00").toLocaleDateString("en-GB",{month:"short"}).toUpperCase();}catch(e){return"";}}

  var up=S.days.filter(function(d){return dayStatus(d.date)!=="done";}).sort(function(a,b){return a.date.localeCompare(b.date);}).slice(0,4);

  var tourCards=up.map(function(d){
    var c=S.clients.find(function(c){return c.id===d.clientId;})||{name:"Unknown"};
    var props=d.properties||[];
    var firstImg=null;
    for(var pi=0;pi<props.length;pi++){if(props[pi].ogImage){firstImg=props[pi].ogImage;break;}}

    // Location summary from properties
    var locations=[];
    props.forEach(function(p){
      if(p.address){
        var parts=p.address.split(",");
        var loc=parts[parts.length-1]?parts[parts.length-1].trim():(parts[0]?parts[0].trim():"");
        if(loc&&locations.indexOf(loc)===-1&&locations.length<3)locations.push(loc);
      }
    });
    var locHtml=locations.length?'<div style="font-size:11px;color:#9e9080;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+locations.join(" &middot; ")+'</div>':'';

    var thumbHtml=firstImg
      ?'<div style="width:52px;min-width:52px;height:52px;border-radius:8px;overflow:hidden;flex-shrink:0"><img src="'+esc(firstImg)+'" style="width:100%;height:100%;object-fit:cover"/></div>'
      :'<div style="width:52px;min-width:52px;height:52px;border-radius:8px;flex-shrink:0;background:var(--mist);display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--fog)">'+
       '<div style="font-size:16px;font-weight:600;color:var(--slate);line-height:1">'+fmtDateNum(d.date)+'</div>'+
       '<div style="font-size:8px;color:#9e9080;text-transform:uppercase;letter-spacing:.08em;margin-top:1px">'+fmtDateMon(d.date)+'</div></div>';

    return '<div style="background:var(--card);border-radius:10px;border:1px solid var(--fog);overflow:hidden;margin-bottom:8px">'+
      '<div style="display:flex;gap:12px;padding:12px;align-items:center">'+
      thumbHtml+
      '<div style="flex:1;min-width:0">'+
      '<div style="font-size:14px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px">'+esc(c.name)+'</div>'+
      '<div style="font-size:11px;color:#9e9080">'+fmtDate(d.date)+' &middot; '+props.length+' propert'+(props.length===1?"y":"ies")+'</div>'+
      locHtml+
      '</div>'+
      '<div style="display:flex;gap:6px;align-items:center;flex-shrink:0">'+
      '<button onclick="openDay(\''+d.id+'\',\''+d.clientId+'\')" style="padding:8px 14px;background:var(--ink);color:#fff;border:none;border-radius:7px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:500;white-space:nowrap">Open &#8250;</button>'+
      '<button class="bico" onclick="event.stopPropagation();if(confirm(\'Delete?\'))delDay(\''+d.id+'\');render()">&#215;</button>'+
      '</div></div></div>';
  }).join("");

  var clientRows=S.clients.slice(0,3).map(function(c){
    var cd=cDays(c.id);
    return '<div style="display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--fog);cursor:pointer" onclick="go(\'client-detail\',{cid:\''+c.id+'\'})">'+
      '<div style="width:34px;height:34px;border-radius:50%;background:var(--mist);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--brass);flex-shrink:0;border:1px solid var(--fog)">'+esc(initials(c.name))+'</div>'+
      '<div style="flex:1;min-width:0">'+
      '<div style="font-size:13px;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(c.name)+'</div>'+
      '<div style="font-size:11px;color:#9e9080">'+cd.length+' day'+(cd.length===1?"":"s")+(cd[0]?' &middot; '+fmtDate(cd[0].date):'')+'</div></div>'+
      '<span style="color:#c8bfb0;font-size:15px">&#8250;</span>'+
      '<button class="bico" onclick="event.stopPropagation();if(confirm(\'Delete?\'))delClient(\''+c.id+'\');render()">&#215;</button>'+
      '</div>';
  }).join("");

function quickDay(){
  if(S.clients.length===0){go("add-client");return;}
  if(S.clients.length===1){
    var id=addDay(S.clients[0].id);
    go("day-detail",{did:id,cid:S.clients[0].id});
    return;
  }
  go("pick-client");
}

// ── CLIENTS ───────────────────────────────────────────────────────────────────
function pgClients(){
  var h='<div class="wrap">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px">'+
    '<div class="sec" style="margin-bottom:0">Clients</div>'+
    '<button class="btn btn-sm" onclick="go(\'add-client\')">+ New client</button></div>';
  if(S.clients.length===0){
    h+='<div class="emp"><div style="font-size:40px;margin-bottom:12px">&#128100;</div>'+
      '<div style="font-family:\'Cormorant Garamond\',serif;font-size:20px;margin-bottom:6px">No clients yet</div>'+
      '<div style="font-size:14px;color:var(--slate);margin-bottom:24px">Add your first client to get started</div>'+
      '<button class="btn" style="width:auto;padding:12px 24px" onclick="go(\'add-client\')">Add client</button></div>';
  } else {
    h+=S.clients.map(function(c){
      var cd=cDays(c.id);
      var upc=cd.filter(function(d){return dayStatus(d.date)!=="done";});
      return '<div class="cc" onclick="go(\'client-detail\',{cid:\''+c.id+'\'})">'+
        '<div class="av">'+esc(initials(c.name))+'</div>'+
        '<div style="flex:1;min-width:0">'+
        '<div style="font-size:15px;font-weight:500;color:var(--ink);margin-bottom:3px">'+esc(c.name)+'</div>'+
        '<div style="font-size:12px;color:var(--slate);margin-bottom:5px">'+esc(c.phone||"")+(c.nationality?' &middot; '+esc(c.nationality):'')+'</div>'+
        '<div style="display:flex;gap:7px;flex-wrap:wrap">'+
        (upc.length?'<span class="pill pill-bl">'+upc.length+' upcoming</span>':'')+
        '<span class="pill">'+cd.length+' day'+(cd.length===1?"":"s")+'</span>'+
        (c.budget?'<span class="pill pill-br">'+esc(c.budget)+'</span>':'')+
        '</div></div>'+
        '<span style="color:#c8bfb0;font-size:18px">&#8250;</span></div>';
    }).join("");
  }
  return h+'</div>';
}

// ── CLIENT DETAIL ─────────────────────────────────────────────────────────────
function pgClientDetail(){
  var c=curC();if(!c)return"";
  var cd=cDays(c.id);
  var up=cd.filter(function(d){return dayStatus(d.date)!=="done";});
  var dn=cd.filter(function(d){return dayStatus(d.date)==="done";});
  function drow(d){
    return '<div class="dc" onclick="openDay(\''+d.id+'\',\''+c.id+'\')">'+
      '<div style="display:flex;justify-content:space-between;align-items:center">'+
      '<div><div style="font-size:14px;font-weight:500;color:var(--ink)">'+fmtDate(d.date)+'</div>'+
      '<div style="font-size:12px;color:var(--slate);margin-top:2px">'+d.properties.length+' propert'+(d.properties.length===1?"y":"ies")+'</div></div>'+
      '<div style="display:flex;gap:8px;align-items:center">'+statusBadge(dayStatus(d.date))+
      '<button class="bico" onclick="event.stopPropagation();if(confirm(\'Delete this day?\'))delDay(\''+d.id+'\');render()">&#215;</button></div></div>'+
      (d.properties.length>0?'<div style="display:flex;gap:6px;margin-top:9px;overflow-x:auto">'+
        d.properties.slice(0,3).map(function(p){
          return '<div style="flex-shrink:0;background:var(--mist);border-radius:6px;padding:3px 9px;font-size:11px;color:var(--slate);white-space:nowrap">'+
            (p.time?'<span style="font-weight:600;color:var(--ink);margin-right:3px">'+esc(p.time)+'</span>':'')+
            esc(p.title?p.title.slice(0,20)+(p.title.length>20?"...":""):getDomain(p.url))+'</div>';
        }).join("")+(d.properties.length>3?'<div style="flex-shrink:0;background:var(--mist);border-radius:6px;padding:3px 9px;font-size:11px;color:#9e9080">+'+(d.properties.length-3)+' more</div>':'')
      +'</div>':'')+'</div>';
  }
  return '<div class="wrap">'+

function copyWA(){
  var day=curD();if(!day)return;
  var c=curC();var cfg=S.cfg;
  var props=[].concat(day.properties).sort(function(a,b){return(a.time||"").localeCompare(b.time||"");});
  var line="---------------------";
  var name=c?c.name.split(" ")[0]:"";
  var greeting="Hi"+(name?" "+name+",":",")+"\n\nYour personalised viewing itinerary for *"+fmtDate(day.date)+"* is ready:\n";
  var blocks=props.map(function(p,idx){
    var area=p.address?p.address.split(",").slice(-1)[0].trim():getDomain(p.url);
    var ls=["*Property "+(idx+1)+(p.topPick?" - TOP PICK":"")+":* "+(p.title||area)];
    if(p.time)ls.push("Time: *"+p.time+"*");
    if(area)ls.push(area);
    var meta=[p.price,p.rooms,p.sqm].filter(Boolean);
    if(meta.length)ls.push(meta.join(" - "));
    if(p.highlights&&p.highlights.length)ls.push("Highlights: "+p.highlights.slice(0,3).join(", "));
    if(p.agentRec)ls.push('"'+p.agentRec+'"');
    if(p.url)ls.push(p.url);
    if(p.mapsUrl)ls.push("Directions: "+p.mapsUrl);
    return ls.join("\n");
  }).join("\n\n"+line+"\n\n");
  var footer="";
  if(cfg.agent||cfg.agency){
    footer="\n\n"+line+"\n"+(cfg.agent||cfg.agency);
    if(cfg.agency&&cfg.agent)footer+="\n"+cfg.agency;
    if(cfg.phone)footer+="\n"+cfg.phone;
    if(cfg.email)footer+="\n"+cfg.email;
  }
  var msg=greeting+"\n"+line+"\n\n"+blocks+footer;
  var btn=document.getElementById("wa-btn");
  function done(){if(btn){btn.textContent="Copied!";btn.style.background="#128C4A";}setTimeout(function(){if(btn){btn.textContent="Copy WhatsApp";btn.style.background="#25D366";}},2500);}
  function fb(t,cb){var ta=document.createElement("textarea");ta.value=t;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand("copy");cb();}catch(e){alert("Could not copy.");}document.body.removeChild(ta);}
  if(navigator.clipboard){navigator.clipboard.writeText(msg).then(done).catch(function(){fb(msg,done);});}else{fb(msg,done);}
}

      var sc3lbl=sc3!=null&&sc3>=85?'Excellent Match':sc3!=null&&sc3>=70?'Strong Match':sc3!=null&&sc3>=55?'Good Potential':'Worth Viewing';
      var hl=p.highlights||[];
      var orderLbl=props.length===1?'Private Viewing':((ORDS[idx]||'Viewing '+(idx+1))+' Viewing \u00B7 '+(idx+1)+' of '+props.length);
      var displayArea=p.area||'';
      var street=p.address||'';

      return '<div class="pdf-prop pdf-page" style="background:#fff">'+

        // Property image — full width
        (p.ogImage?
          '<div style="position:relative;height:300px;overflow:hidden">'+
          '<img src="'+esc(p.ogImage)+'" style="width:100%;height:100%;object-fit:cover;display:block"/>'+
          '<div style="position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.65) 100%)"></div>'+
          (p.topPick?'<div style="position:absolute;top:16px;left:20px;background:linear-gradient(90deg,#b08d57,#d4a84b);border-radius:5px;padding:4px 12px;font-size:9px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.1em">\u2605 Top Pick</div>':'')+
          (sc3!=null?'<div style="position:absolute;top:16px;right:20px;background:rgba(10,14,22,.78);border-radius:8px;padding:6px 12px;text-align:right">'+
          '<div style="font-size:16px;font-weight:700;color:'+sc3col+';line-height:1">'+sc3+'%</div>'+
          '<div style="font-size:8px;color:rgba(255,255,255,.45);margin-top:2px;text-transform:uppercase;letter-spacing:.08em">'+sc3lbl+'</div>'+
          '</div>':'')+
          '</div>'
        :
          // No image — dark banner
          '<div style="background:#0e1520;height:120px;display:flex;align-items:center;padding:0 52px;justify-content:space-between">'+
          '<div style="font-family:\'Cormorant Garamond\',serif;font-size:48px;font-weight:300;color:rgba(176,141,87,.2)">'+(idx+1)+'</div>'+
          (sc3!=null?'<div style="font-size:22px;font-weight:700;color:'+sc3col+'">'+sc3+'% Match</div>':'')+
          '</div>')+

        // Property body
        '<div style="padding:28px 52px 32px">'+

        // Order + time row
        '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px">'+
        '<div>'+
        '<div style="font-size:9px;font-weight:700;color:#9e9080;text-transform:uppercase;letter-spacing:.14em;margin-bottom:3px">'+orderLbl+'</div>'+
        (p.time?'<div style="font-family:\'Cormorant Garamond\',serif;font-size:34px;font-weight:300;color:#0e1520;line-height:1;letter-spacing:-.3px">'+esc(p.time)+'</div>':'')+ 
        '</div>'+
        (fp?'<div style="font-family:\'Cormorant Garamond\',serif;font-size:34px;font-weight:300;color:#b08d57;letter-spacing:-.3px">'+esc(fp)+'</div>':'')+
        '</div>'+

        // Area badge + title
        (displayArea?'<div style="font-size:9px;font-weight:700;color:#b08d57;text-transform:uppercase;letter-spacing:.18em;margin-bottom:5px">'+esc(displayArea)+(street?' &nbsp;|&nbsp; <span style="opacity:.6;font-style:normal">'+esc(street)+'</span>':'')+'</div>':'')+
        (p.title?'<div style="font-family:\'Cormorant Garamond\',serif;font-size:30px;font-weight:400;color:#0e1520;line-height:1.12;margin-bottom:14px;letter-spacing:-.2px">'+esc(p.title)+'</div>':'')+

        // Specs row
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">'+
        (p.rooms?'<span style="background:#f5f0e8;border:1px solid #e5ddd0;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700;color:#3a2e20;text-transform:uppercase;letter-spacing:.04em">'+esc(p.rooms)+'</span>':'')+
        (p.bathrooms?'<span style="background:#f5f0e8;border:1px solid #e5ddd0;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700;color:#3a2e20;text-transform:uppercase;letter-spacing:.04em">'+esc(p.bathrooms)+' bath</span>':'')+
        (p.sqm?'<span style="background:#f5f0e8;border:1px solid #e5ddd0;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700;color:#3a2e20;text-transform:uppercase;letter-spacing:.04em">'+esc(p.sqm)+'</span>':'')+
        '</div>'+

        // Links
        (p.url||p.mapsUrl?'<div style="display:flex;gap:16px;margin-bottom:16px">'+
        (p.url?'<a href="'+esc(p.url)+'" style="font-size:12px;font-weight:600;color:#b08d57">\uD83D\uDD17 View Full Listing</a>':'')+
        (p.mapsUrl?'<a href="'+esc(p.mapsUrl)+'" style="font-size:12px;font-weight:500;color:#6b5f4e">\uD83D\uDCCD Directions</a>':'')+
        '</div>':'')+

        // Highlights
        (hl.length?'<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px">'+
        hl.map(function(h){return'<span style="background:#f5f0e8;border:1px solid #e5ddd0;border-radius:100px;padding:3px 11px;font-size:10px;font-weight:500;color:#4a3e30">'+esc(h)+'</span>';}).join('')+
        '</div>':'')+

        // Agent rec
        (p.agentRec?'<div style="border-left:2px solid #e5ddd0;padding-left:12px;font-family:\'Cormorant Garamond\',serif;font-size:14px;font-style:italic;color:#4a3e30;line-height:1.6">'+esc(p.agentRec)+'</div>':'')+

        // Internal (agent view only)
        (isAg2&&(p.commission||p.contact)?
          '<div style="margin-top:14px;background:#fef9ec;border-left:3px solid #f59e0b;padding:10px 14px;border-radius:0 6px 6px 0;font-size:11px;color:#92400e">'+
          (p.commission?'<strong>Commission:</strong> '+esc(p.commission)+'&nbsp;&nbsp;':'')+(p.contact?'<strong>Contact:</strong> '+esc(p.contact):'')+'</div>':'')+

        '</div>'+

        // Agent footer on last property
        (idx===props.length-1?
          '<div style="background:#0e1520;padding:18px 52px;display:flex;align-items:center;justify-content:space-between">'+
          '<div>'+
          '<div style="font-family:\'Cormorant Garamond\',serif;font-size:20px;font-weight:300;color:#fff">'+esc(cfg.agent||cfg.agency||'Your Agent')+'</div>'+
          (cfg.agency&&cfg.agent?'<div style="font-size:10px;color:rgba(255,255,255,.35);margin-top:1px">'+esc(cfg.agency)+'</div>':'')+
          '</div>'+
          '<div style="text-align:right">'+
          (cfg.phone?'<div style="font-size:11px;color:rgba(255,255,255,.5)">'+esc(cfg.phone)+'</div>':'')+
          (cfg.email?'<div style="font-size:11px;color:rgba(255,255,255,.5)">'+esc(cfg.email)+'</div>':'')+
          '</div>'+
          '</div>':'')+

        '</div>';
    }).join('');

    return '<div class="pdf-view" style="display:none">'+
      page1+propPages+
      '</div>';
  })();
  return printStyle+pdfHtml+
    '<div class="mobile-view"><div class="wrap">'+
    '<button class="bback" onclick="go(\'day-detail\')">&#8592; Edit day</button>'+
    '<div class="tog">'+
    '<button class="tb'+(S.viewMode==="client"?" on":"")+'" onclick="S.viewMode=\'client\';render()">&#128196; Client view</button>'+
    '<button class="tb'+(S.viewMode==="agent"?" on":"")+'" onclick="S.viewMode=\'agent\';render()">&#128274; Agent view</button></div>'+
    '<div class="ban '+(isAg?"ban-am":"ban-gr")+'">'+
    (isAg?"&#128274; Internal info visible. Keep for yourself.":"&#9989; Clean client version. Safe to share.")+
    '</div>'+
    '<div style="background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--fog);margin-bottom:18px;box-shadow:0 8px 32px rgba(0,0,0,.08)">'+
    coverHdr+

    (!isAg&&day.welcomeMsg?'<div style="background:#faf8f4;padding:28px;border-bottom:1px solid #ede8e0">'+
    '<div style="font-size:9px;font-weight:700;color:#b08d57;text-transform:uppercase;letter-spacing:.16em;margin-bottom:10px">A personal note</div>'+
    '<div style="font-family:\'Cormorant Garamond\',serif;font-size:17px;color:#2a1f14;line-height:1.7;font-style:italic">&ldquo;'+esc(day.welcomeMsg)+'&rdquo;</div>'+
    '<div style="margin-top:14px;font-size:12px;color:#9e9080">'+esc(cfg.agent||cfg.agency||'')+'</div>'+
    '</div>':'')+
    (!isAg&&c&&c.req?(function(){
      var req=c.req;
      var budgetLabels={'u100':'Under €100k','100-200':'€100k – €200k','200-300':'€200k – €300k','300-500':'€300k – €500k','500-800':'€500k – €800k','800k+':'€800k+'};
      var typeLabels={apt:'Apartment',villa:'Villa',house:'Townhouse',bungalow:'Bungalow',penthouse:'Penthouse',any:'Any type'};
      var purposeLabels={perm:'Permanent residence',holiday:'Holiday home',invest:'Investment / Rental',mixed:'Mixed use'};
      var nbLabels={must:'New build only',important:'New build or resale',nice:'Resale preferred'};
      var lines=[];
      if(req.budget)lines.push(budgetLabels[req.budget]||req.budget);
      if(req.minrooms)lines.push(req.minrooms==='studio'?'Studio':req.minrooms+' bedroom'+(req.minrooms==='1'?'':'s')+' minimum');
      if(req.type&&req.type!=='any')lines.push(typeLabels[req.type]||req.type);
      if(req.purpose)lines.push(purposeLabels[req.purpose]||req.purpose);
      if(req.newbuild)lines.push(nbLabels[req.newbuild]||req.newbuild);
      var featureLabels={pool:'Swimming pool',garage:'Parking / Garage',garden:'Garden or terrace',beach:'Walking distance to beach',restaurants:'Walking distance to restaurants',golf:'Near golf course',community:'Gated community'};
      Object.keys(featureLabels).forEach(function(k){if(req[k])lines.push(featureLabels[k]);});
      if(!lines.length)return'';
      return'<div style="background:#fff;padding:28px;border-bottom:1px solid #ede8e0">'+
        '<div style="font-size:9px;font-weight:700;color:#b08d57;text-transform:uppercase;letter-spacing:.16em;margin-bottom:14px">Your Requirements</div>'+
        lines.map(function(r){return'<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:10px">'+
          '<span style="color:#b08d57;font-size:15px;margin-top:1px">&#10003;</span>'+
          '<span style="font-size:14px;color:#2a1f14;line-height:1.4">'+esc(r)+'</span>'+
          '</div>';}).join('')+
        '</div>';
    })():'')+ 
    '<div style="background:#fff">'+rows+'</div>'+
    (!isAg&&day.nextSteps?(function(){
      var steps=day.nextSteps.split('\n').map(function(x){return x.trim();}).filter(function(x){return x;});
      if(!steps.length)return'';
      return'<div style="background:#faf8f4;padding:28px;border-top:1px solid #ede8e0">'+
        '<div style="font-size:9px;font-weight:700;color:#b08d57;text-transform:uppercase;letter-spacing:.16em;margin-bottom:14px">After Today</div>'+
        steps.map(function(s,si){return'<div style="display:flex;align-items:flex-start;gap:14px;margin-bottom:12px">'+
          '<div style="width:24px;height:24px;border-radius:50%;background:#0e1520;color:#b08d57;font-family:\'Cormorant Garamond\',serif;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px">'+(si+1)+'</div>'+
          '<span style="font-size:13px;color:#2a1f14;line-height:1.5;padding-top:4px">'+esc(s)+'</span>'+
          '</div>';}).join('')+
        '</div>';
    })():'')+
    footerHtml+
    '</div>'+
    '<button onclick="triggerPrint()" style="width:100%;padding:14px;background:#0e1520;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px;font-family:Jost,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px">&#128279; Share PDF</button>'+
    '<button id="wa-btn" onclick="copyWA()" style="width:100%;padding:14px;background:#25D366;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px;font-family:Jost,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px">&#128241; Copy WhatsApp</button>'+
    '<button class="btn btn-g" onclick="go(\'day-detail\')">&#8592; Back to editing</button>'+
    '</div></div>';
}

// ── SETTINGS ──────────────────────────────────────────────────────────────────
function pgSettings(){
  var cfg=S.cfg;
  var lb=cfg.logo?'<img src="'+cfg.logo+'" style="width:100%;height:100%;object-fit:contain"/>':'<span style="font-size:24px">&#127968;</span>';
  var pb=cfg.photo?'<img src="'+cfg.photo+'" style="width:100%;height:100%;object-fit:cover"/>':'<span style="font-size:22px">&#128100;</span>';
  var rmLogo=cfg.logo?'<button onclick="S.cfg.logo=\'\';persist();render()" style="display:block;margin-top:6px;background:none;border:none;color:#f87171;font-size:11px;cursor:pointer;padding:0">Remove</button>':'';
  var rmPhoto=cfg.photo?'<button onclick="S.cfg.photo=\'\';persist();render()" style="display:block;margin-top:6px;background:none;border:none;color:#f87171;font-size:11px;cursor:pointer;padding:0">Remove</button>':'';
  var fRows=[
    ["Agency name","agency","Costa Home Realty"],
    ["Your name","agent","Maria Garcia"],
    ["Phone","phone","+34 600 000 000"],
    ["Email","email","maria@agency.com"]
  ].map(function(f){
    return '<div style="margin-bottom:14px"><label class="lbl">'+f[0]+'</label>'+
      '<input class="inp" id="sf-'+f[1]+'" value="'+esc(cfg[f[1]]||'')+'" placeholder="'+f[2]+'"/></div>';
  }).join("");
  setTimeout(function(){
    ["agency","agent","phone","email"].forEach(function(k){
      var el=document.getElementById("sf-"+k);
      if(el)el.oninput=function(){S.cfg[k]=this.value;persist();};
    });
  },30);
  return '<div class="wrap"><div class="sec">Settings</div><div class="card">'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px">'+
    '<div><label class="lbl">Agency logo</label>'+
    '<div style="width:64px;height:64px;border-radius:10px;border:1.5px dashed #d4c9b8;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--mist);margin-bottom:8px">'+lb+'</div>'+
    '<label style="display:inline-block;padding:7px 12px;background:var(--mist);color:var(--ink);border-radius:8px;font-size:12px;font-weight:500;cursor:pointer">Upload<input type="file" accept="image/*" style="display:none" onchange="upLogo(this)"/></label>'+
    rmLogo+
    '<div style="font-size:10px;color:#9e9080;margin-top:5px">PNG recommended</div></div>'+
    '<div><label class="lbl">Profile photo</label>'+
    '<div style="width:64px;height:64px;border-radius:50%;border:1.5px dashed #d4c9b8;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--mist);margin-bottom:8px">'+pb+'</div>'+
    '<label style="display:inline-block;padding:7px 12px;background:var(--mist);color:var(--ink);border-radius:8px;font-size:12px;font-weight:500;cursor:pointer">Upload<input type="file" accept="image/*" style="display:none" onchange="upPhoto(this)"/></label>'+
    rmPhoto+
    '<div style="font-size:10px;color:#9e9080;margin-top:5px">Optional &middot; Shows on PDF</div></div>'+
    '</div>'+
    fRows+
    '<div style="font-size:12px;color:#9e9080;margin-top:4px">These appear on your viewing lists and PDF exports.</div>'+
    '</div></div>';
}
function upLogo(input){var f=input.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){S.cfg.logo=e.target.result;persist();render();};r.readAsDataURL(f);}
function upPhoto(input){var f=input.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){S.cfg.photo=e.target.result;persist();render();};r.readAsDataURL(f);}

// ── SPLASH ────────────────────────────────────────────────────────────────────
function startApp(){
  var s=document.getElementById("splash");
  s.style.opacity="0";
  setTimeout(function(){
    s.style.display="none";
    document.getElementById("shell").style.display="flex";
    showTab("home");
  },700);
}
(function(){
  setTimeout(function(){var m=document.getElementById("sm");if(m){m.style.opacity="1";m.style.transform="translateY(0)";}},150);
  setTimeout(function(){var n=document.getElementById("sn");if(n){n.style.opacity="1";n.style.transform="translateY(0)";}},550);
  setTimeout(function(){var t=document.getElementById("st");if(t){t.style.opacity="1";t.style.transform="translateY(0)";}},1050);
  setTimeout(function(){var p=document.getElementById("sp");if(p)p.style.width="100%";var sk=document.getElementById("sk");if(sk)sk.style.opacity="1";},1300);
  setTimeout(startApp,3800);
})();
</script>
