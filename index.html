<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>TourFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#1a1410;--paper:#f5f0e8;--brass:#b08d57;--slate:#6b5f4e;--fog:#ddd5c8;--mist:#ede6db;--card:#fffdf8;--hdr:#080c10}
body{font-family:'Jost',system-ui,sans-serif;background:var(--paper);color:var(--ink);max-width:480px;margin:0 auto;min-height:100vh;font-weight:300}
input,button,textarea,select{font-family:inherit}
.hdr{background:var(--hdr);padding:13px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--hdr);border-top:1px solid rgba(255,255,255,.08);display:flex;z-index:200}
.nb{flex:1;padding:10px 4px 12px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nl{font-size:10px;color:rgba(255,255,255,.35);letter-spacing:.04em}
.nl.on{color:#b08d57;font-weight:500}
.nd{width:20px;height:1.5px;background:#b08d57;border-radius:1px;margin-top:1px}
.wrap{padding:20px 18px 80px}
.card{background:var(--card);border-radius:12px;border:1px solid var(--fog);padding:16px;margin-bottom:14px}
.lbl{font-size:10px;font-weight:500;color:#9e9080;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;display:block}
.inp{width:100%;padding:11px 13px;border:1.5px solid var(--fog);border-radius:8px;font-size:15px;outline:none;background:var(--card);color:var(--ink);-webkit-appearance:none}
.inp:focus{border-color:var(--brass)}
.ins{padding:9px 11px;font-size:14px}
.btn{width:100%;padding:13px 18px;background:var(--hdr);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.btn-g{background:transparent;color:var(--ink);border:1.5px solid var(--fog)}
.btn-b{background:linear-gradient(135deg,#c9993a,#8a6020);color:#fff}
.btn-sm{padding:7px 14px;font-size:12px;width:auto;border-radius:8px;margin-bottom:0}
.btn-add{background:transparent;border:1.5px dashed var(--brass);color:var(--brass);border-radius:9px;padding:11px;width:100%;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:10px}
.bico{background:none;border:none;color:#c8bfb0;font-size:18px;cursor:pointer;padding:4px;line-height:1}
.bback{background:none;border:none;color:#9e9080;font-size:13px;cursor:pointer;padding:0 0 16px 0;display:block}
.sec{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:300;color:var(--ink);margin-bottom:16px}
.sec-sm{font-size:11px;font-weight:500;color:#9e9080;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.pill{background:var(--mist);color:var(--slate);font-size:10px;font-weight:500;padding:3px 9px;border-radius:100px;display:inline-block}
.pill-br{background:#f5ede0;color:#8a6020}
.pill-gr{background:#f0fdf4;color:#166534}
.pill-bl{background:#eff6ff;color:#1d4ed8}
.pill-am{background:#fef9ec;color:#92400e}
.pill-gy{background:#f1f0ee;color:#6b5f4e}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tog{display:flex;background:var(--mist);border-radius:10px;padding:3px;margin-bottom:14px}
.tb{flex:1;padding:9px 0;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:#9e9080;transition:all .15s}
.tb.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.ban{border-radius:8px;padding:9px 13px;margin-bottom:16px;font-size:12px;display:flex;align-items:center;gap:7px}
.ban-gr{background:#f0fdf4;color:#166534}
.ban-am{background:#fef9ec;color:#92400e}
.emp{background:var(--mist);border-radius:16px;padding:40px 24px;text-align:center}
.cc{background:var(--card);border-radius:14px;border:1px solid var(--fog);padding:15px 16px;margin-bottom:10px;cursor:pointer;display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;background:var(--mist);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--brass);flex-shrink:0;border:1px solid var(--fog)}
.dc{background:var(--card);border-radius:12px;border:1px solid var(--fog);padding:13px 15px;margin-bottom:8px;cursor:pointer}
.pc{background:var(--card);border-radius:12px;border:1px solid var(--fog);margin-bottom:10px;overflow:hidden}
.oh{background:var(--hdr);padding:24px 22px}
.or{padding:16px 22px;border-bottom:1px solid var(--fog)}
.of{background:var(--mist);padding:14px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ibox{margin-top:12px;background:#fef9ec;border-left:3px solid #f59e0b;border-radius:0 6px 6px 0;padding:11px 13px}
@media print{.hdr,.nav,.btn,.btn-g,.tog,.ban,.bback,.bico,.btn-add{display:none!important}.wrap{padding:0!important}body{background:#fff!important;max-width:100%!important}.or{break-inside:avoid}}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash" style="position:fixed;inset:0;background:#080c10;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s ease;padding:48px;overflow:hidden">
<style>
#sm{opacity:0;transform:translateY(12px);transition:opacity 1s ease,transform 1s ease}
#sn{opacity:0;transform:translateY(16px);transition:opacity 1s ease,transform 1s ease}
#st{opacity:0;transform:translateY(8px);transition:opacity 1s ease,transform 1s ease}
#sk{opacity:0;transition:opacity .8s ease}
</style>
<div style="position:absolute;width:400px;height:400px;border-radius:50%;filter:blur(80px);background:radial-gradient(circle,rgba(176,141,87,.12) 0%,transparent 70%);top:-100px;right:-100px;pointer-events:none"></div>
<div style="position:absolute;width:300px;height:300px;border-radius:50%;filter:blur(80px);background:radial-gradient(circle,rgba(176,141,87,.07) 0%,transparent 70%);bottom:-80px;left:-80px;pointer-events:none"></div>
<div id="sm" style="margin-bottom:36px;text-align:center">
  <svg width="72" height="90" viewBox="0 0 72 90" style="display:block;margin:0 auto">
    <defs><linearGradient id="pg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f2cc6e"/><stop offset="50%" stop-color="#c49a38"/><stop offset="100%" stop-color="#8a6820"/></linearGradient></defs>
    <circle cx="36" cy="32" r="26" fill="none" stroke="url(#pg)" stroke-width="2.8"/>
    <circle cx="36" cy="32" r="9" fill="url(#pg)"/>
    <ellipse cx="29" cy="22" rx="8" ry="6" fill="#fff" opacity="0.12"/>
    <path d="M 16 54 Q 36 82 56 54" fill="none" stroke="url(#pg)" stroke-width="2.8" stroke-linecap="round"/>
  </svg>
</div>
<div id="sn" style="text-align:center;margin-bottom:20px">
  <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:52px;font-weight:300;color:#fff;letter-spacing:4px;line-height:1">Tour<span style="color:#b08d57;font-style:italic;letter-spacing:0">Flow</span></div>
</div>
<div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px">
  <div style="height:1px;background:linear-gradient(90deg,transparent,rgba(176,141,87,.4));width:40px"></div>
  <div style="width:4px;height:4px;border-radius:50%;background:#b08d57;opacity:.6"></div>
  <div style="height:1px;background:linear-gradient(270deg,transparent,rgba(176,141,87,.4));width:40px"></div>
</div>
<div id="st" style="text-align:center;margin-bottom:80px">
  <div style="font-family:'Jost',sans-serif;font-size:13px;color:rgba(255,255,255,.4);letter-spacing:.22em;text-transform:uppercase;font-weight:300">Organize viewings like a pro</div>
</div>
<div style="position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(255,255,255,.04)">
  <div id="sp" style="height:100%;background:linear-gradient(90deg,transparent,#b08d57,#d4af7a);width:0%;transition:width 2.8s linear"></div>
</div>
<button id="sk" onclick="startApp()" style="position:absolute;bottom:24px;right:28px;background:none;border:none;color:rgba(255,255,255,.2);font-size:12px;cursor:pointer;font-family:'Jost',sans-serif;letter-spacing:.1em;text-transform:uppercase">skip</button>
</div>

<div id="shell" style="display:none;flex-direction:column;min-height:100vh">
<div class="hdr">
  <div style="width:30px;height:30px;display:flex;align-items:center;justify-content:center">
    <svg width="26" height="34" viewBox="0 0 26 34"><defs><linearGradient id="hg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f2cc6e"/><stop offset="100%" stop-color="#8a6820"/></linearGradient></defs><circle cx="13" cy="11" r="9" fill="none" stroke="url(#hg)" stroke-width="2"/><circle cx="13" cy="11" r="3.5" fill="url(#hg)"/><path d="M 5 18 Q 13 30 21 18" fill="none" stroke="url(#hg)" stroke-width="2" stroke-linecap="round"/></svg>
  </div>
  <span style="color:#fff;font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;font-weight:400;letter-spacing:.5px">Tour<span style="color:#b08d57;font-style:italic">Flow</span></span>
</div>
<div id="app"></div>
<div class="nav">
  <button class="nb" onclick="showTab('home')"><span style="font-size:19px">&#127968;</span><span class="nl on" id="nl-home">Home</span><div class="nd" id="nd-home"></div></button>
  <button class="nb" onclick="showTab('clients')"><span style="font-size:19px">&#128100;</span><span class="nl" id="nl-clients">Clients</span><div class="nd" id="nd-clients" style="display:none"></div></button>
  <button class="nb" onclick="showTab('days')"><span style="font-size:19px">&#128197;</span><span class="nl" id="nl-days">Days</span><div class="nd" id="nd-days" style="display:none"></div></button>
  <button class="nb" onclick="showTab('settings')"><span style="font-size:19px">&#9881;</span><span class="nl" id="nl-settings">Settings</span><div class="nd" id="nd-settings" style="display:none"></div></button>
</div>
</div>

<script>
var STORE="tf-v2";
function load(){try{return JSON.parse(localStorage.getItem(STORE)||"{}");}catch(e){return{};}}
function save(d){try{localStorage.setItem(STORE,JSON.stringify(d));}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,9);}
function today(){return new Date().toISOString().slice(0,10);}
function fmtDate(d){if(!d)return"";try{return new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});}catch(e){return d;}}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function getDomain(url){try{return new URL(url).hostname.replace("www.","");}catch(e){return url||"";}}
function gv(id){var el=document.getElementById(id);return el?el.value.trim():"";}
function initials(n){return(n||"?").split(" ").map(function(w){return w[0]||"";}).join("").slice(0,2).toUpperCase();}
function dayStatus(date){if(!date)return"upcoming";var t=today();if(date===t)return"today";if(date<t)return"done";return"upcoming";}
function statusBadge(s){if(s==="today")return'<span class="pill pill-br">Today</span>';if(s==="done")return'<span class="pill pill-gy">Completed</span>';return'<span class="pill pill-bl">Upcoming</span>';}

var ET=[
  {key:"lunch",icon:"&#127869;",label:"Lunch",col:"#f0fdf4",brd:"#86efac",txt:"#166534"},
  {key:"coffee",icon:"&#9749;",label:"Coffee break",col:"#fffbeb",brd:"#fde68a",txt:"#92400e"},
  {key:"drive",icon:"&#128663;",label:"Drive / Travel",col:"#eff6ff",brd:"#93c5fd",txt:"#1d4ed8"},
  {key:"meeting",icon:"&#128083;",label:"Meeting",col:"#faf5ff",brd:"#d8b4fe",txt:"#7e22ce"},
  {key:"other",icon:"&#128204;",label:"Other",col:"#f1f5f9",brd:"#cbd5e1",txt:"#475569"}
];
function getET(k){for(var i=0;i<ET.length;i++){if(ET[i].key===k)return ET[i];}return ET[4];}

var DEMO_C=[
  {id:"c1",name:"Erik Svensson",phone:"+46 70 111 22 33",email:"erik@email.com",nationality:"Swedish",budget:"200-400k EUR",notes:"Looking for 3+ bed, pool preferred"},
  {id:"c2",name:"Anna Lindqvist",phone:"+46 73 222 33 44",email:"",nationality:"Swedish",budget:"150-250k EUR",notes:"Holiday home, La Zenia area"},
  {id:"c3",name:"James Wilson",phone:"+44 77 333 44 55",email:"james@email.com",nationality:"British",budget:"300-500k EUR",notes:"Permanent residence"}
];
var DEMO_D=[
  {id:"d1",clientId:"c1",date:"2026-06-17",properties:[
    {id:"p1",url:"https://www.comaskeys.com/property/2082220",time:"10:00",title:"Bright 2-bed apartment",address:"Calle del Mar 12, La Zenia",price:"175,000 EUR",rooms:"2 bed",sqm:"78 m2",mapsUrl:"https://maps.google.com/?q=Calle+del+Mar+12+La+Zenia",commission:"2.5%",contact:"Maria Garcia",firm:"Costa Realty",location:"Key at front desk",note:""},
    {id:"p2",url:"https://www.idealista.com/inmueble/98765432/",time:"12:30",title:"Modern villa with pool",address:"Avenida del Sol 45, Torrevieja",price:"320,000 EUR",rooms:"4 bed",sqm:"160 m2",mapsUrl:"https://maps.google.com/?q=Avenida+del+Sol+45+Torrevieja",commission:"3%",contact:"Juan Perez",firm:"Inmobiliaria Sol",location:"Gated community, bring ID",note:"Pool heated Oct-May"}
  ],events:[{id:"e1",type:"lunch",time:"13:30",title:"Lunch",note:"La Zenia Boulevard"}]},
  {id:"d2",clientId:"c1",date:"2026-05-10",properties:[{id:"p3",url:"https://www.hemnet.se/bostad/123",time:"11:00",title:"Townhouse near golf",address:"Calle Verde 3, Orihuela",price:"210,000 EUR",rooms:"3 bed",sqm:"105 m2",mapsUrl:"",commission:"2%",contact:"Sofia Ruiz",firm:"Golf Properties",location:"Key with neighbour no.5",note:""}],events:[]},
  {id:"d3",clientId:"c2",date:"2026-06-20",properties:[{id:"p4",url:"https://www.comaskeys.com/property/999",time:"10:30",title:"Studio apartment",address:"Avenida del Mar 8, La Zenia",price:"95,000 EUR",rooms:"Studio",sqm:"45 m2",mapsUrl:"",commission:"2%",contact:"Carlos Ruiz",firm:"La Zenia Homes",location:"Meet agent outside",note:""}],events:[]}
];

var d0=load();
var S={
  tab:"home",screen:"home",
  cid:null,did:null,
  viewMode:"client",
  epid:null,eiid:null,
  addEv:false,
  clients:d0.clients||[],
  days:d0.days||[],
  cfg:d0.cfg||{agency:"",agent:"",phone:"",email:"",logo:""}
};
function persist(){save({clients:S.clients,days:S.days,cfg:S.cfg});}
function curC(){return S.clients.find(function(c){return c.id===S.cid;});}
function curD(){return S.days.find(function(d){return d.id===S.did;});}
function cDays(cId){return S.days.filter(function(d){return d.clientId===cId;}).sort(function(a,b){return b.date.localeCompare(a.date);});}

function go(screen,extra){if(extra)Object.assign(S,extra);S.screen=screen;S.addEv=false;render();}

function showTab(tab){
  S.tab=tab;S.screen=tab;S.cid=null;S.did=null;
  ["home","clients","days","settings"].forEach(function(t){
    document.getElementById("nl-"+t).className="nl"+(t===tab?" on":"");
    document.getElementById("nd-"+t).style.display=t===tab?"block":"none";
  });
  render();
}

function render(){
  var el=document.getElementById("app");
  var s=S.screen;
  if(s==="pick-client")      {el.innerHTML=pgPickClient();return;}
  if(s==="add-client")       {el.innerHTML=pgAddClient();return;}
  if(s==="edit-client")      {el.innerHTML=pgEditClient();return;}
  if(s==="client-detail")    {el.innerHTML=pgClientDetail();return;}
  if(s==="day-detail")       {el.innerHTML=pgDayDetail();return;}
  if(s==="add-prop")         {el.innerHTML=pgAddProp();return;}
  if(s==="output")           {el.innerHTML=pgOutput();return;}
  if(S.tab==="settings")     {el.innerHTML=pgSettings();return;}
  if(S.tab==="clients")      {el.innerHTML=pgClients();return;}
  if(S.tab==="days")         {el.innerHTML=pgDays();return;}
  el.innerHTML=pgHome();
}

// ── MUTATIONS ─────────────────────────────────────────────────────────────────
function addClient(data){var c=Object.assign({id:uid()},data);S.clients=[c].concat(S.clients);persist();return c.id;}
function updateClient(id,ch){S.clients=S.clients.map(function(c){return c.id===id?Object.assign({},c,ch):c;});persist();}
function delClient(id){S.clients=S.clients.filter(function(c){return c.id!==id;});S.days=S.days.filter(function(d){return d.clientId!==id;});persist();}
function addDay(cId){var d={id:uid(),clientId:cId,date:today(),properties:[],events:[]};S.days=[d].concat(S.days);persist();return d.id;}
function updateDay(id,ch){S.days=S.days.map(function(d){return d.id===id?Object.assign({},d,ch):d;});persist();}
function delDay(id){S.days=S.days.filter(function(d){return d.id!==id;});persist();}
function addProp(did,p){S.days=S.days.map(function(d){return d.id===did?Object.assign({},d,{properties:d.properties.concat([Object.assign({id:uid()},p)])}):d;});persist();}
function updProp(did,pid,ch){S.days=S.days.map(function(d){return d.id===did?Object.assign({},d,{properties:d.properties.map(function(p){return p.id===pid?Object.assign({},p,ch):p;})}):d;});persist();}
function delProp(did,pid){S.days=S.days.map(function(d){return d.id===did?Object.assign({},d,{properties:d.properties.filter(function(p){return p.id!==pid;})}):d;});persist();}
function addEv(did,ev){S.days=S.days.map(function(d){var e=d.events||[];return d.id===did?Object.assign({},d,{events:e.concat([Object.assign({id:uid()},ev)])}):d;});persist();}
function delEv(did,eid){S.days=S.days.map(function(d){var e=d.events||[];return d.id===did?Object.assign({},d,{events:e.filter(function(ev){return ev.id!==eid;})}):d;});persist();}

// ── HOME ──────────────────────────────────────────────────────────────────────
function pgHome(){
  var up=S.days.filter(function(d){return dayStatus(d.date)!=="done";}).sort(function(a,b){return a.date.localeCompare(b.date);}).slice(0,3);
  var rc=S.clients.slice(0,4);
  var upHtml=up.length?up.map(function(d){
    var c=S.clients.find(function(c){return c.id===d.clientId;})||{name:"Unknown"};
    return '<div class="dc" onclick="go(\'day-detail\',{did:\''+d.id+'\',cid:\''+d.clientId+'\'})">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start">'+
      '<div><div style="font-family:\'Cormorant Garamond\',serif;font-size:15px;color:var(--ink);margin-bottom:2px">'+fmtDate(d.date)+'</div>'+
      '<div style="font-size:12px;color:var(--slate)">&#128100; '+esc(c.name)+' &middot; '+d.properties.length+' propert'+(d.properties.length===1?"y":"ies")+'</div></div>'+
      statusBadge(dayStatus(d.date))+'</div></div>';
  }).join(""):'<div style="font-size:13px;color:#9e9080;padding:8px 0">No upcoming days</div>';

  var rcHtml=rc.map(function(c){
    var cd=cDays(c.id);
    return '<div class="cc" onclick="go(\'client-detail\',{cid:\''+c.id+'\'})">'+
      '<div class="av">'+esc(initials(c.name))+'</div>'+
      '<div style="flex:1;min-width:0">'+
      '<div style="font-size:14px;font-weight:500;color:var(--ink);margin-bottom:2px">'+esc(c.name)+'</div>'+
      '<div style="font-size:12px;color:var(--slate)">'+cd.length+' day'+(cd.length===1?"":"s")+
      (cd[0]?' &middot; '+fmtDate(cd[0].date):'')+'</div></div>'+
      '<span style="color:#c8bfb0;font-size:18px">&#8250;</span></div>';
  }).join("");

  return '<div class="wrap">'+
    '<div style="margin-bottom:24px">'+
    '<div style="font-size:11px;color:#9e9080;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px">Welcome back</div>'+
    '<div style="font-family:\'Cormorant Garamond\',serif;font-size:28px;font-weight:300;color:var(--ink)">'+(S.cfg.agent||"Your Dashboard")+'</div></div>'+
    '<div class="g2" style="margin-bottom:24px">'+
    '<button style="background:linear-gradient(135deg,#0f1923,#1a2535);border-radius:16px;padding:22px 18px;cursor:pointer;border:none;text-align:left;width:100%;display:flex;flex-direction:column;gap:8px" onclick="go(\'add-client\')">'+
    '<div style="font-size:24px">&#128100;</div>'+
    '<div style="font-family:\'Cormorant Garamond\',serif;font-size:18px;color:#fff">New Client</div>'+
    '<div style="font-size:11px;color:rgba(255,255,255,.4);font-weight:300;line-height:1.5">Add a client and plan viewings</div></button>'+
    '<button style="background:linear-gradient(135deg,#8a6020,#c9993a);border-radius:16px;padding:22px 18px;cursor:pointer;border:none;text-align:left;width:100%;display:flex;flex-direction:column;gap:8px" onclick="quickDay()">'+
    '<div style="font-size:24px">&#128197;</div>'+
    '<div style="font-family:\'Cormorant Garamond\',serif;font-size:18px;color:#fff">New Day</div>'+
    '<div style="font-size:11px;color:rgba(255,255,255,.55);font-weight:300;line-height:1.5">Schedule a viewing day</div></button></div>'+
    '<div class="sec-sm">Upcoming viewings</div>'+upHtml+
    '<div style="margin-top:18px"></div>'+

// ── WHATSAPP ──────────────────────────────────────────────────────────────────
function copyWA(){
  var day=curD();if(!day)return;
  var c=curC();
  var props=[].concat(day.properties).sort(function(a,b){return(a.time||"").localeCompare(b.time||"");});
  var div="---------------------";
  var blocks=props.map(function(p,i){
    var area=p.address?p.address.split(",").slice(-2).join(",").trim():getDomain(p.url);
    var b=(i+1)+". *"+(p.time?p.time+" - ":"")+area+"*\n";
    if(p.title)b+=p.title+"\n";
    var meta=[p.price,p.rooms,p.sqm].filter(Boolean).join(" - ");
    if(meta)b+="&#x1F4B0; "+meta+"\n";
    if(p.url)b+="&#x1F517; "+p.url.replace(/^https?:\/\//,"")+"\n";
    if(p.mapsUrl)b+="&#x1F4CD; "+p.mapsUrl.replace(/^https?:\/\//,"");
    return b.trim();
  }).join("\n"+div+"\n");
  var cfg=S.cfg;
  var header="&#x1F3E0; *Viewing Day - "+fmtDate(day.date)+"*"+(c?"\nHi *"+c.name+"*! Here are your properties for the day.":"");
  var footer=(cfg.agent||cfg.agency)?"&#x1F4DE; "+(cfg.agent||cfg.agency)+(cfg.phone?" - "+cfg.phone:""):"";
  var msg=header+"\n\n"+div+"\n"+blocks+"\n"+div+(footer?"\n"+footer:"");
  if(navigator.clipboard){navigator.clipboard.writeText(msg).then(function(){alert("Copied! Paste into WhatsApp.");});}
  else{var ta=document.createElement("textarea");ta.value=msg;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);alert("Copied!");}
}

function fetchOg(url, did) {
  if (!url) return;
  // Show loading state on the URL field
  var statusEl = document.getElementById("ap-og-status");
  if (statusEl) { statusEl.innerHTML = '<span style="color:#9e9080;font-size:11px">&#8987; Fetching preview...</span>'; }

  fetch("/.netlify/functions/og?url=" + encodeURIComponent(url))
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (statusEl) {
        if (data.image) {
          statusEl.innerHTML = '<div style="margin-top:10px;border-radius:8px;overflow:hidden;border:1px solid var(--fog)">' +
            '<img src="' + data.image + '" style="width:100%;height:140px;object-fit:cover;display:block"/>' +
            '<div style="padding:8px 10px;background:var(--mist)">' +
            (data.title ? '<div style="font-size:12px;font-weight:500;color:var(--ink);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + data.title.slice(0,60) + '</div>' : '') +
            (data.price ? '<div style="font-size:12px;color:var(--brass);font-weight:500">' + data.price + '</div>' : '') +
            '</div></div>' +
            '<div style="font-size:11px;color:#4ade80;margin-top:6px">&#10003; Preview loaded</div>';
          // Auto-fill title if empty
          var titleEl = document.getElementById("ap-title");
          if (titleEl && !titleEl.value && data.title) titleEl.value = data.title.slice(0,80);
          // Auto-fill price if empty
          var priceEl = document.getElementById("ap-price");
          if (priceEl && !priceEl.value && data.price) priceEl.value = data.price;
          // Store image URL for later
          window._ogImage = data.image;
        } else {
          statusEl.innerHTML = '<span style="color:#9e9080;font-size:11px">No preview image found — you can add one manually below.</span>';
          window._ogImage = null;
        }
      }
    })
    .catch(function(){
      if (statusEl) statusEl.innerHTML = '<span style="color:#9e9080;font-size:11px">Could not load preview.</span>';
      window._ogImage = null;
    });
}
