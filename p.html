<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Property — TourFlow</title>
<style>
  :root{--brand-primary:#C9A14A;--brand-secondary:#071226;--brand-secondary-light:#0d1c30}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#FCFBF7;color:#1A1917;min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:0 0 90px}

  /* Full-screen hero */
  .hero-wrap{position:relative;width:100%;height:96vh;height:96dvh;background:#e8e0d0;overflow:hidden;box-shadow:inset 0 0 180px rgba(0,0,0,.12)}
  .hero-track{display:flex;height:100%;transition:transform .3s ease}
  .hero-track img{width:100%;height:100%;object-fit:cover;flex-shrink:0;transform:scale(1.02);animation:tf-hero-zoom 1.1s ease-out forwards}
  @keyframes tf-hero-zoom{to{transform:scale(1)}}
  .hero-gradient{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.08) 0%,rgba(0,0,0,.15) 25%,rgba(0,0,0,.45) 70%,rgba(0,0,0,.78) 100%)}
  .hero-arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(7,18,38,.4);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;backdrop-filter:blur(4px)}
  .hero-arrow.left{left:14px}.hero-arrow.right{right:14px}
  .hero-badge{position:absolute;top:20px;right:18px;background:rgba(7,18,38,.4);backdrop-filter:blur(4px);color:#fff;font-size:11px;font-weight:600;padding:7px 13px;border-radius:100px;z-index:5}
  .hero-brand{position:absolute;top:20px;left:20px;font-family:Georgia,serif;font-size:16px;color:#fff;z-index:5}
  .hero-brand em{font-style:italic;color:var(--brand-primary)}
  .hero-brand.placement-top-center{left:50%;transform:translateX(-50%);right:auto}
  .hero-brand img{height:36px;max-width:180px;width:auto;object-fit:contain}
  .logo-white-shadow{filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
  .footer-logo{height:28px;max-width:150px;width:auto;object-fit:contain;vertical-align:middle}
  .agent-brand-logo{height:22px;max-width:110px;width:auto;object-fit:contain;margin-bottom:8px;display:block}

  .hero-content{position:absolute;left:0;right:0;bottom:64px;padding:0 26px;z-index:4}
  .hero-eyebrow{font-size:11px;font-weight:700;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.2em;margin-bottom:12px;opacity:0;animation:tf-fade-up .7s ease forwards;animation-delay:.35s}
  .hero-title{font-family:Georgia,serif;font-weight:400;font-size:38px;color:#fff;line-height:1.08;margin-bottom:8px;opacity:0;animation:tf-fade-up .7s ease forwards;animation-delay:.5s}
  .hero-subtitle{font-size:14px;color:rgba(255,255,255,.75);margin-bottom:20px;opacity:0;animation:tf-fade-up .7s ease forwards;animation-delay:.62s}
  .hero-price{font-family:Georgia,serif;font-size:26px;font-weight:600;color:var(--brand-primary);margin-bottom:14px;opacity:0;animation:tf-fade-up .7s ease forwards;animation-delay:.74s}
  .hero-highlights{font-size:12px;color:rgba(255,255,255,.7);letter-spacing:.02em;opacity:0;animation:tf-fade-up .7s ease forwards;animation-delay:.86s}
  @keyframes tf-fade-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  .scroll-indicator{position:absolute;left:0;right:0;bottom:20px;text-align:center;z-index:4;opacity:0;animation:tf-fade-up .7s ease forwards,tf-float 2.6s ease-in-out infinite;animation-delay:1s,1.7s}
  .scroll-indicator span{font-size:10px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.18em;display:block;margin-bottom:4px}
  .scroll-indicator svg{opacity:.6}
  @keyframes tf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

  .content{padding:34px 20px 0;background:#FCFBF7;position:relative;z-index:2;margin-top:-24px;border-radius:24px 24px 0 0}

  /* Dark theme override */
  body.theme-dark{background:#0d1210}
  body.theme-dark .content{background:#12181a;color:#f0ece4}
  body.theme-dark .spec-num,body.theme-dark .hero-content .hero-title{color:#f0ece4}
  body.theme-dark .spec-label,body.theme-dark .breadcrumb,body.theme-dark .cost-item{color:rgba(240,236,228,.5)}
  body.theme-dark .cost-item b{color:#f0ece4}
  body.theme-dark .specs-row{border-color:rgba(255,255,255,.1)}
  body.theme-dark .feature-badge{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);color:#f0ece4}
  body.theme-dark .desc{color:rgba(240,236,228,.75)}
  body.theme-dark .closing-brand{color:rgba(240,236,228,.35)}
  body.theme-dark .closing-msg{color:#f0ece4}
  body.theme-dark .closing{border-top-color:rgba(255,255,255,.1)}
  body.theme-dark .contact-card{background:#1a2226;box-shadow:0 16px 48px rgba(0,0,0,.3)}
  body.theme-dark .cta-headline{color:#f0ece4}
  body.theme-dark .cta-support{color:rgba(240,236,228,.5)}
  body.theme-dark .cta-btn.outlined{background:transparent;color:#f0ece4}
  .breadcrumb{font-size:12px;color:#8a857c;margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .breadcrumb .sep{opacity:.5}

  .specs-row{display:flex;border-top:1px solid #edeae4;border-bottom:1px solid #edeae4;padding:24px 0;margin-bottom:26px}
  .spec-item{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
  .spec-item svg{color:var(--brand-primary)}
  .spec-num{font-family:Georgia,serif;font-size:19px;font-weight:600;color:#1A1917}
  .spec-label{font-size:9px;color:#8a857c;text-transform:uppercase;letter-spacing:.08em}

  .costs-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:26px}
  .cost-item{font-size:13px;color:#4a4744}
  .cost-item b{color:#1A1917;font-weight:700}

  .features-section{margin-bottom:28px}
  .features-label{font-size:11px;font-weight:700;color:var(--brand-primary);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
  .feature-badges{display:flex;flex-wrap:wrap;gap:8px}
  .feature-badge{background:#f5f2ec;border:1px solid #edeae4;border-radius:100px;padding:8px 14px;font-size:12px;font-weight:600;color:#1A1917;display:inline-flex;align-items:center;gap:5px}
  .feature-badge svg{flex-shrink:0}

  .desc-section{margin-bottom:30px}
  .desc-label{font-size:11px;font-weight:700;color:var(--brand-primary);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
  .desc{font-size:14px;color:#4a4744;line-height:1.75;white-space:pre-line;position:relative}
  .desc.clamped{max-height:110px;overflow:hidden}
  .read-more{display:inline-flex;align-items:center;gap:4px;background:none;border:none;color:var(--brand-primary);font-size:13px;font-weight:600;cursor:pointer;padding:10px 0 0;font-family:inherit}

  .gallery-section{margin-bottom:10px}
  .gallery-label{font-family:Georgia,serif;font-size:22px;font-weight:400;margin-bottom:14px}
  .gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}

  /* ── Premium Contact Card (Rebrand style — dark navy info panel) ──── */
  .contact-section{padding:40px 20px 0}
  .contact-card{background:#fff;border-radius:28px;box-shadow:0 16px 48px rgba(0,0,0,.08);display:flex;overflow:hidden;margin-bottom:32px}
  .cc-info{flex:0 0 45%;padding:32px 24px;display:flex;flex-direction:column;justify-content:center;min-width:0;background:linear-gradient(160deg,#0c1420,#0f1c2c)}
  .cc-label{font-size:11px;font-weight:700;color:var(--brand-primary);text-transform:uppercase;letter-spacing:.14em;margin-bottom:14px;line-height:1.5}
  .cc-name{font-family:Georgia,serif;font-size:27px;color:#fdfbf7;line-height:1.2;margin-bottom:10px;word-break:break-word}
  .cc-company{font-size:14px;color:var(--brand-primary);font-style:italic;margin-bottom:18px}
  .cc-rule{width:32px;height:1.5px;background:var(--brand-primary);opacity:.6;margin-bottom:20px}
  .cc-actions{display:flex;flex-direction:column}
  .cc-action-row{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fdfbf7;font-size:14px;font-weight:600;padding:13px 0;transition:opacity .15s ease}
  .cc-action-row:active{opacity:.6}
  .cc-action-icon{width:36px;height:36px;border-radius:50%;border:1.3px solid rgba(201,161,74,.5);color:var(--brand-primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .cc-action-label{flex:1;min-width:0}
  .cc-action-arrow{color:var(--brand-primary);font-size:15px;flex-shrink:0;opacity:.8}
  .cc-divider{height:1px;background:rgba(255,255,255,.1)}
  .cc-photo{flex:0 0 55%;position:relative;min-height:300px;background:#e8e0d0}
  .cc-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .cc-photo-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:36px;color:rgba(201,161,74,.4);background:#f5f2ec}

  .cta-section{text-align:center;margin-bottom:28px}
  .cta-headline{font-family:Georgia,serif;font-size:26px;font-weight:400;color:#1A1917;margin-bottom:8px}
  .cta-support{font-size:14px;color:#8a857c;margin-bottom:22px;max-width:340px;margin-left:auto;margin-right:auto;line-height:1.5}
  .cta-buttons{display:flex;gap:10px}
  .cta-btn{flex:1;height:52px;border-radius:100px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
  .cta-btn.outlined{background:#fff;border:1.5px solid var(--brand-primary);color:#1A1917}
  .cta-btn.filled{background:var(--brand-primary);border:1.5px solid var(--brand-primary);color:#fff}

  .closing{text-align:center;padding:28px 20px 8px;border-top:1px solid #edeae4}
  .closing-msg{font-size:14px;color:#1A1917;font-weight:600;margin-bottom:4px}
  .closing-brand{font-family:Georgia,serif;font-size:15px;color:var(--brand-primary);font-style:italic}

  @media (max-width:480px){
    .cc-info{flex:0 0 42%;padding:20px 14px}
    .cc-photo{flex:0 0 58%;min-height:240px}
    .cc-name{font-size:19px}
    .cc-label{font-size:9px;letter-spacing:.1em;margin-bottom:8px}
    .cc-company{font-size:12px;margin-bottom:12px}
    .cc-rule{margin-bottom:14px}
    .cc-action-row{font-size:11px;padding:9px 0;gap:8px}
    .cc-action-icon{width:26px;height:26px}
    .cc-action-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cta-buttons{flex-direction:column}
  }
  /* Sticky bottom action bar */
  .sticky-bar{position:fixed;left:0;right:0;bottom:0;background:var(--brand-secondary);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:50;transform:translateY(100%);transition:transform .3s ease;box-shadow:0 -8px 24px rgba(0,0,0,.2)}
  .sticky-bar.visible{transform:translateY(0)}
  .sticky-price{font-family:Georgia,serif;font-size:16px;font-weight:600;color:var(--brand-primary);flex-shrink:0}
  .sticky-actions{display:flex;gap:8px}
  .sticky-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(201,161,74,.3);display:flex;align-items:center;justify-content:center;color:var(--brand-primary);text-decoration:none;flex-shrink:0}
  .sticky-book{background:var(--brand-primary);color:var(--brand-secondary);border:none;border-radius:100px;padding:0 18px;height:38px;font-size:12px;font-weight:700;font-family:inherit;white-space:nowrap;text-decoration:none;display:flex;align-items:center}

  #loading,#not-found{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px}

  /* Lightbox */
  #lightbox{display:none;position:fixed;inset:0;background:rgba(5,10,20,.95);z-index:100;align-items:center;justify-content:center}
  #lightbox img{max-width:92%;max-height:80%;object-fit:contain;border-radius:8px}
  #lightbox .lb-close{position:absolute;top:20px;right:20px;color:#fff;font-size:28px;background:none;border:none;cursor:pointer}
  #lightbox .hero-arrow{background:rgba(255,255,255,.15)}
</style>
</head>
<body>

<div id="loading">
  <div style="font-family:Georgia,serif;font-size:20px;color:rgba(26,25,23,.4)">Tour<em style="color:var(--brand-primary);font-style:italic">Flow</em></div>
</div>

<div id="not-found" style="display:none">
  <div style="font-size:20px;font-family:Georgia,serif;margin-bottom:8px">Listing not found</div>
  <div style="font-size:13px;color:#5a5754">This link may have expired or been removed.</div>
</div>

<div class="wrap" id="main" style="display:none">
  <div class="hero-wrap">
    <div class="hero-brand" id="hero-brand">Tour<em>Flow</em></div>
    <div class="hero-track" id="hero-track"></div>
    <div class="hero-gradient"></div>
    <button class="hero-arrow left" onclick="shiftHero(-1)">&#8249;</button>
    <button class="hero-arrow right" onclick="shiftHero(1)">&#8250;</button>
    <div class="hero-badge" id="hero-badge"></div>
    <div class="hero-content">
      <div class="hero-eyebrow" id="hero-eyebrow"></div>
      <div class="hero-title" id="title"></div>
      <div class="hero-subtitle" id="subtitle"></div>
      <div class="hero-price" id="price"></div>
      <div class="hero-highlights" id="hero-highlights"></div>
    </div>
    <div class="scroll-indicator">
      <span>Scroll to explore</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
    </div>
  </div>

  <div class="content">
    <div class="breadcrumb" id="breadcrumb"></div>

    <div class="specs-row" id="specs-row"></div>

    <div class="costs-row" id="costs-row"></div>

    <div class="features-section" id="features-section" style="display:none">
      <div class="features-label">Features</div>
      <div class="feature-badges" id="feature-badges"></div>
    </div>

    <div class="desc-section" id="desc-section" style="display:none">
      <div class="desc-label">Description</div>
      <div class="desc clamped" id="desc"></div>
      <button class="read-more" id="read-more-btn" onclick="toggleDesc()">Read More &#8250;</button>
    </div>

    <div class="gallery-section" id="gallery-section" style="display:none">
      <div class="gallery-label">Gallery</div>
      <div class="gallery" id="gallery"></div>
    </div>
  </div>

  <div id="contact-section-wrap"></div>

  <div class="closing">
    <div class="closing-msg">Thank you for your interest.</div>
    <div class="closing-brand" id="closing-brand">I look forward to hearing from you!</div>
  </div>
</div>

<div class="sticky-bar" id="sticky-bar">
  <div class="sticky-price" id="sticky-price"></div>
  <div class="sticky-actions" id="sticky-actions"></div>
</div>

<div id="lightbox" onclick="if(event.target.id==='lightbox')closeLightbox()">
  <button class="lb-close" onclick="closeLightbox()">&times;</button>
  <button class="hero-arrow left" onclick="shiftLightbox(-1)">&#8249;</button>
  <img id="lightbox-img" src=""/>
  <button class="hero-arrow right" onclick="shiftLightbox(1)">&#8250;</button>
</div>


<script>
var SUPA_URL='https://dhcqbdyrbviormfsdcyr.supabase.co';
var SUPA_KEY='sb_publishable_ZKyT9nBrTruUnVDZF0VrWQ_HefTPZB3';

function esc(s){return(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Shared component: builds the premium contact card. Used both on the
// public presentation page and in Rebrand Settings' live preview, so the
// two stay pixel-identical — copy this function verbatim if it changes.
function buildContactCardHtml(d){
  var initials=(d.agent_name||'').split(' ').map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();
  var phoneDigits=(d.agent_phone||'').replace(/[^0-9+]/g,'');
  var waMsg=encodeURIComponent('Hi, I\'m interested in '+(d.title||'this property')+'.');

  var rows=[];
  if(phoneDigits)rows.push({
    href:'https://wa.me/'+phoneDigits.replace('+','')+'?text='+waMsg,
    label:'WhatsApp',
    icon:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>'
  });
  if(d.agent_phone)rows.push({
    href:'tel:'+esc(phoneDigits),
    label:d.agent_phone,
    icon:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>'
  });
  if(d.agent_email)rows.push({
    href:'mailto:'+esc(d.agent_email),
    label:d.agent_email,
    icon:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg>'
  });

  var actionsHtml=rows.map(function(r,i){
    return (i>0?'<div class="cc-divider"></div>':'')+
      '<a class="cc-action-row" href="'+r.href+'">'+
      '<span class="cc-action-icon">'+r.icon+'</span>'+
      '<span class="cc-action-label">'+esc(r.label)+'</span>'+
      '<span class="cc-action-arrow">\u203a</span>'+
      '</a>';
  }).join('');

  return '<div class="contact-card">'+
    '<div class="cc-info">'+
    '<div class="cc-label">'+esc((d.agent_title||'Your Property Consultant').toUpperCase())+'</div>'+
    '<div class="cc-name">'+esc(d.agent_name||'Your Name')+'</div>'+
    (d.agent_agency?'<div class="cc-company">'+esc(d.agent_agency)+'</div>':'')+
    '<div class="cc-rule"></div>'+
    '<div class="cc-actions">'+actionsHtml+'</div>'+
    '</div>'+
    '<div class="cc-photo">'+(d.agent_photo?'<img src="'+esc(d.agent_photo)+'"/>':'<div class="cc-photo-fallback">'+esc(initials||'?')+'</div>')+'</div>'+
    '</div>';
}

function getParam(name){return new URLSearchParams(window.location.search).get(name);}

var images=[];
var heroIdx=0;
var lightboxIdx=0;

function showNotFound(){
  document.getElementById('loading').style.display='none';
  document.getElementById('not-found').style.display='flex';
}

function shiftHero(dir){
  if(!images.length)return;
  heroIdx=(heroIdx+dir+images.length)%images.length;
  document.getElementById('hero-track').style.transform='translateX(-'+(heroIdx*100)+'%)';
  updateHeroBadge();
}
function updateHeroBadge(){
  var badge=document.getElementById('hero-badge');
  var remaining=images.length-1-heroIdx;
  badge.innerHTML=remaining>0?('+'+remaining+' more photo'+(remaining===1?'':'s')):'';
  if(images.length<=1)badge.style.display='none';
}

function openLightbox(idx){
  lightboxIdx=idx;
  document.getElementById('lightbox-img').src=images[idx];
  document.getElementById('lightbox').style.display='flex';
  document.body.style.overflow='hidden';
}
function closeLightbox(){
  document.getElementById('lightbox').style.display='none';
  document.body.style.overflow='';
}
function shiftLightbox(dir){
  lightboxIdx=(lightboxIdx+dir+images.length)%images.length;
  document.getElementById('lightbox-img').src=images[lightboxIdx];
}

function toggleDesc(){
  var desc=document.getElementById('desc');
  var btn=document.getElementById('read-more-btn');
  var isClamped=desc.classList.contains('clamped');
  desc.classList.toggle('clamped');
  btn.innerHTML=isClamped?'Show Less &#8963;':'Read More &#8250;';
}

var SPEC_ICONS={
  Bedrooms:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a2 2 0 012-2h14a2 2 0 012 2v6"/><path d="M3 18v2M21 18v2"/><path d="M5 12V8a2 2 0 012-2h2a2 2 0 012 2v2"/><path d="M13 12V8a2 2 0 012-2h2a2 2 0 012 2v4"/></svg>',
  Bathrooms:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16a1 1 0 011 1v2a5 5 0 01-5 5H8a5 5 0 01-5-5v-2a1 1 0 011-1z"/><path d="M7 12V6a2 2 0 012-2h1"/><path d="M4 20v1M18 20v1"/></svg>',
  'Built Size':'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7"/><path d="M5 9v11h14V9"/></svg>',
  'Plot Size':'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 9h18M9 3v18"/></svg>'
};

function render(data){
  document.getElementById('loading').style.display='none';
  document.getElementById('main').style.display='block';

  // ── White-label branding ────────────────────────────────────────────
  if(data.brand_primary_color) document.documentElement.style.setProperty('--brand-primary',data.brand_primary_color);
  if(data.brand_secondary_color){
    document.documentElement.style.setProperty('--brand-secondary',data.brand_secondary_color);
    document.documentElement.style.setProperty('--brand-secondary-light',data.brand_secondary_color);
  }
  if(data.brand_theme==='dark') document.body.classList.add('theme-dark');

  var heroBrandEl=document.getElementById('hero-brand');
  var placement=data.brand_logo_placement||'top-left';
  if(data.brand_logo&&data.brand_logo_in_hero!==false&&placement!=='hidden'){
    heroBrandEl.className='hero-brand'+(placement==='top-center'?' placement-top-center':'');
    heroBrandEl.innerHTML='<img src="'+esc(data.brand_logo)+'"'+(data.brand_logo_is_white?' class="logo-white-shadow"':'')+'/>';
  } else if(data.brand_logo&&data.brand_logo_in_hero===false){
    heroBrandEl.style.display='none';
  } else if(!data.brand_logo){
    // No custom logo uploaded — keep the default TourFlow wordmark as-is
  }
  if(placement==='hidden')heroBrandEl.style.display='none';

  images=data.images||[];
  document.title=(data.title||'Property')+' — TourFlow';

  document.getElementById('hero-track').innerHTML=images.map(function(src){
    return '<img src="'+src+'" onclick="openLightbox('+images.indexOf(src)+')"/>';
  }).join('')||'<div style="width:100%;height:100%;background:#e8e0d0"></div>';
  updateHeroBadge();

  document.getElementById('hero-eyebrow').textContent=data.area||'';
  document.getElementById('title').textContent=data.title||'Property';

  var subtitleParts=[data.address].filter(Boolean);
  if(!data.address&&data.area) subtitleParts=[data.area];
  document.getElementById('subtitle').textContent=subtitleParts.join(' \u00b7 ');

  document.getElementById('price').textContent=data.price||'Price on request';

  var heroHighlights=(data.features||[]).slice(0,4);
  document.getElementById('hero-highlights').textContent=heroHighlights.join(' \u00b7 ');

  document.getElementById('breadcrumb').innerHTML='';

  var specs=[];
  if(data.rooms)specs.push({num:data.rooms,label:'Bedrooms'});
  if(data.bathrooms)specs.push({num:data.bathrooms,label:'Bathrooms'});
  if(data.sqm)specs.push({num:data.sqm+' m\u00b2',label:'Built Size'});
  if(data.plot_size)specs.push({num:data.plot_size+' m\u00b2',label:'Plot Size'});
  var specsRow=document.getElementById('specs-row');
  if(specs.length){
    specsRow.innerHTML=specs.map(function(s){
      return '<div class="spec-item">'+(SPEC_ICONS[s.label]||'')+'<div class="spec-num">'+esc(s.num)+'</div><div class="spec-label">'+esc(s.label)+'</div></div>';
    }).join('');
  } else {
    specsRow.style.display='none';
  }

  var costs=[];
  if(data.community_fee)costs.push('<span class="cost-item">Community fee <b>'+esc(data.community_fee)+'</b></span>');
  if(data.ibi)costs.push('<span class="cost-item">IBI <b>'+esc(data.ibi)+'</b></span>');
  if(data.garbage_fee)costs.push('<span class="cost-item">Garbage fee <b>'+esc(data.garbage_fee)+'</b></span>');
  if(data.energy_class)costs.push('<span class="cost-item">Energy rating <b>'+esc(data.energy_class)+'</b></span>');
  document.getElementById('costs-row').innerHTML=costs.join('');

  if(data.features&&data.features.length){
    document.getElementById('features-section').style.display='block';
    document.getElementById('feature-badges').innerHTML=data.features.map(function(f){
      return '<span class="feature-badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--brand-primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'+esc(f)+'</span>';
    }).join('');
  }

  if(data.description){
    document.getElementById('desc-section').style.display='block';
    document.getElementById('desc').textContent=data.description;
    // Only bother with the clamp/expand toggle if there's actually enough text to hide
    if(data.description.length<320){
      document.getElementById('desc').classList.remove('clamped');
      document.getElementById('read-more-btn').style.display='none';
    }
  }

  var restImages=images.slice(1);
  if(restImages.length){
    document.getElementById('gallery-section').style.display='block';
    document.getElementById('gallery').innerHTML=restImages.map(function(src){
      return '<img src="'+src+'" loading="lazy" onclick="openLightbox('+images.indexOf(src)+')" onerror="this.style.display=\'none\'"/>';
    }).join('');
  }

  if(data.agent_name){
    var phoneDigits=(data.agent_phone||'').replace(/[^0-9+]/g,'');
    var waMsgCard=encodeURIComponent('Hi, I\'m interested in '+(data.title||'this property')+'.');
    var bookMsgCard=encodeURIComponent('Hi, I\'d like to book a viewing for '+(data.title||'this property')+'.');

    var contactHtml=buildContactCardHtml(data);

    var ctaHtml='<div class="cta-section">'+
      '<div class="cta-headline">Let\u2019s find your perfect home</div>'+
      '<div class="cta-support">I\u2019m happy to answer your questions or arrange a private viewing.</div>'+
      '<div class="cta-buttons">'+
      (data.agent_phone?'<a class="cta-btn outlined" href="tel:'+esc(phoneDigits)+'"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>Call</a>':'')+
      (phoneDigits?'<a class="cta-btn filled" href="https://wa.me/'+phoneDigits.replace('+','')+'?text='+waMsgCard+'"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>WhatsApp</a>':'')+
      (phoneDigits?'<a class="cta-btn outlined" href="https://wa.me/'+phoneDigits.replace('+','')+'?text='+bookMsgCard+'"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Book Viewing</a>':'')+
      '</div></div>';

    document.getElementById('contact-section-wrap').innerHTML=
      '<div class="contact-section">'+contactHtml+ctaHtml+'</div>';
  }

  // ── Sticky bottom action bar ─────────────────────────────────────────
  document.getElementById('sticky-price').textContent=data.price||'';
  var phoneDigits=(data.agent_phone||'').replace(/[^0-9+]/g,'');
  var stickyActions=[];
  if(phoneDigits){
    stickyActions.push('<a class="sticky-btn" href="tel:'+esc(phoneDigits)+'" title="Call"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg></a>');
    var waMsg=encodeURIComponent('Hi, I\'m interested in '+(data.title||'this property')+'.');
    stickyActions.push('<a class="sticky-btn" href="https://wa.me/'+phoneDigits.replace('+','')+'?text='+waMsg+'" title="WhatsApp"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg></a>');
    var bookMsg=encodeURIComponent('Hi, I\'d like to book a viewing for '+(data.title||'this property')+'.');
    stickyActions.push('<a class="sticky-book" href="https://wa.me/'+phoneDigits.replace('+','')+'?text='+bookMsg+'">Book Viewing</a>');
  } else if(data.agent_email){
    stickyActions.push('<a class="sticky-book" href="mailto:'+esc(data.agent_email)+'">Enquire</a>');
  }
  document.getElementById('sticky-actions').innerHTML=stickyActions.join('');

  if(stickyActions.length){
    var pastHero=false;
    var reachedCta=false;
    function updateStickyBar(){
      var bar=document.getElementById('sticky-bar');
      bar.classList.toggle('visible', pastHero && !reachedCta);
    }
    window.addEventListener('scroll',function(){
      pastHero=window.scrollY>window.innerHeight*0.6;
      updateStickyBar();
    },{passive:true});

    // Once the full contact card / CTA section is on screen, the sticky bar
    // would just repeat the same three buttons right above it — hide it
    // there and only bring it back if the person scrolls back up past it.
    var ctaSection=document.querySelector('.contact-section');
    if(ctaSection&&'IntersectionObserver' in window){
      new IntersectionObserver(function(entries){
        reachedCta=entries[0].isIntersecting;
        updateStickyBar();
      },{threshold:0.15}).observe(ctaSection);
    }
  }
}

var id=getParam('id');
if(!id){
  showNotFound();
} else {
  fetch(SUPA_URL+'/rest/v1/rebrand_listings?id=eq.'+encodeURIComponent(id)+'&select=title,price,rooms,bathrooms,sqm,plot_size,area,address,description,images,agent_name,agent_title,agent_agency,agent_phone,agent_email,agent_photo,community_fee,ibi,garbage_fee,features,energy_class,brand_company_name,brand_logo,brand_logo_is_white,brand_primary_color,brand_secondary_color,brand_logo_placement,brand_theme,brand_logo_in_hero',{
    headers:{'apikey':SUPA_KEY}
  })
  .then(function(r){return r.json();})
  .then(function(rows){
    if(!rows||!rows.length){showNotFound();return;}
    render(rows[0]);
  })
  .catch(function(){showNotFound();});
}
</script>
</body>
</html>
