<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Property — TourFlow</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#FCFBF7;color:#1A1917;min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:0 0 60px}

  /* Hero carousel */
  .hero-wrap{position:relative;width:100%;aspect-ratio:4/3;background:#e8e0d0;overflow:hidden}
  .hero-track{display:flex;height:100%;transition:transform .3s ease}
  .hero-track img{width:100%;height:100%;object-fit:cover;flex-shrink:0}
  .hero-arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(7,18,38,.55);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5}
  .hero-arrow.left{left:12px}.hero-arrow.right{right:12px}
  .hero-badge{position:absolute;bottom:14px;right:14px;background:rgba(7,18,38,.72);color:#fff;font-size:12px;font-weight:600;padding:8px 14px;border-radius:100px;display:flex;align-items:center;gap:6px}
  .hero-brand{position:absolute;top:16px;left:18px;font-family:Georgia,serif;font-size:16px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4)}
  .hero-brand em{font-style:italic;color:#C9A14A}

  .content{padding:22px 20px 0}
  .breadcrumb{font-size:12px;color:#8a857c;margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .breadcrumb .sep{opacity:.5}

  h1{font-family:Georgia,serif;font-weight:400;font-size:30px;margin:0 0 6px;line-height:1.15}
  .subtitle{font-size:15px;color:#5a5754;margin-bottom:20px}

  .specs-row{display:flex;border-top:1px solid #edeae4;border-bottom:1px solid #edeae4;padding:16px 0;margin-bottom:20px}
  .spec-item{flex:1;text-align:center;border-right:1px solid #edeae4}
  .spec-item:last-child{border-right:none}
  .spec-num{font-family:Georgia,serif;font-size:20px;font-weight:600;color:#1A1917}
  .spec-label{font-size:10px;color:#8a857c;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

  .price-block{margin-bottom:22px}
  .price-label{font-size:11px;color:#8a857c;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
  .price{font-family:Georgia,serif;font-size:28px;font-weight:600;color:#C9A14A}

  .costs-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:22px}
  .cost-item{font-size:13px;color:#4a4744}
  .cost-item b{color:#1A1917;font-weight:700}

  .features-section{margin-bottom:26px}
  .features-label{font-size:11px;font-weight:700;color:#C9A14A;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
  .feature-badges{display:flex;flex-wrap:wrap;gap:8px}
  .feature-badge{background:#f5f2ec;border:1px solid #edeae4;border-radius:100px;padding:8px 14px;font-size:12px;font-weight:600;color:#1A1917;display:inline-flex;align-items:center;gap:5px}
  .feature-badge svg{flex-shrink:0}

  .desc-section{margin-bottom:28px}
  .desc-label{font-size:11px;font-weight:700;color:#C9A14A;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
  .desc{font-size:14px;color:#4a4744;line-height:1.75;white-space:pre-line;position:relative}
  .desc.clamped{max-height:110px;overflow:hidden}
  .read-more{display:inline-flex;align-items:center;gap:4px;background:none;border:none;color:#C9A14A;font-size:13px;font-weight:600;cursor:pointer;padding:10px 0 0;font-family:inherit}

  .gallery-section{margin-bottom:10px}
  .gallery-label{font-family:Georgia,serif;font-size:22px;font-weight:400;margin-bottom:14px}
  .gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}

  .closing{text-align:center;padding:32px 20px 8px}
  .closing-brand{font-family:Georgia,serif;font-size:15px;color:rgba(26,25,23,.35)}
  .closing-brand em{font-style:italic;color:#C9A14A}

  .agent-card{margin:8px 20px 0;background:linear-gradient(145deg,#071226,#0d1c30);border-radius:20px;overflow:hidden;box-shadow:0 12px 32px rgba(7,18,38,.2);display:flex;align-items:stretch}
  .agent-photo{width:110px;flex-shrink:0;background:#0d1c30;position:relative;overflow:hidden}
  .agent-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .agent-photo-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:26px;color:rgba(201,161,74,.4)}
  .agent-info{padding:18px 18px 18px 16px;flex:1;min-width:0}
  .agent-label{font-size:9px;font-weight:600;color:#C9A14A;text-transform:uppercase;letter-spacing:.16em;margin-bottom:6px}
  .agent-name{font-family:Georgia,serif;font-size:20px;color:#fff;line-height:1.15;margin-bottom:2px}
  .agent-agency{font-size:12px;color:rgba(255,255,255,.4);font-style:italic;margin-bottom:12px}
  .agent-actions{display:flex;gap:8px}
  .agent-action{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(201,161,74,.3);display:flex;align-items:center;justify-content:center;color:#C9A14A;text-decoration:none}

  #loading,#not-found{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px}

  /* Lightbox */
  #lightbox{display:none;position:fixed;inset:0;background:rgba(5,10,20,.95);z-index:100;align-items:center;justify-content:center}
  #lightbox img{max-width:92%;max-height:80%;object-fit:contain;border-radius:8px}
  #lightbox .lb-close{position:absolute;top:20px;right:20px;color:#fff;font-size:28px;background:none;border:none;cursor:pointer}
  #lightbox .hero-arrow{background:rgba(255,255,255,.15)}
</style>
</head>
<body>

<div id="loading">
  <div style="font-family:Georgia,serif;font-size:20px;color:rgba(26,25,23,.4)">Tour<em style="color:#C9A14A;font-style:italic">Flow</em></div>
</div>

<div id="not-found" style="display:none">
  <div style="font-size:20px;font-family:Georgia,serif;margin-bottom:8px">Listing not found</div>
  <div style="font-size:13px;color:#5a5754">This link may have expired or been removed.</div>
</div>

<div class="wrap" id="main" style="display:none">
  <div class="hero-wrap">
    <div class="hero-brand">Tour<em>Flow</em></div>
    <div class="hero-track" id="hero-track"></div>
    <button class="hero-arrow left" onclick="shiftHero(-1)">&#8249;</button>
    <button class="hero-arrow right" onclick="shiftHero(1)">&#8250;</button>
    <div class="hero-badge" id="hero-badge"></div>
  </div>

  <div class="content">
    <div class="breadcrumb" id="breadcrumb"></div>
    <h1 id="title"></h1>
    <div class="subtitle" id="subtitle"></div>

    <div class="specs-row" id="specs-row"></div>

    <div class="price-block">
      <div class="price-label">Asking Price</div>
      <div class="price" id="price"></div>
    </div>

    <div class="costs-row" id="costs-row"></div>

    <div class="features-section" id="features-section" style="display:none">
      <div class="features-label">Features</div>
      <div class="feature-badges" id="feature-badges"></div>
    </div>

    <div class="desc-section" id="desc-section" style="display:none">
      <div class="desc-label">Description</div>
      <div class="desc clamped" id="desc"></div>
      <button class="read-more" id="read-more-btn" onclick="toggleDesc()">Read More &#8250;</button>
    </div>

    <div class="gallery-section" id="gallery-section" style="display:none">
      <div class="gallery-label">Gallery</div>
      <div class="gallery" id="gallery"></div>
    </div>
  </div>

  <div id="agent-card-wrap"></div>

  <div class="closing">
    <div class="closing-brand">Presented via Tour<em>Flow</em></div>
  </div>
</div>

<div id="lightbox" onclick="if(event.target.id==='lightbox')closeLightbox()">
  <button class="lb-close" onclick="closeLightbox()">&times;</button>
  <button class="hero-arrow left" onclick="shiftLightbox(-1)">&#8249;</button>
  <img id="lightbox-img" src=""/>
  <button class="hero-arrow right" onclick="shiftLightbox(1)">&#8250;</button>
</div>

<script>
var SUPA_URL='https://dhcqbdyrbviormfsdcyr.supabase.co';
var SUPA_KEY='sb_publishable_ZKyT9nBrTruUnVDZF0VrWQ_HefTPZB3';

function esc(s){return(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function getParam(name){return new URLSearchParams(window.location.search).get(name);}

var images=[];
var heroIdx=0;
var lightboxIdx=0;

function showNotFound(){
  document.getElementById('loading').style.display='none';
  document.getElementById('not-found').style.display='flex';
}

function shiftHero(dir){
  if(!images.length)return;
  heroIdx=(heroIdx+dir+images.length)%images.length;
  document.getElementById('hero-track').style.transform='translateX(-'+(heroIdx*100)+'%)';
  updateHeroBadge();
}
function updateHeroBadge(){
  var badge=document.getElementById('hero-badge');
  var remaining=images.length-1-heroIdx;
  badge.innerHTML=remaining>0?('+'+remaining+' more photo'+(remaining===1?'':'s')):'';
  if(images.length<=1)badge.style.display='none';
}

function openLightbox(idx){
  lightboxIdx=idx;
  document.getElementById('lightbox-img').src=images[idx];
  document.getElementById('lightbox').style.display='flex';
  document.body.style.overflow='hidden';
}
function closeLightbox(){
  document.getElementById('lightbox').style.display='none';
  document.body.style.overflow='';
}
function shiftLightbox(dir){
  lightboxIdx=(lightboxIdx+dir+images.length)%images.length;
  document.getElementById('lightbox-img').src=images[lightboxIdx];
}

function toggleDesc(){
  var desc=document.getElementById('desc');
  var btn=document.getElementById('read-more-btn');
  var isClamped=desc.classList.contains('clamped');
  desc.classList.toggle('clamped');
  btn.innerHTML=isClamped?'Show Less &#8963;':'Read More &#8250;';
}

function render(data){
  document.getElementById('loading').style.display='none';
  document.getElementById('main').style.display='block';

  images=data.images||[];
  document.title=(data.title||'Property')+' — TourFlow';

  document.getElementById('hero-track').innerHTML=images.map(function(src){
    return '<img src="'+src+'" onclick="openLightbox('+images.indexOf(src)+')"/>';
  }).join('')||'<div style="width:100%;height:100%;background:#e8e0d0"></div>';
  updateHeroBadge();

  var breadcrumbParts=[data.area].filter(Boolean);
  document.getElementById('breadcrumb').innerHTML=breadcrumbParts.length?
    breadcrumbParts.map(function(p){return esc(p);}).join(' <span class="sep">/</span> '):'';

  document.getElementById('title').textContent=data.title||'Property';

  var subtitleParts=[data.area,data.address].filter(Boolean);
  document.getElementById('subtitle').textContent=subtitleParts.join(' · ');

  var specs=[];
  if(data.rooms)specs.push({num:data.rooms,label:'Bedrooms'});
  if(data.bathrooms)specs.push({num:data.bathrooms,label:'Bathrooms'});
  if(data.sqm)specs.push({num:data.sqm+' m\u00b2',label:'Built Size'});
  if(data.plot_size)specs.push({num:data.plot_size+' m\u00b2',label:'Plot Size'});
  var specsRow=document.getElementById('specs-row');
  if(specs.length){
    specsRow.innerHTML=specs.map(function(s){
      return '<div class="spec-item"><div class="spec-num">'+esc(s.num)+'</div><div class="spec-label">'+esc(s.label)+'</div></div>';
    }).join('');
  } else {
    specsRow.style.display='none';
  }

  document.getElementById('price').textContent=data.price||'Price on request';

  var costs=[];
  if(data.community_fee)costs.push('<span class="cost-item">Community fee <b>'+esc(data.community_fee)+'</b></span>');
  if(data.ibi)costs.push('<span class="cost-item">IBI <b>'+esc(data.ibi)+'</b></span>');
  if(data.garbage_fee)costs.push('<span class="cost-item">Garbage fee <b>'+esc(data.garbage_fee)+'</b></span>');
  if(data.energy_class)costs.push('<span class="cost-item">Energy rating <b>'+esc(data.energy_class)+'</b></span>');
  document.getElementById('costs-row').innerHTML=costs.join('');

  if(data.features&&data.features.length){
    document.getElementById('features-section').style.display='block';
    document.getElementById('feature-badges').innerHTML=data.features.map(function(f){
      return '<span class="feature-badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#C9A14A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'+esc(f)+'</span>';
    }).join('');
  }

  if(data.description){
    document.getElementById('desc-section').style.display='block';
    document.getElementById('desc').textContent=data.description;
    // Only bother with the clamp/expand toggle if there's actually enough text to hide
    if(data.description.length<320){
      document.getElementById('desc').classList.remove('clamped');
      document.getElementById('read-more-btn').style.display='none';
    }
  }

  var restImages=images.slice(1);
  if(restImages.length){
    document.getElementById('gallery-section').style.display='block';
    document.getElementById('gallery').innerHTML=restImages.map(function(src){
      return '<img src="'+src+'" loading="lazy" onclick="openLightbox('+images.indexOf(src)+')" onerror="this.style.display=\'none\'"/>';
    }).join('');
  }

  if(data.agent_name){
    var initials=data.agent_name.split(' ').map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();
    var phoneDigits=(data.agent_phone||'').replace(/[^0-9+]/g,'');
    document.getElementById('agent-card-wrap').innerHTML=
      '<div class="agent-card">'+
      '<div class="agent-photo">'+
      (data.agent_photo?'<img src="'+esc(data.agent_photo)+'"/>':'<div class="agent-photo-fallback">'+esc(initials)+'</div>')+
      '</div>'+
      '<div class="agent-info">'+
      '<div class="agent-label">'+esc(data.agent_title||'Your Property Consultant')+'</div>'+
      '<div class="agent-name">'+esc(data.agent_name)+'</div>'+
      (data.agent_agency?'<div class="agent-agency">'+esc(data.agent_agency)+'</div>':'')+
      '<div class="agent-actions">'+
      (phoneDigits?'<a class="agent-action" href="https://wa.me/'+phoneDigits.replace('+','')+'" title="WhatsApp"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg></a>':'')+
      (data.agent_phone?'<a class="agent-action" href="tel:'+esc(phoneDigits)+'" title="Call"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg></a>':'')+
      (data.agent_email?'<a class="agent-action" href="mailto:'+esc(data.agent_email)+'" title="Email"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z" opacity="0"/><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg></a>':'')+
      '</div></div></div>';
  }
}

var id=getParam('id');
if(!id){
  showNotFound();
} else {
  fetch(SUPA_URL+'/rest/v1/rebrand_listings?id=eq.'+encodeURIComponent(id)+'&select=title,price,rooms,bathrooms,sqm,plot_size,area,address,description,images,agent_name,agent_title,agent_agency,agent_phone,agent_email,agent_photo,community_fee,ibi,garbage_fee,features,energy_class',{
    headers:{'apikey':SUPA_KEY}
  })
  .then(function(r){return r.json();})
  .then(function(rows){
    if(!rows||!rows.length){showNotFound();return;}
    render(rows[0]);
  })
  .catch(function(){showNotFound();});
}
</script>
</body>
</html>
